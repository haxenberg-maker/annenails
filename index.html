<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Programări Unghii</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FBF3EE;
    --surface:#FFFFFF;
    --border:#F0DFD6;
    --ink:#2B211F;
    --ink-soft:#7A6A64;
    --accent:#9B2247;
    --accent-dark:#7A1836;
    --accent-soft:#F3D9DE;
    --success:#4C7A5D;
    --success-soft:#E4EEE6;
    --muted:#B3A29B;
    --warn:#B8860B;
    --info:#2E5F8A;
    --job-block:#8C7B74;
    --job-block-soft:#EDE7E3;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow:0 10px 28px rgba(43,33,31,0.10);
    --font-display:'Fraunces', serif;
    --font-body:'Work Sans', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  #app{ max-width:480px; margin:0 auto; min-height:100%; position:relative; padding-bottom:96px; }
  @media (min-width:780px){
    #app{ max-width:940px; }
  }

  /* ---------- TOASTS ---------- */
  .toast-container{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:80;
    display:flex; flex-direction:column; gap:8px; align-items:center; max-width:92vw;
  }
  .toast{
    padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:600; color:#fff;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; white-space:nowrap;
    max-width:92vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast-saving{ background:var(--info); }
  .toast-success{ background:var(--success); }
  .toast-error{ background:var(--accent-dark); }
  .toast-warning{ background:var(--warn); }
  .toast-info{ background:var(--ink); }
  .toast-spin{ width:12px; height:12px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; flex:none; }

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; max-width:480px; margin:0 auto;
  }
  .login-card{ width:100%; }
  .login-mark{
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:24px; font-weight:600;
    margin:0 auto 18px auto;
  }
  .login-title{
    font-family:var(--font-display); font-weight:600; font-size:26px;
    text-align:center; margin:0 0 6px 0;
  }
  .login-sub{
    text-align:center; color:var(--ink-soft); font-size:14px; margin:0 0 28px 0;
  }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; padding:12px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface);
    font-size:15px; color:var(--ink); outline:none;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); }
  .btn-primary{
    width:100%; padding:13px 14px; border-radius:var(--radius-sm);
    background:var(--accent); color:#fff; border:none; font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-primary:disabled{ opacity:.6; cursor:default; }
  .btn-outline{
    padding:9px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent-dark); }
  .error-text{ color:var(--accent); font-size:13.5px; margin:0 0 14px 0; }
  .success-text{ color:var(--success); font-size:13.5px; margin:0 0 14px 0; }

  /* ---------- HEADER ---------- */
  header.top{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:18px 18px 14px 18px; border-bottom:1px solid var(--border);
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; flex-direction:column; }
  .brand-title-row{ display:flex; align-items:center; gap:7px; }
  .brand-title{ font-family:var(--font-display); font-weight:600; font-size:20px; }
  .conn-dot{ width:9px; height:9px; border-radius:50%; background:var(--success); flex:none; }
  .conn-dot.offline{ background:var(--warn); }
  .brand-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .header-actions{ display:flex; gap:8px; }
  .icon-btn{
    position:relative;
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .badge-count{
    position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 4px;
    border-radius:999px; background:var(--warn); color:#fff; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1; border:2px solid var(--bg);
  }

  /* ---------- BOARD: mini calendar + agenda ---------- */
  .board{ display:grid; grid-template-columns:1fr; gap:18px; padding:18px; }
  @media (min-width:780px){
    .board{ grid-template-columns:320px 1fr; align-items:start; }
  }
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px; box-shadow:var(--shadow);
  }
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-month-label{ font-family:var(--font-display); font-weight:600; font-size:17px; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .cal-nav button:hover{ border-color:var(--accent); color:var(--accent); }
  .cal-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
    font-size:11px; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.02em;
  }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-cell{
    position:relative; aspect-ratio:1/1; border:none; background:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:13.5px; color:var(--ink);
  }
  .cal-cell.empty{ pointer-events:none; }
  .cal-cell:not(.empty):hover{ background:var(--accent-soft); }
  .cal-cell.today .cal-daynum{ font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  .cal-cell.selected{ background:var(--accent); }
  .cal-cell.selected .cal-daynum{ color:#fff; font-weight:700; }
  .cal-lines{
    position:absolute; bottom:4px; left:15%; right:15%; height:3px;
    display:flex; gap:1.5px; align-items:flex-end;
  }
  .cal-line{ flex:1; height:3px; border-radius:2px; min-width:2px; }
  .cal-cell.selected .cal-line{ background:#fff !important; opacity:.85; }
  .cal-today-btn{
    margin-top:14px; width:100%; padding:9px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--bg); font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .cal-today-btn:hover{ border-color:var(--accent); color:var(--accent-dark); }

  .agenda-employee{ font-size:12.5px; color:var(--ink-soft); }
  .agenda-date{ font-family:var(--font-display); font-weight:600; font-size:19px; margin-top:2px; margin-bottom:16px; }

  .day-state{ text-align:center; color:var(--ink-soft); font-size:14px; padding:48px 12px; }

  .appt-card{
    display:flex; gap:14px; align-items:flex-start; background:var(--bg);
    border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:var(--radius-md); padding:14px 14px; margin-bottom:10px; cursor:pointer;
  }
  .appt-card:hover{ box-shadow:0 4px 14px rgba(43,33,31,.08); }
  .appt-time{
    flex:none; width:56px; font-family:var(--font-display); font-weight:600;
    font-size:15px; line-height:1.25; color:var(--accent-dark); padding-top:1px;
  }
  .appt-time small{ display:block; font-weight:400; color:var(--ink-soft); font-size:12px; }
  .appt-body{ flex:1; min-width:0; }
  .appt-client{ font-weight:600; font-size:15px; }
  .appt-service{ font-size:13.5px; color:var(--ink-soft); margin-top:2px; display:flex; align-items:center; gap:6px; }
  .appt-service .swatch{ width:9px; height:9px; border-radius:50%; flex:none; }
  .appt-tag{
    display:inline-block; margin-top:6px; margin-right:6px; font-size:11.5px; padding:2px 8px;
    border-radius:20px; background:var(--muted); color:#fff;
  }
  .appt-tag.pending-tag{ background:var(--warn); }
  .appt-cancel{
    flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
  }
  .appt-cancel:hover{ border-color:var(--accent); color:var(--accent); }
  .appt-card.cancelled{ opacity:.55; border-left-color:var(--muted) !important; }
  .appt-card.cancelled .appt-client, .appt-card.cancelled .appt-service{ text-decoration:line-through; }

  /* ---------- Reamintire: Copiază mesaj + WhatsApp ---------- */
  .reminder-actions{ display:flex; flex-direction:column; gap:6px; flex:none; }
  .reminder-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    text-decoration:none; cursor:pointer;
  }
  .reminder-copy-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .reminder-wa-btn{ border-color:#25D36655; color:#25D366; }
  .reminder-wa-btn:hover{ border-color:#25D366; background:#25D36618; }
  .unconf-card .reminder-actions{ flex-direction:row; margin-top:8px; }

  .block-card{
    display:flex; gap:14px; align-items:flex-start; background:var(--job-block-soft);
    border:1px dashed var(--job-block); border-left:4px solid var(--job-block);
    border-radius:var(--radius-md); padding:14px 14px; margin-bottom:10px;
  }
  .block-time{
    flex:none; width:56px; font-family:var(--font-display); font-weight:600;
    font-size:15px; line-height:1.25; color:var(--job-block); padding-top:1px;
  }
  .block-time small{ display:block; font-weight:400; color:var(--ink-soft); font-size:12px; }
  .block-body{ flex:1; min-width:0; }
  .block-label{ font-weight:600; font-size:14px; color:var(--ink); }
  .block-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .current-slot-box{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); font-family:var(--font-display); font-weight:600; font-size:15px;
  }

  .history-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .history-row:last-child{ border-bottom:none; }
  .history-date{ font-size:12px; color:var(--ink-soft); flex:none; width:90px; }
  .history-mid{ flex:1; min-width:0; font-size:13.5px; font-weight:600; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .history-price{ font-size:12.5px; color:var(--ink-soft); flex:none; }
  .history-status{ font-size:10.5px; padding:2px 7px; border-radius:20px; background:var(--muted); color:#fff; }

  .unconf-card{
    background:var(--bg); border:1px solid var(--border); border-left:4px solid var(--warn);
    border-radius:var(--radius-md); padding:14px; margin-bottom:10px;
  }
  .unconf-top{ margin-bottom:12px; }
  .unconf-client{ font-weight:600; font-size:15px; }
  .unconf-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .unconf-actions{ display:flex; gap:8px; }
  .unconf-actions button{ flex:1; padding:9px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; border:none; color:#fff; }
  .btn-confirm{ background:var(--success); }
  .btn-confirm:hover{ opacity:.9; }
  .btn-decline{ background:var(--accent); }
  .btn-decline:hover{ background:var(--accent-dark); }

  .spinner{
    width:22px; height:22px; border-radius:50%; border:3px solid var(--border);
    border-top-color:var(--accent); animation:spin .7s linear infinite; margin:36px auto;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:24px; bottom:24px; z-index:6;
    background:var(--accent); color:#fff; border:none; border-radius:18px;
    padding:14px 20px; font-size:14.5px; font-weight:600; box-shadow:0 12px 24px rgba(155,34,71,0.35);
    display:flex; align-items:center; gap:8px;
  }
  .fab:hover{ background:var(--accent-dark); }

  /* ---------- Setări: secțiune pliabilă „Interval orar” ---------- */
  #hoursDetails{ padding:0; }
  #hoursDetails > summary{ list-style:none; cursor:pointer; }
  #hoursDetails > summary::-webkit-details-marker{ display:none; }
  .hours-summary{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .hours-summary-toggle{
    font-size:12.5px; font-weight:600; color:var(--accent);
    border:1px solid var(--accent); border-radius:999px; padding:6px 12px; flex:none;
  }
  #hoursDetails[open] .hours-summary-toggle::after{ content:' (ascunde)'; }
  .hours-details-body{ margin-top:14px; }

  /* ---------- MODAL (centrat pe ecran) ---------- */
  dialog{
    border:none; padding:0; width:90%; max-width:440px;
    top:50%; left:50%; right:auto; bottom:auto; margin:0;
    transform:translate(-50%, -50%);
    border-radius:var(--radius-lg); box-shadow:var(--shadow); max-height:88vh;
  }
  dialog::backdrop{ background:rgba(43,33,31,0.45); }
  dialog[open]{
    display:flex; flex-direction:column;
    animation:modalPop .18s ease-out;
  }
  @keyframes modalPop{
    from{ transform:translate(-50%, -50%) scale(.96); opacity:0; }
    to{ transform:translate(-50%, -50%) scale(1); opacity:1; }
  }
  .sheet-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 12px 18px; border-bottom:1px solid var(--border); flex:none;
  }
  .sheet-title{ font-family:var(--font-display); font-weight:600; font-size:19px; }
  .sheet-body{ padding:16px 18px; overflow-y:auto; flex:1; }
  .sheet-footer{ padding:14px 18px 20px 18px; border-top:1px solid var(--border); flex:none; }

  .field select{
    width:100%; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:15px; color:var(--ink); appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237A6A64' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .modal-date-row{ display:flex; align-items:center; gap:8px; }
  .date-arrow-sm{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .date-arrow-sm:hover{ border-color:var(--accent); color:var(--accent); }
  .date-picker-wrap{ position:relative; flex:1; }
  .date-label{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:11px 12px; font-family:var(--font-display);
    font-size:15px; font-weight:600; color:var(--ink); text-align:center;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .date-input-hidden{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .link-btn{
    background:none; border:none; color:var(--accent-dark); font-size:13.5px; font-weight:600;
    padding:2px 0; margin-top:-4px; margin-bottom:14px;
  }
  .new-client-box{
    background:var(--bg); border:1px dashed var(--border); border-radius:var(--radius-sm);
    padding:12px; margin:-6px 0 14px 0;
  }
  .new-client-box .field{ margin-bottom:8px; }
  .new-client-box .btn-secondary{
    width:100%; padding:9px; border-radius:var(--radius-sm); border:none;
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
  }
  .slots-label{ font-size:13.5px; color:var(--ink-soft); margin:4px 0 10px 0; }
  .slots-wrap{ display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }
  .slot-btn{
    width:100%; display:flex; align-items:center; gap:9px; text-align:left;
    padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:14px; font-weight:600; color:var(--accent-dark);
  }
  .slot-btn .dot{ width:6px; height:6px; border-radius:50%; background:var(--success); flex:none; }
  .slot-btn.selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .slot-btn.selected .dot{ background:#fff; }
  .hint-text{ font-size:13.5px; color:var(--ink-soft); }

  /* ---------- CLIENT PICKER ---------- */
  .client-search-input{
    width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:14px; margin-bottom:8px;
  }
  .client-list{ max-height:210px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
  .client-row{
    width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px;
    border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); text-align:left; cursor:pointer;
  }
  .client-row:hover{ border-color:var(--accent); }
  .client-row-actions{ display:flex; gap:6px; flex:none; margin-left:auto; }
  .icon-btn-sm{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--bg);
    color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn-sm:hover{ border-color:var(--accent); color:var(--accent); }
  .client-row-delete:hover{ border-color:var(--accent); color:var(--accent); }
  .client-avatar{
    flex:none; width:34px; height:34px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent-dark); font-weight:700; font-size:12.5px; display:flex; align-items:center; justify-content:center;
  }
  .client-row-info{ display:flex; flex-direction:column; min-width:0; }
  .client-row-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .client-row-name em{ font-style:normal; color:var(--warn); font-weight:600; font-size:11px; margin-left:4px; }
  .client-row-phone{ font-size:12px; color:var(--ink-soft); }
  .client-empty{ font-size:13px; color:var(--ink-soft); padding:10px 4px; }
  .client-selected{
    display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:var(--bg); margin-bottom:8px;
  }
  .client-selected .client-row-info{ flex:1; }
  .client-change-btn{ flex:none; padding:6px 10px; font-size:12px; }

  /* ---------- SETTINGS ---------- */
  .settings-section{ margin-bottom:18px; }
  .settings-section h2{ font-family:var(--font-display); font-weight:600; font-size:17px; margin:0 0 4px 0; }
  .settings-section .settings-hint{ font-size:13px; color:var(--ink-soft); margin:0 0 14px 0; }
  .wd-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .wd-row:last-child{ border-bottom:none; }
  .wd-label{ flex:none; width:96px; font-weight:600; font-size:13.5px; }
  .wd-date{ display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .wd-times{ display:flex; align-items:center; gap:6px; flex:1; justify-content:flex-end; }
  .time-input{
    padding:8px 9px; border:1px solid var(--border); border-radius:8px;
    font-size:13.5px; width:98px; color:var(--ink); background:var(--surface);
  }
  .time-input:disabled{ background:var(--bg); color:var(--muted); }

  if (!phone) return '';

  if (digits.startsWith('0')) digits = '40' + digits.slice(1);

}

function hexToRgba(hex, alpha){
  let h = (hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const num = parseInt(h, 16);
  if (isNaN(num)) return `rgba(179,162,155,${alpha})`;
  const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function ensureToastContainer(){
  if (document.getElementById('toastContainer')) return;
  const el = document.createElement('div');
  el.id = 'toastContainer';
  el.className = 'toast-container';
  document.body.appendChild(el);
}

function showToast(message, type, opts){
  opts = opts || {};
  ensureToastContainer();
  const container = document.getElementById('toastContainer');
  const id = opts.id || uid('toast');
  let el = document.getElementById(id);
  if (!el){
    el = document.createElement('div');
    el.id = id;
    container.appendChild(el);
  }
  el.className = `toast toast-${type || 'info'}`;
  el.innerHTML = (type === 'saving' ? '<span class="toast-spin"></span>' : '') + `<span>${escapeHtml(message)}</span>`;
  clearTimeout(el._hideTimer);
  if (!opts.persist){
    el._hideTimer = setTimeout(() => { el.remove(); }, opts.autoHide || 2200);
  }
  return id;
}
function updateToast(id, message, type, autoHide){
  showToast(message, type, { id, persist: !autoHide, autoHide });

      const idx = state.clients.findIndex(c => c.id === item.id);
      if (idx >= 0) state.clients[idx] = real;
    } catch (e){
      if (isNetworkError(e)) remainingClients.push(item);
      // altfel: cerere invalidă -> renunțăm la ea, nu blocăm restul cozii
    }
  }

  for (const item of state.pendingAppointments){
    try {
      const payload = Object.assign({}, item.payload);
      if (clientIdMap[payload.clientId]) payload.clientId = clientIdMap[payload.clientId];
      if (String(payload.clientId).startsWith('offline-client')){
        remainingAppointments.push(item); // clienta ei încă nu s-a sincronizat
        continue;
      }
      await addAppointment({
        employeeId: payload.employeeId,
        clientId: payload.clientId,
        serviceId: payload.serviceId,
        start: new Date(payload.start),
        end: new Date(payload.end),
        notes: payload.notes,
        status: payload.status || 'unconfirmed',
      });
      syncedAppointments++;
    } catch (e){
      if (isNetworkError(e)) remainingAppointments.push(item);
      // altfel (ex: suprapunere) -> renunțăm la acea programare, e un caz marginal
    }
  }

  state.pendingClients = remainingClients;
  state.pendingAppointments = remainingAppointments;
  savePendingClients();
  savePendingAppointments();
  state.clients = state.clients.filter(c => !c.pendingOffline || remainingClients.some(i => i.id === c.id));

  // Reconciliem cache-ul: re-descărcăm intervalul cunoscut (înlocuiește
  // intrările optimiste sincronizate cu rândurile reale), apoi re-adăugăm
  // programările care încă n-au reușit să se sincronizeze.
  await forceRefreshCache();
  mergePendingIntoCache();

  if (syncedAppointments > 0 || syncedClients > 0){
    updateToast(toastId, `Reconectat! Am sincronizat ${syncedAppointments} programări și ${syncedClients} cliente noi efectuate offline.`, 'success', 3600);
  } else {
    dismissToast(toastId);
  }

  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();
}

/** Creează o clientă cu suport offline: dacă rețeaua nu răspunde, o salvează
 * local (coadă `pending_clients`) și o pune la dispoziție instant în UI. */
async function createClientSmart(name, phone){
  if (navigator.onLine){
    try {
      const client = await addClient({ name, phone });
      // Adăugăm clienta nou-creată în lista globală imediat, ca să fie
      // disponibilă instant în orice picker/căutare din aplicație.
      state.clients.push(client);
      state.clients.sort((a, b) => a.name.localeCompare(b.name));
      return { ok: true, offline: false, client };
    } catch (e){
      if (!isNetworkError(e)) throw e;
    }
  }
  const item = queueOfflineClient({ name, phone });
  const localClient = { id: item.id, name, phone, pendingOffline: true };
  state.clients.push(localClient);
  state.clients.sort((a, b) => a.name.localeCompare(b.name));
  return { ok: true, offline: true, client: localClient };
}

/* ====================== CACHE: bulk load & filtrare instant ====================== */
async function loadApptsAndBlocksRange(from, to){
  if (!state.employee) return { appts: [], blocks: [] };
  const [appts, blocksRaw] = await Promise.all([
    getAppointments({ employeeId: state.employee.id, from, to }),
    getMainJobBlocks({ employeeId: state.employee.id, from, to }),
  ]);
  const blocks = blocksRaw.map(b => ({
    id: b.id, employeeId: b.employee_id, start: new Date(b.start_time), end: new Date(b.end_time), label: b.label || 'Celălalt job',
  }));
  return { appts, blocks };
}

function cacheRangeCovers(from, to){
  return !!(cache.rangeFrom && cache.rangeTo && from >= cache.rangeFrom && to <= cache.rangeTo);
}

/** Interogare unică la pornire: programări + blocuri (3 luni), concedii, cliente, servicii. */
async function bulkLoadCache(){
  if (!state.employee) return;
  const today = new Date();
  const from = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  const to = new Date(today.getFullYear(), today.getMonth() + 2, 0, 23, 59, 59, 999);
  const [{ appts, blocks }, vacRes, clients, services] = await Promise.all([
    loadApptsAndBlocksRange(from, to),
    getVacations(state.employee.id),
    getClients(),
    getServices(),
  ]);
  cache.appointments = appts;
  cache.jobBlocks = blocks;
  cache.vacations = vacRes.list;
  state.vacationsMissingTable = vacRes.missingTable;
  cache.rangeFrom = from;
  cache.rangeTo = to;
  state.clients = clients;
  state.services = services;
}

/** Extinde cache-ul dacă intervalul cerut depășește ce avem deja local. */
async function ensureRangeCached(from, to){
  if (!state.employee) return;
  if (cacheRangeCovers(from, to)) return;
  const newFrom = cache.rangeFrom ? new Date(Math.min(from.getTime(), cache.rangeFrom.getTime())) : from;
  const newTo = cache.rangeTo ? new Date(Math.max(to.getTime(), cache.rangeTo.getTime())) : to;
  const { appts, blocks } = await loadApptsAndBlocksRange(newFrom, newTo);
  cache.appointments = appts;
  cache.jobBlocks = blocks;
  cache.rangeFrom = newFrom;
  cache.rangeTo = newTo;
}

/** Re-descarcă de la zero intervalul deja cunoscut — folosit după reconectare, ca să reconciliem programările sincronizate offline. */
async function forceRefreshCache(){
  if (!state.employee || !cache.rangeFrom || !cache.rangeTo) return;
  try {
    const { appts, blocks } = await loadApptsAndBlocksRange(cache.rangeFrom, cache.rangeTo);
    cache.appointments = appts;
    cache.jobBlocks = blocks;
  } catch (e){ /* offline — păstrăm ce avem local */ }
}

/** Adaugă în cache programările salvate offline (din localStorage) care nu s-au sincronizat încă. */
function mergePendingIntoCache(){
  state.pendingAppointments.forEach(item => {
    if (cache.appointments.some(a => a.id === item.id)) return;
    cache.appointments.push(pendingApptToDisplay(item));
  });
}

/** Verifică suprapuneri (blocuri, alte programări, în afara programului zilei) direct din cache — 0ms. */
function findConflictInCache({ employeeId, day, start, end, excludeApptId }){
  const blocks = cache.jobBlocks.filter(b => b.employeeId === employeeId && isSameDay(b.start, day));
  for (const b of blocks){ if (start < b.end && end > b.start) return { start: b.start, end: b.end, type: 'block' }; }
  const appts = cache.appointments.filter(a => a.employeeId === employeeId && a.status !== 'cancelled' && a.id !== excludeApptId && isSameDay(a.startTime, day));
  for (const a of appts){ if (start < a.endTime && end > a.startTime) return { start: a.startTime, end: a.endTime, type: 'appt', clientName: a.clientName }; }
  const { startMin, endMin } = dayHoursFor(day);
  const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate()); dayStart.setMinutes(startMin);
  const dayEnd = new Date(day.getFullYear(), day.getMonth(), day.getDate()); dayEnd.setMinutes(endMin);
  if (start < dayStart || end > dayEnd) return { start: dayStart, end: dayEnd, type: 'hours' };
  return null;
}

/** Calculează sloturile libere dintr-o zi, direct din cache (0ms în cazul
 * normal — ziua e deja în intervalul cache-uit la bootstrap). Orele posibile
 * (Setări → interval pe ziua respectivă) minus blocurile de la celălalt job
 * minus programările deja confirmate. `excludeApptId` scoate din calcul o
 * programare anume — folosit la editare, ca propriul interval să nu se
 * blocheze singur. */
async function getFreeSlots({ employeeId, day, serviceDurationMinutes, slotStepMinutes = 15, excludeApptId = null }){
  const rangeCheckStart = new Date(day.getFullYear(), day.getMonth(), day.getDate());
  const rangeCheckEnd = new Date(rangeCheckStart); rangeCheckEnd.setDate(rangeCheckEnd.getDate() + 1);
  if (!cacheRangeCovers(rangeCheckStart, rangeCheckEnd)){
    try { await ensureRangeCached(rangeCheckStart, rangeCheckEnd); } catch (e){ /* rămânem cu ce avem local */ }
  }

  const { startMin, endMin } = dayHoursFor(day);
  const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate());
  dayStart.setMinutes(startMin);
  const dayEnd = new Date(day.getFullYear(), day.getMonth(), day.getDate());
  dayEnd.setMinutes(endMin);

  const busy = [
    ...cache.jobBlocks.filter(b => b.employeeId === employeeId && isSameDay(b.start, day)).map(b => ({ start: b.start, end: b.end })),
    ...cache.appointments.filter(a => a.employeeId === employeeId && a.status !== 'cancelled' && a.id !== excludeApptId && isSameDay(a.startTime, day)).map(a => ({ start: a.startTime, end: a.endTime })),
  ].sort((a, b) => a.start - b.start);

  const free = [];
  const addSlotsInRange = (rangeStart, rangeEnd) => {
    let slotStart = new Date(rangeStart);
    while (true){
      const slotEnd = new Date(slotStart.getTime() + serviceDurationMinutes * 60000);
      if (slotEnd > rangeEnd) break;
      free.push({ start: new Date(slotStart), end: slotEnd });
      slotStart = new Date(slotStart.getTime() + slotStepMinutes * 60000);
    }
  };

  let cursor = dayStart;
  for (const b of busy){
    if (b.start > cursor) addSlotsInRange(cursor, b.start);
    if (b.end > cursor) cursor = b.end;
  }
  if (dayEnd > cursor) addSlotsInRange(cursor, dayEnd);
  return free;
}

/** Adaugă închiderea automată la click pe backdrop (în afara chenarului)
 * pentru orice <dialog>. Click-ul în interiorul chenarului nu ajunge
 * niciodată la element cu target === dialog (conținutul e în div-uri
 * copil), așa că verificarea de mai jos vizează exclusiv backdrop-ul. */
function wireDialogBackdropClose(dialog){
  if (!dialog || dialog.dataset.backdropWired) return;
  dialog.dataset.backdropWired = '1';
  dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });
}

function refreshHeaderInfo(){

function syncMainViewToDay(day){
  const monthChanged = !state.calendarMonth || day.getFullYear() !== state.calendarMonth.getFullYear() || day.getMonth() !== state.calendarMonth.getMonth();
  state.selectedDay = new Date(day);
  if (monthChanged) state.calendarMonth = new Date(day.getFullYear(), day.getMonth(), 1);

}

function changeMonth(delta){
  const d = new Date(state.calendarMonth);
  d.setMonth(d.getMonth() + delta);
  state.calendarMonth = d;
  loadMonthDots();
}

function setDay(d){
  state.selectedDay = d;
  refreshHeaderInfo();
  renderCalendar();
  loadDay();
}

/* ====================== MINI CALENDAR ====================== */
function renderCalendar(){
  document.getElementById('calMonthLabel').textContent = fmtMonthHeader(state.calendarMonth);
  const grid = document.getElementById('calGrid');
  const y = state.calendarMonth.getFullYear();
  const m = state.calendarMonth.getMonth();
  const firstWeekday = (new Date(y, m, 1).getDay() + 6) % 7;
  const totalDays = new Date(y, m + 1, 0).getDate();
  const today = new Date();

  let html = '';
  for (let i = 0; i < firstWeekday; i++) html += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= totalDays; day++){
    const d = new Date(y, m, day);
    const key = ymd(d);
    const vacColor = state.vacationDaysInMonth.get(key);
    const cls = ['cal-cell', isSameDay(d, state.selectedDay) ? 'selected' : '', isSameDay(d, today) ? 'today' : '', vacColor ? 'vacation' : ''].join(' ').trim();
    const colors = state.monthDayColors.get(key) || [];
    const lines = colors.slice(0, 6).map(c => `<span class="cal-line" style="background:${c}"></span>`).join('');
    const tintStyle = vacColor ? ` style="--vac-tint:${hexToRgba(vacColor, 0.22)}"` : '';
    html += `<button type="button" class="${cls}" data-date="${key}"${tintStyle}>
      <span class="cal-daynum">${day}</span>
      ${lines ? `<span class="cal-lines">${lines}</span>` : ''}
    </button>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-cell[data-date]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [yy, mm, dd] = btn.dataset.date.split('-').map(Number);
      setDay(new Date(yy, mm - 1, dd));
    });
  });
}

/** Recalculează culorile/bulinele lunii curente direct din cache — 0ms. */
function computeMonthDayColorsFromCache(){
  const map = new Map();
  const vacDays = new Map();
  const push = (key, color) => { const l = map.get(key) || []; l.push(color); map.set(key, l); };
  if (state.employee){
    const y = state.calendarMonth.getFullYear();
    const m = state.calendarMonth.getMonth();
    cache.appointments
      .filter(a => a.employeeId === state.employee.id && a.status !== 'cancelled' && a.startTime.getFullYear() === y && a.startTime.getMonth() === m)
      .forEach(a => push(ymd(a.startTime), a.serviceColor));
    cache.jobBlocks
      .filter(b => b.employeeId === state.employee.id && b.start.getFullYear() === y && b.start.getMonth() === m)
      .forEach(b => push(ymd(b.start), 'var(--job-block)'));
    const monthStart = new Date(y, m, 1);
    const monthEnd = new Date(y, m + 1, 0);
    cache.vacations.filter(v => v.employeeId === state.employee.id).forEach(v => {
      const cur = new Date(Math.max(v.start.getTime(), monthStart.getTime()));
      const end = new Date(Math.min(v.end.getTime(), monthEnd.getTime()));
      while (cur <= end){
        const key = ymd(cur);
        vacDays.set(key, v.color || '#B3A29B');
        push(key, v.color || '#B3A29B');
        cur.setDate(cur.getDate() + 1);
      }
    });
  }
  state.monthDayColors = map;
  state.vacationDaysInMonth = vacDays;
}

/** Se asigură că luna cerută e cache-uită, apoi randează instant. Face o
 * cerere de rețea DOAR dacă luna e în afara intervalului deja descărcat. */
async function loadMonthDots(){
  if (state.employee){
    const y = state.calendarMonth.getFullYear();
    const m = state.calendarMonth.getMonth();
    const from = new Date(y, m, 1);
    const to = new Date(y, m + 1, 0, 23, 59, 59, 999);
    if (!cacheRangeCovers(from, to)){
      try { await ensureRangeCached(from, to); } catch (e){ /* offline — folosim ce avem local */ }
    }
  }
  computeMonthDayColorsFromCache();
  renderCalendar();
}

/* ====================== RENDER: DAY AGENDA ====================== */
/** Filtrează ziua selectată direct din cache și randează instant, fără spinner
 * și fără nicio cerere de rețea — cu excepția rarului caz în care ziua cade
 * în afara ferestrei de 3 luni deja cache-uite. */
async function loadDay(){
  const content = document.getElementById('dayContent');
  if (!state.employee){
    content.innerHTML = `<div class="day-state">Nu există nicio angajată configurată în Supabase.</div>`;
    return;
  }
  const dayStart = new Date(state.selectedDay.getFullYear(), state.selectedDay.getMonth(), state.selectedDay.getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  if (!cacheRangeCovers(dayStart, dayEnd)){
    content.innerHTML = `<div class="spinner"></div>`;
    try { await ensureRangeCached(dayStart, dayEnd); }
    catch (e){
      if (!isNetworkError(e)) { content.innerHTML = `<div class="day-state">Eroare la încărcare: ${escapeHtml(e.message || String(e))}</div>`; return; }
      showToast('Fără conexiune — se afișează doar datele salvate local.', 'warning', { autoHide: 3200 });
    }
  }
  renderDayFromCache();
}

/** Randare sincronă (0ms) a agendei zilei selectate, din cache. */
function renderDayFromCache(){
  if (!state.employee) return;
  const vac = findVacationForDay(state.selectedDay);
  const appts = cache.appointments.filter(a => a.employeeId === state.employee.id && isSameDay(a.startTime, state.selectedDay));
  const blocks = cache.jobBlocks.filter(b => b.employeeId === state.employee.id && isSameDay(b.start, state.selectedDay));
  state.appointments = appts;
  state.dayJobBlocks = blocks;
  renderAppointmentList(vac);
}

function renderAppointmentList(vac){
  const content = document.getElementById('dayContent');
  const items = [
    ...state.appointments.map(a => ({ type: 'appt', start: a.startTime, data: a })),
    ...state.dayJobBlocks.map(b => ({ type: 'block', start: b.start, data: b })),
  ].sort((a, b) => a.start - b.start);

  const vacationCardHtml = vac ? `
    <div class="vacation-card">
      <div class="vacation-card-icon">🏖️</div>
      <div>
        <div class="vacation-card-title">CONCEDIU</div>
        <div class="vacation-card-desc">${escapeHtml(vac.description || 'Zi liberă')}</div>
      </div>
    </div>
  ` : '';

  if (items.length === 0){
    content.innerHTML = vacationCardHtml + `<div class="day-state">${vac ? 'Nicio programare — zi de concediu.' : 'Nicio programare în această zi.<br/>Apasă „Programare nouă” ca să adaugi una.'}</div>`;
    return;
  }

  content.innerHTML = vacationCardHtml + items.map((item, idx) => {
    if (item.type === 'block'){
      const b = item.data;
      return `
        <div class="block-card">
          <div class="block-time">${fmtTime(b.start)}<small>${fmtTime(b.end)}</small></div>
          <div class="block-body">
            <div class="block-label">${escapeHtml(b.label)}</div>
            <div class="block-sub">Ocupată — administrează din Setări → Programul de la celălalt job</div>
          </div>
        </div>
      `;
    }
    const a = item.data;
    const cancelled = a.status === 'cancelled';
    const completed = a.status === 'completed';
    const unconfirmed = a.status === 'unconfirmed';
    const color = cancelled ? 'var(--muted)' : a.serviceColor;
    return `
      <div class="appt-card ${cancelled ? 'cancelled' : ''}" style="border-left-color:${color}" data-appt-idx="${idx}" data-pending="${a.pendingOffline ? '1' : '0'}">
        <div class="appt-time">${fmtTime(a.startTime)}<small>${fmtTime(a.endTime)}</small></div>
        <div class="appt-body">
          <div class="appt-client">${escapeHtml(a.clientName || 'Client')}</div>
          <div class="appt-service"><span class="swatch" style="background:${color}"></span>${escapeHtml(a.serviceName || '')}</div>
          ${cancelled ? `<span class="appt-tag">Anulată</span>` : ''}
          ${completed ? `<span class="appt-tag" style="background:var(--success)">Finalizată</span>` : ''}
          ${unconfirmed ? `<span class="appt-tag" style="background:var(--warn)">Neconfirmată</span>` : ''}
          ${a.pendingOffline ? `<span class="appt-tag pending-tag">Offline — în așteptare</span>` : ''}
        </div>
        ${(!cancelled && !a.pendingOffline) ? reminderActionsHtml(a) : ''}
        ${(!cancelled && !a.pendingOffline) ? `
          <button class="appt-cancel" data-id="${a.id}" title="Anulează programarea">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>` : ''}
      </div>
    `;
  }).join('');

  // click pe card -> editare (exceptând blocurile și programările încă nesincronizate)
  content.querySelectorAll('.appt-card').forEach(card => {
    card.addEventListener('click', (ev) => {
      if (ev.target.closest('.appt-cancel')) return;
      if (ev.target.closest('.reminder-actions')) return;
      if (card.dataset.pending === '1') { showToast('Se poate edita după ce se sincronizează.', 'info', { autoHide: 2000 }); return; }
      const idx = Number(card.dataset.apptIdx);
      const apptItems = [
        ...state.appointments.map(a => ({ type: 'appt', start: a.startTime, data: a })),
        ...state.dayJobBlocks.map(b => ({ type: 'block', start: b.start, data: b })),
      ].sort((a, b) => a.start - b.start);
      const target = apptItems[idx];
      if (target && target.type === 'appt') openEditModal(target.data);
    });
  });

  content.querySelectorAll('.appt-cancel').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      cancelAppointmentOptimistic(btn.dataset.id);
    });
  });

  wireReminderCopyButtons(content);

  // Blocurile de la celălalt job se șterg doar din Setări (nu din agendă).
}

/** Anulare optimistă: actualizează cache-ul + UI-ul instant (0ms), apoi
 * trimite cererea către Supabase în fundal. La eroare, revine la starea
 * anterioară și anunță utilizatorul. */
async function cancelAppointmentOptimistic(id){
  if (!confirm('Sigur anulezi această programare?')) return;
  const idx = cache.appointments.findIndex(a => a.id === id);
  const previous = idx >= 0 ? { ...cache.appointments[idx] } : null;
  if (idx >= 0) cache.appointments[idx] = { ...cache.appointments[idx], status: 'cancelled' };
  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();

  const toastId = showToast('Se anulează…', 'saving', { persist: true });
  try {
    await cancelAppointment(id);
    updateToast(toastId, 'Programare anulată.', 'success', 1800);
    refreshUnconfirmedBadge();
  } catch (e){
    if (idx >= 0 && previous) cache.appointments[idx] = previous;
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
    updateToast(toastId, 'Eroare la anulare — s-a revenit la starea anterioară: ' + (e.message || e), 'error', 3600);
  }
}

/* ====================== CLIENT PICKER (reutilizat în Add & Edit) ====================== */
const pickerHandlers = {};

function clientPickerHtml(prefix){

function renderClientList(prefix, query, onSelect, opts){
  opts = opts || {};
  const listEl = document.getElementById(`${prefix}ClientList`);
  if (!listEl) return;
  const q = (query || '').trim().toLowerCase();
  const filtered = !q ? state.clients : state.clients.filter(c => c.name.toLowerCase().includes(q) || (c.phone || '').includes(q));
  if (filtered.length === 0){
    listEl.innerHTML = `<div class="client-empty">Nicio clientă găsită.</div>`;
    return;
  }
  listEl.innerHTML = filtered.slice(0, 30).map(c => `
    <div class="client-row" data-id="${c.id}" tabindex="0" role="button">
      <span class="client-avatar">${escapeHtml(initials(c.name))}</span>
      <span class="client-row-info">
        <span class="client-row-name">${escapeHtml(c.name)}${c.pendingOffline ? '<em>offline</em>' : ''}</span>
        ${c.phone ? `<span class="client-row-phone">${escapeHtml(c.phone)}</span>` : ''}
      </span>
      ${opts.showActions ? `
        <span class="client-row-actions">
          <button type="button" class="icon-btn-sm client-row-edit" data-id="${c.id}" title="Editează clienta">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button type="button" class="icon-btn-sm client-row-delete" data-id="${c.id}" title="Șterge clienta">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </span>
      ` : ''}
    </div>
  `).join('');
  listEl.querySelectorAll('.client-row').forEach(row => {
    row.addEventListener('click', (ev) => {
      if (ev.target.closest('.client-row-actions')) return;
      const client = state.clients.find(c => c.id === row.dataset.id);
      onSelect(client);
    });
  });
  if (opts.showActions){
    listEl.querySelectorAll('.client-row-edit').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const client = state.clients.find(c => c.id === btn.dataset.id);
        if (client) openEditClientModal(client);
      });
    });
    listEl.querySelectorAll('.client-row-delete').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        deleteClientWithConfirm(btn.dataset.id);
      });
    });
  }
}

function showSelectedClient(prefix, client, onChangeClick){
  const selEl = document.getElementById(`${prefix}ClientSelected`);
  const searchWrap = document.getElementById(`${prefix}ClientSearchWrap`);
  if (!selEl || !searchWrap) return;
  if (!client){
    selEl.classList.add('hidden');
    searchWrap.classList.remove('hidden');

  }
  selEl.classList.remove('hidden');
  searchWrap.classList.add('hidden');
  selEl.innerHTML = `
    <span class="client-avatar">${escapeHtml(initials(client.name))}</span>
    <span class="client-row-info">
      <span class="client-row-name">${escapeHtml(client.name)}${client.pendingOffline ? '<em>offline</em>' : ''}</span>
      ${client.phone ? `<span class="client-row-phone">${escapeHtml(client.phone)}</span>` : ''}
    </span>
    <button type="button" class="btn-outline client-change-btn">Schimbă</button>
  `;
  selEl.querySelector('.client-change-btn').addEventListener('click', onChangeClick);
}

/** opts: { get: ()=>client|null, set: (client)=>void, onChange: ()=>void } */
function wireClientPicker(prefix, opts){
  const searchInput = document.getElementById(`${prefix}ClientSearch`);
  function selectHandler(client){
    opts.set(client);
    showSelectedClient(prefix, client, () => {
      opts.set(null);
      showSelectedClient(prefix, null);
      searchInput.value = '';
      renderClientList(prefix, '', selectHandler);
      searchInput.focus();
    });
    opts.onChange();
  }
  pickerHandlers[prefix] = selectHandler;
  searchInput.addEventListener('input', () => renderClientList(prefix, searchInput.value, selectHandler));
  renderClientList(prefix, '', selectHandler);

  const current = opts.get();
  if (current) showSelectedClient(prefix, current, () => {
    opts.set(null); showSelectedClient(prefix, null); searchInput.value = ''; renderClientList(prefix, '', selectHandler);
  });
  else showSelectedClient(prefix, null);
}

function resetClientPickerUI(prefix){
  const search = document.getElementById(`${prefix}ClientSearch`);
  if (search) search.value = '';
  showSelectedClient(prefix, null);
  if (pickerHandlers[prefix]) renderClientList(prefix, '', pickerHandlers[prefix]);
}

/** opts: { onCreated: (client)=>void } */
function wireNewClientBox(prefix, opts){
  document.getElementById(`${prefix}ToggleNewClient`).addEventListener('click', () => {
    document.getElementById(`${prefix}NewClientBox`).classList.toggle('hidden');
  });
  document.getElementById(`${prefix}SaveNewClient`).addEventListener('click', async () => {
    const name = document.getElementById(`${prefix}NewClientName`).value.trim();
    const phone = document.getElementById(`${prefix}NewClientPhone`).value.trim();
    if (!name) return;
    const btn = document.getElementById(`${prefix}SaveNewClient`);
    btn.disabled = true; btn.textContent = 'Se adaugă…';
    const toastId = showToast('Se salvează clienta…', 'saving', { persist: true });
    try {
      const result = await createClientSmart(name, phone);
      updateToast(toastId, result.offline ? 'Fără conexiune — clienta a fost salvată local.' : 'Clientă adăugată.', result.offline ? 'warning' : 'success', 2400);
      document.getElementById(`${prefix}NewClientBox`).classList.add('hidden');
      document.getElementById(`${prefix}NewClientName`).value = '';
      document.getElementById(`${prefix}NewClientPhone`).value = '';
      if (pickerHandlers[prefix]) pickerHandlers[prefix](result.client);
      opts.onCreated(result.client);
    } catch (e){
      updateToast(toastId, 'Eroare: ' + (e.message || e), 'error', 3000);
    } finally {
      btn.disabled = false; btn.textContent = 'Adaugă clienta';
    }

  catch (e){ list.innerHTML = `<p class="error-text">Eroare la încărcarea concediilor: ${escapeHtml(e.message || e)}</p>`; return; }
  state.vacationsMissingTable = res.missingTable;
  note.innerHTML = res.missingTable ? `
    <div class="setup-note">
      Tabelul pentru concedii nu există încă în Supabase. Rulează o singură dată acest SQL în
      <strong>Supabase → SQL Editor</strong>, apoi revino aici.

}

function renderVacationsList(){
  const list = document.getElementById('vacationsList');
  if (!list) return;
  if (cache.vacations.length === 0){ list.innerHTML = `<p class="settings-hint" style="margin:0;">Niciun concediu adăugat încă.</p>`; return; }
  const sorted = [...cache.vacations].sort((a, b) => b.start - a.start);
  list.innerHTML = sorted.map(v => `
    <div class="history-row">
      <span class="history-date">${fmtDateShort(v.start)} – ${fmtDateShort(v.end)}</span>
      <span class="history-mid"><span style="width:9px;height:9px;border-radius:50%;display:inline-block;background:${v.color};flex:none;"></span>${escapeHtml(v.description || 'Zi liberă')}</span>
      <button type="button" class="appt-cancel" data-id="${v.id}" title="Șterge concediul" style="width:28px;height:28px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  `).join('');
  list.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Ștergi acest concediu?')) return;
      const id = btn.dataset.id;
      const prevList = [...cache.vacations];
      cache.vacations = cache.vacations.filter(v => v.id !== id);
      renderVacationsList();
      computeMonthDayColorsFromCache(); renderCalendar();
      try {
        await deleteVacation(id);
        showToast('Concediu șters.', 'success', { autoHide: 1800 });
      } catch (e){
        cache.vacations = prevList;
        renderVacationsList();
        computeMonthDayColorsFromCache(); renderCalendar();
        showToast('Eroare la ștergere: ' + (e.message || e), 'error', { autoHide: 3000 });
      }
    });
  });
}

async function saveNewVacation(){
  const btn = document.getElementById('saveVacBtn');
  const errEl = document.getElementById('vacError');
  const okEl = document.getElementById('vacSuccess');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const startVal = document.getElementById('vacStart').value;
  const endVal = document.getElementById('vacEnd').value;
  const desc = document.getElementById('vacDesc').value.trim();
  const color = document.getElementById('vacColor').value || '#B3A29B';
  if (!startVal || !endVal){ errEl.textContent = 'Alege data de început și sfârșit.'; errEl.classList.remove('hidden'); return; }
  if (endVal < startVal){ errEl.textContent = 'Data de sfârșit trebuie să fie după data de început.'; errEl.classList.remove('hidden'); return; }

  btn.disabled = true; btn.textContent = 'Se adaugă…';
  const toastId = showToast('Se salvează concediul…', 'saving', { persist: true });
  try {
    const row = await addVacation({ employeeId: state.employee.id, startDate: startVal, endDate: endVal, description: desc, color });
    cache.vacations.push({
      id: row.id, employeeId: row.employee_id,
      start: new Date(row.start_date + 'T00:00:00'), end: new Date(row.end_date + 'T00:00:00'),
      description: row.description || '', color: row.color || color,
    });
    document.getElementById('vacStart').value = '';
    document.getElementById('vacEnd').value = '';
    document.getElementById('vacDesc').value = '';
    document.querySelectorAll('#vacPresetSwatches .preset-swatch').forEach(s => s.classList.remove('active'));
    renderVacationsList();
    computeMonthDayColorsFromCache(); renderCalendar();
    okEl.textContent = 'Concediu adăugat.'; okEl.classList.remove('hidden');
    updateToast(toastId, 'Concediu adăugat.', 'success', 1800);
  } catch (e){
    errEl.textContent = 'Eroare la adăugare: ' + (e.message || e); errEl.classList.remove('hidden');
    updateToast(toastId, 'Eroare la adăugare.', 'error', 2600);
  } finally {
    btn.disabled = false; btn.textContent = 'Adaugă concediul';
  }
}

async function getClientHistory(clientId){
  const { data, error } = await sb.from('appointments')
    .select('start_time, end_time, status, services(name, price)')
    .eq('client_id', clientId)
    .order('start_time', { ascending: false });
  if (error) throw error;
  return data.map(r => ({
    startTime: new Date(r.start_time),
    endTime: new Date(r.end_time),
    status: r.status,
    serviceName: r.services ? r.services.name : '—',
    price: r.services ? Number(r.services.price) || 0 : 0,
  }));
}

/** Actualizează instant numele/telefonul clientei peste tot în UI: lista
 * generală, picker-ul din modalele de programare, cardul de clientă
 * selectată și programările deja afișate în agendă. */
function applyClientUpdateEverywhere(updated){
  const idx = state.clients.findIndex(c => c.id === updated.id);
  if (idx >= 0) state.clients[idx] = { ...state.clients[idx], ...updated };
  state.clients.sort((a, b) => a.name.localeCompare(b.name));
  cache.appointments.forEach(a => { if (a.clientId === updated.id) a.clientName = updated.name; });
  if (state.appointments) state.appointments.forEach(a => { if (a.clientId === updated.id) a.clientName = updated.name; });
  renderDayFromCache();
}

async function saveEditClient(){
  const id = editClientState.id;
  if (!id) return;
  const btn = document.getElementById('saveEditClientBtn');
  const errEl = document.getElementById('editClientError');
  errEl.classList.add('hidden');
  const name = document.getElementById('editClientName').value.trim();
  const phone = document.getElementById('editClientPhone').value.trim();
  const notes = document.getElementById('editClientNotes').value.trim();
  if (!name){ errEl.textContent = 'Numele clientei este obligatoriu.'; errEl.classList.remove('hidden'); return; }

  btn.disabled = true; btn.textContent = 'Se salvează…';
  const toastId = showToast('Se salvează clienta…', 'saving', { persist: true });
  try {
    let updated;
    if (String(id).startsWith('offline-client')){
      updated = { id, name, phone, notes, pendingOffline: true };
      const pendingItem = state.pendingClients.find(p => p.id === id);
      if (pendingItem){ pendingItem.payload = { name, phone, notes }; savePendingClients(); }
    } else {
      updated = await updateClientRow(id, { name, phone, notes });
    }
    applyClientUpdateEverywhere(updated);
    document.getElementById('editClientModal').close();
    // Reîmprospătează orice listă de cliente vizibilă (pagina Cliente sau picker-ele din modale).
    if (document.getElementById('browseClientList')) renderClientList('browse', document.getElementById('browseClientSearch')?.value || '', openClientDetail, { showActions: true });
    Object.keys(pickerHandlers).forEach(prefix => {
      const search = document.getElementById(`${prefix}ClientSearch`);
      if (search) renderClientList(prefix, search.value, pickerHandlers[prefix]);
    });
    if (document.getElementById('clientDetailModal') && document.getElementById('clientDetailModal').open){
      document.getElementById('clientDetailName').textContent = updated.name;
      document.getElementById('clientDetailPhone').textContent = updated.phone ? `Telefon: ${updated.phone}` : 'Fără telefon salvat';
    }
    updateToast(toastId, 'Clientă actualizată.', 'success', 1800);
  } catch (e){
    errEl.textContent = 'Eroare la salvare: ' + (e.message || e);
    errEl.classList.remove('hidden');
    updateToast(toastId, 'Eroare la salvare.', 'error', 2600);
  } finally {
    btn.disabled = false; btn.textContent = 'Salvează modificările';

}

/** Șterge clienta din Supabase + din memorie, apoi actualizează instant
 * lista de cliente vizibilă. onDone (opțional) rulează după ștergerea reușită. */
async function deleteClientWithConfirm(id, onDone){
  const client = state.clients.find(c => c.id === id);
  if (!client) return;
  if (!confirm(`Ștergi definitiv clienta „${client.name}”? Această acțiune nu poate fi anulată.`)) return;
  const toastId = showToast('Se șterge…', 'saving', { persist: true });
  try {
    if (!String(id).startsWith('offline-client')){
      await deleteClientRow(id);
    } else {
      state.pendingClients = state.pendingClients.filter(p => p.id !== id);
      savePendingClients();
    }
    state.clients = state.clients.filter(c => c.id !== id);
    if (document.getElementById('browseClientList')) renderClientList('browse', document.getElementById('browseClientSearch')?.value || '', openClientDetail, { showActions: true });
    Object.keys(pickerHandlers).forEach(prefix => {
      const search = document.getElementById(`${prefix}ClientSearch`);
      if (search) renderClientList(prefix, search.value, pickerHandlers[prefix]);
    });
    updateToast(toastId, 'Clientă ștearsă.', 'success', 1800);
    if (onDone) onDone();
  } catch (e){
    updateToast(toastId, 'Eroare la ștergere: ' + (e.message || e), 'error', 3000);
  }
}

async function loadWeekRows(){
  const weekStart = settingsState.weekStart;
  const weekEndLabel = new Date(weekStart); weekEndLabel.setDate(weekEndLabel.getDate() + 6);
  document.getElementById('weekRangeLabel').textContent = `${fmtDateShort(weekStart)} – ${fmtDateShort(weekEndLabel)}`;
  const wrap = document.getElementById('weekRows');
  wrap.innerHTML = `<div class="spinner"></div>`;

  let blocksByDate = {};
  if (state.employee){
    try {
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 7);
      const blocks = await getMainJobBlocks({ employeeId: state.employee.id, from: weekStart, to: weekEnd });
      blocks.forEach(b => {
        const s = new Date(b.start_time);
        const key = ymd(s);
        if (!blocksByDate[key]) blocksByDate[key] = { start: s, end: new Date(b.end_time) };
      });
    } catch (e){ /* continuăm cu zile libere dacă nu găsim nimic */ }
  }

  wrap.innerHTML = DAYS_MON_FIRST.map(({ jsDay, label }, i) => {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    const key = ymd(d);
    const existing = blocksByDate[key];
    const off = !existing;
    return `
      <div class="wd-row" data-date="${key}">
        <div class="wd-label">${label}<span class="wd-date">${fmtDateShort(d)}</span></div>
        <div class="wd-times">
          <input type="time" class="time-input wk-start" value="${existing ? minutesToHHMM(existing.start.getHours()*60+existing.start.getMinutes()) : ''}" ${off ? 'disabled' : ''} />
          <span class="wd-sep">–</span>
          <input type="time" class="time-input wk-end" value="${existing ? minutesToHHMM(existing.end.getHours()*60+existing.end.getMinutes()) : ''}" ${off ? 'disabled' : ''} />
        </div>
        <label class="wd-off"><input type="checkbox" class="wk-off" ${off ? 'checked' : ''} /> Liber</label>
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.wd-row').forEach(row => {
    const offCb = row.querySelector('.wk-off');
    const startInp = row.querySelector('.wk-start');
    const endInp = row.querySelector('.wk-end');
    offCb.addEventListener('change', () => {
      startInp.disabled = offCb.checked; endInp.disabled = offCb.checked;
      if (offCb.checked){ startInp.value = ''; endInp.value = ''; }
    });
  });
}

async function saveWeek(){
  if (!state.employee) return;
  const btn = document.getElementById('saveWeekBtn');
  const errEl = document.getElementById('weekError');
  const okEl = document.getElementById('weekSuccess');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const toastId = showToast('Se salvează…', 'saving', { persist: true });
  btn.disabled = true; btn.textContent = 'Se salvează…';
  const problems = [];
  const rows = Array.from(document.querySelectorAll('#weekRows .wd-row'));

  for (const row of rows){
    const dateKey = row.dataset.date;
    const [yy, mm, dd] = dateKey.split('-').map(Number);
    const day = new Date(yy, mm - 1, dd);
    const off = row.querySelector('.wk-off').checked;
    const startVal = row.querySelector('.wk-start').value;
    const endVal = row.querySelector('.wk-end').value;
    try {
      if (off || !startVal || !endVal){ await clearDayJobBlock(state.employee.id, day); continue; }
      if (hhmmToMinutes(endVal) <= hhmmToMinutes(startVal)){ problems.push(`${fmtDateShort(day)}: ora de sfârșit trebuie să fie după cea de început.`); continue; }
      const dayStart = new Date(yy, mm - 1, dd, 0, 0);
      const dayEnd = new Date(yy, mm - 1, dd, 23, 59);
      const appts = await getAppointments({ employeeId: state.employee.id, from: dayStart, to: dayEnd });
      const [sh, sm] = startVal.split(':').map(Number);
      const [eh, em] = endVal.split(':').map(Number);
      const blockStart = new Date(yy, mm - 1, dd, sh, sm);
      const blockEnd = new Date(yy, mm - 1, dd, eh, em);
      const conflict = appts.find(a => a.status !== 'cancelled' && a.startTime < blockEnd && a.endTime > blockStart);
      if (conflict){ problems.push(`${fmtDateShort(day)}: ai deja o programare (${fmtTime(conflict.startTime)}) în acel interval — anuleaz-o sau alege alt interval.`); continue; }
      await setDayJobBlock(state.employee.id, day, startVal, endVal);
    } catch (e){ problems.push(`${fmtDateShort(day)}: ${e.message || e}`); }
  }

  btn.disabled = false; btn.textContent = 'Salvează programul săptămânii';
  if (problems.length){
    errEl.innerHTML = problems.map(p => escapeHtml(p)).join('<br/>'); errEl.classList.remove('hidden');
    updateToast(toastId, 'Salvat parțial — vezi detaliile.', 'warning', 3000);
  } else {
    okEl.textContent = 'Salvat.'; okEl.classList.remove('hidden');
    updateToast(toastId, 'Programul săptămânii a fost salvat.', 'success', 1800);
  }
  loadMonthDots();
}

function ensureLightboxModal(){
  if (document.getElementById('lightboxModal')) return;

  wrap.innerHTML = `
    <dialog id="lightboxModal" class="lightbox-dialog">
      <button type="button" class="icon-btn lightbox-close" id="lightboxClose">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
      <img id="lightboxImg" class="lightbox-img" alt="" />
      <button type="button" class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
      <div class="lightbox-counter" id="lightboxCounter"></div>
    </dialog>
  `;
  document.body.appendChild(wrap.firstElementChild);
  const dlg = document.getElementById('lightboxModal');
  document.getElementById('lightboxClose').addEventListener('click', () => dlg.close());
  document.getElementById('lightboxPrev').addEventListener('click', () => shiftLightbox(-1));
  document.getElementById('lightboxNext').addEventListener('click', () => shiftLightbox(1));
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
}

function shiftLightbox(delta){
  const n = lightboxState.images.length;
  lightboxState.index = ((lightboxState.index + delta) % n + n) % n;
  renderLightbox();
}

function renderLightbox(){
  document.getElementById('lightboxImg').src = lightboxState.images[lightboxState.index];
  document.getElementById('lightboxCounter').textContent = `${lightboxState.index + 1} / ${lightboxState.images.length}`;
  const multi = lightboxState.images.length > 1;
  document.getElementById('lightboxPrev').classList.toggle('hidden', !multi);
  document.getElementById('lightboxNext').classList.toggle('hidden', !multi);
}

function openLightbox(images, index){
  ensureLightboxModal();
  lightboxState.images = images;
  lightboxState.index = Math.min(Math.max(index, 0), images.length - 1);
  renderLightbox();
  document.getElementById('lightboxModal').showModal();
}

async function saveNewService(){
  const btn = document.getElementById('saveSvcBtn');
  const errEl = document.getElementById('svcError');
  const okEl = document.getElementById('svcSuccess');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const name = document.getElementById('svcName').value.trim();
  const durationMinutes = parseInt(document.getElementById('svcDuration').value, 10);
  const price = parseFloat(document.getElementById('svcPrice').value);
  const color = document.getElementById('svcColor').value || DEFAULT_SERVICE_COLOR;
  const imagesRaw = document.getElementById('svcImages').value.trim();
  const tagsRaw = document.getElementById('svcTags').value.trim();
  const description = document.getElementById('svcDescription').value.trim();
  const images = parseImagesField(imagesRaw, null);
  const tags = parseTagsField(tagsRaw);

  if (!name){ errEl.textContent = 'Numele serviciului este obligatoriu.'; errEl.classList.remove('hidden'); return; }
  if (!durationMinutes || durationMinutes <= 0){ errEl.textContent = 'Durata trebuie să fie un număr de minute mai mare ca 0.'; errEl.classList.remove('hidden'); return; }
  if (isNaN(price) || price < 0){ errEl.textContent = 'Prețul trebuie să fie un număr valid.'; errEl.classList.remove('hidden'); return; }

  const toastId = showToast('Se adaugă serviciul…', 'saving', { persist: true });
  btn.disabled = true; btn.textContent = 'Se adaugă…';
  try {
    await addService({
      name, durationMinutes, price, color,
      imageUrl: images[0] || '', description,
      images, tags,
      includeMedia: !!state.serviceMediaColumnsOk,
      includeGallery: !!state.serviceGalleryColumnsOk,
    });
    document.getElementById('svcName').value = '';
    document.getElementById('svcDuration').value = '60';
    document.getElementById('svcPrice').value = '100';
    document.getElementById('svcColor').value = DEFAULT_SERVICE_COLOR;

    document.getElementById('svcTags').value = '';
    document.getElementById('svcDescription').value = '';
    document.querySelectorAll('#presetSwatches .preset-swatch').forEach(s => s.classList.remove('active'));
    state.services = await getServices(); // actualizează global -> instant valabil în orice modal
    renderTagPills();
    renderServicesList();
    okEl.textContent = 'Serviciu adăugat.'; okEl.classList.remove('hidden');
    updateToast(toastId, 'Serviciu adăugat.', 'success', 1800);
  } catch (e){
    if (e.code === '42703'){ errEl.textContent = 'O coloană nouă nu există încă — rulează SQL-ul de mai sus în Supabase, apoi încearcă din nou.'; }
    else { errEl.textContent = 'Eroare la adăugare: ' + (e.message || e); }
    errEl.classList.remove('hidden');
    updateToast(toastId, 'Eroare la adăugare.', 'error', 2600);
  } finally {
    btn.disabled = false; btn.textContent = 'Adaugă serviciul';

/* ---------- Statistici ---------- */
async function changeStatsMonth(delta){
  const d = new Date(statsState.month);
  d.setMonth(d.getMonth() + delta);
  statsState.month = d;
  loadStats(); // instant, din cache
  // Dacă luna aleasă e în afara ferestrei deja cache-uite, o extindem în fundal
  // (fără spinner) și recalculăm — dar loadStats însuși rămâne 100% din cache.
  const from = new Date(d.getFullYear(), d.getMonth(), 1);
  const to = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999);
  if (!cacheRangeCovers(from, to)){
    try { await ensureRangeCached(from, to); loadStats(); } catch (e){ /* offline — rămân datele locale */ }
  }
}

/** Calculează statisticile lunii selectate direct din cache.appointments —
 * 0ms, fără nicio cerere de rețea către Supabase. Prețul fiecărui serviciu
 * este preluat din state.services (deja încărcat în memorie). */
function loadStats(){
  const label = document.getElementById('statsMonthLabel');
  const body = document.getElementById('statsBody');
  if (!label || !body) return;
  label.textContent = fmtMonthHeader(statsState.month);
  if (!state.employee){ body.innerHTML = `<p class="settings-hint" style="margin:0;">Nicio angajată configurată.</p>`; return; }

  const y = statsState.month.getFullYear();
  const m = statsState.month.getMonth();
  const priceById = new Map(state.services.map(s => [s.id, Number(s.price) || 0]));

  const active = cache.appointments.filter(a =>
    a.employeeId === state.employee.id &&
    a.startTime.getFullYear() === y && a.startTime.getMonth() === m &&
    (a.status === 'confirmed' || a.status === 'completed')
  );
  const total = active.reduce((sum, a) => sum + (priceById.get(a.serviceId) || 0), 0);
  const distinctClients = new Set(active.map(a => a.clientId)).size;

  body.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">${total.toLocaleString('ro-RO')} lei</div>
        <div class="stat-label">Venit total</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${distinctClients}</div>
        <div class="stat-label">Cliente servite</div>
      </div>
    </div>
  `;
}

  const banner = document.getElementById('modalVacationWarning');

  if (vac){

    banner.innerHTML = `🏖️ <span><strong>Concediu în această zi</strong> — ${escapeHtml(vac.description || 'zi liberă')}. Nu se pot adăuga programări.</span>`;

async function refreshSlots(){
  const wrap = document.getElementById('slotsWrap');
  const section = document.getElementById('slotsSection');
  const hint = document.getElementById('slotsHint');
  modalState.selectedSlot = null;
  updateSaveEnabled();
  if (findVacationForDay(modalState.day)){
    section.classList.add('hidden'); hint.classList.add('hidden');
    return;
  }
  if (!modalState.selectedService){
    section.classList.add('hidden'); hint.classList.remove('hidden');
    hint.textContent = 'Alege mai întâi un serviciu ca să vezi orele libere.';
    return;
  }
  hint.classList.remove('hidden'); hint.textContent = 'Se calculează orele libere…';
  section.classList.add('hidden');
  try {
    const slots = await getFreeSlots({ employeeId: state.employee.id, day: modalState.day, serviceDurationMinutes: modalState.selectedService.durationMinutes });
    modalState.slots = slots;
    if (slots.length === 0){ hint.textContent = 'Nu există ore libere în această zi pentru durata aleasă.'; section.classList.add('hidden'); return; }
    hint.classList.add('hidden'); section.classList.remove('hidden');
    wrap.innerHTML = slots.map((s, i) => `<button type="button" class="slot-btn" data-i="${i}"><span class="dot"></span>${fmtTime(s.start)}</button>`).join('');
    wrap.querySelectorAll('.slot-btn').forEach(btnEl => {
      btnEl.addEventListener('click', () => {
        wrap.querySelectorAll('.slot-btn').forEach(c => c.classList.remove('selected'));
        btnEl.classList.add('selected');
        modalState.selectedSlot = modalState.slots[Number(btnEl.dataset.i)];
        updateSaveEnabled();
      });
    });
  } catch (e){
    hint.textContent = isNetworkError(e) ? 'Fără conexiune — nu se pot calcula orele libere acum.' : 'Eroare la calculul orelor libere: ' + (e.message || e);
  }
}

function updateSaveEnabled(){
  const blocked = !!findVacationForDay(modalState.day);
  const ok = modalState.selectedClient && modalState.selectedService && modalState.selectedSlot && !blocked;
  document.getElementById('saveAppt').disabled = !ok;
}

function showModalError(msg){
  const p = document.getElementById('modalError');
  p.textContent = msg; p.classList.remove('hidden');
}

/** Salvare optimistă: intră instant în cache + UI (0ms), apoi confirmă
 * în fundal către Supabase. Fără conexiune -> coadă offline. La orice altă
 * eroare -> rollback + notificare. */
async function saveAppointment(){
  if (!modalState.selectedClient || !modalState.selectedService || !modalState.selectedSlot) return;
  if (findVacationForDay(modalState.day)) return;
  document.getElementById('modalError').classList.add('hidden');

  const employeeId = state.employee.id;
  const clientId = modalState.selectedClient.id;
  const serviceId = modalState.selectedService.id;
  const start = modalState.selectedSlot.start;
  const end = modalState.selectedSlot.end;

  const optimisticId = uid('optimistic-appt');
  const optimistic = {
    id: optimisticId, employeeId, clientId, serviceId,
    startTime: start, endTime: end, status: 'unconfirmed', notes: null,
    clientName: modalState.selectedClient.name,
    serviceName: modalState.selectedService.name,
    serviceColor: modalState.selectedService.color,
    optimisticPending: true,
  };

  cache.appointments.push(optimistic);
  document.getElementById('addModal').close();
  syncMainViewToDay(modalState.day);
  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();

  const toastId = showToast('Se salvează programarea…', 'saving', { persist: true });

  const goOffline = () => {
    const item = queueOfflineAppointment({ employeeId, clientId, serviceId, start: start.toISOString(), end: end.toISOString(), notes: null, status: 'unconfirmed' });
    const idx = cache.appointments.findIndex(a => a.id === optimisticId);
    if (idx >= 0) cache.appointments[idx] = { ...optimistic, id: item.id, pendingOffline: true, optimisticPending: false };
    renderDayFromCache();
    updateToast(toastId, 'Fără conexiune — programarea a fost salvată local și se sincronizează automat.', 'warning', 3600);
  };

  if (!navigator.onLine){ goOffline(); return; }

  try {
    const row = await addAppointment({ employeeId, clientId, serviceId, start, end, notes: null, status: 'unconfirmed' });
    const idx = cache.appointments.findIndex(a => a.id === optimisticId);
    if (idx >= 0) cache.appointments[idx] = mapApptRow(row);
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
    refreshUnconfirmedBadge();
    updateToast(toastId, 'Programare salvată.', 'success', 1800);
  } catch (e){
    if (isNetworkError(e)){
      goOffline();
    } else {
      cache.appointments = cache.appointments.filter(a => a.id !== optimisticId);
      renderDayFromCache();
      computeMonthDayColorsFromCache();
      renderCalendar();
      updateToast(toastId, 'Eroare la salvare — programarea a fost anulată: ' + (e.message || e), 'error', 4200);
    }
  }
}
