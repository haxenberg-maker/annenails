const editState = { apptId: null, day: new Date(), selectedService: null, selectedClient: null, selectedSlot: null, slots: [], status: 'confirmed' };

function wireEditModal(){
  const dlg = document.getElementById('editModal');
  document.getElementById('closeEditModal').addEventListener('click', () => dlg.close());
  document.getElementById('editPrevDay').addEventListener('click', () => shiftEditDay(-1));
  document.getElementById('editNextDay').addEventListener('click', () => shiftEditDay(1));
  document.getElementById('editDate').addEventListener('change', e => {
    if (!e.target.value) return;
    const [y, m, d] = e.target.value.split('-').map(Number);
    editState.day = new Date(y, m - 1, d);
    document.getElementById('editDateLabelText').textContent = fmtDateHeader(editState.day);
    checkEditVacation();
    enterChangeTimeMode();
    refreshEditSlots();
  });
  document.getElementById('editServiceSelect').addEventListener('change', e => {
    editState.selectedService = state.services.find(s => s.id === e.target.value) || null;
    handleServiceChangeSmart();
  });
  document.getElementById('editChangeTimeBtn').addEventListener('click', () => {
    enterChangeTimeMode();
    refreshEditSlots();
  });
  wireClientPicker('edit', {
    get: () => editState.selectedClient,
    set: c => { editState.selectedClient = c; },
    onChange: () => {},
  });
  wireNewClientBox('edit', { onCreated: () => {} });
  document.getElementById('saveEditAppt').addEventListener('click', saveEditAppointment);
}

/** Afișează avertismentul de concediu în modalul de editare, pentru ziua
 * curent selectată acolo. */
function checkEditVacation(){
  const banner = document.getElementById('editVacationWarning');
  if (!banner) return false;
  const vac = findVacationForDay(editState.day);
  if (vac){
    banner.classList.remove('hidden');
    banner.innerHTML = `🏖️ <span><strong>Concediu în această zi</strong> — ${escapeHtml(vac.description || 'zi liberă')}.</span>`;
  } else {
    banner.classList.add('hidden');
    banner.innerHTML = '';
  }
  return !!vac;
}

/** FEATURE 2: la schimbarea serviciului, păstrează ora de început curentă
 * și recalculează automat ora de sfârșit (start + noua durată). Dacă noul
 * interval nu se suprapune cu nimic, arată un mesaj verde și NU deschide
 * lista de sloturi. Dacă se suprapune, arată un avertisment roșu și
 * deschide automat selectorul de oră nouă. */
function handleServiceChangeSmart(){
  const msgEl = document.getElementById('editSmartMsg');
  if (!editState.selectedService || !editState.selectedSlot || !editState.selectedSlot.start){
    if (msgEl){ msgEl.classList.add('hidden'); msgEl.innerHTML = ''; }
    enterChangeTimeMode();
    refreshEditSlots();
    return;
  }
  const newStart = editState.selectedSlot.start;
  const newEnd = new Date(newStart.getTime() + editState.selectedService.durationMinutes * 60000);
  const conflict = findConflictInCache({
    employeeId: state.employee.id,
    day: editState.day,
    start: newStart,
    end: newEnd,
    excludeApptId: editState.apptId,
  });

  if (!conflict){
    editState.selectedSlot = { start: newStart, end: newEnd };
    renderCurrentSlotBox();
    if (msgEl){
      msgEl.classList.remove('hidden');
      msgEl.style.color = 'var(--success)';
      msgEl.innerHTML = `✓ Păstrează ora ${fmtTime(newStart)}. Noul interval va fi <strong>${fmtTime(newStart)} – ${fmtTime(newEnd)}</strong>.`;
    }
  } else {
    if (msgEl){
      msgEl.classList.remove('hidden');
      msgEl.style.color = 'var(--accent)';
      const conflictLabel = conflict.type === 'appt'
        ? `altă programare${conflict.clientName ? ' (' + escapeHtml(conflict.clientName) + ')' : ''} de la ${fmtTime(conflict.start)}`
        : conflict.type === 'block' ? `celălalt job de la ${fmtTime(conflict.start)}`
        : `programul de lucru din această zi`;
      msgEl.innerHTML = `⚠ Atenție: Noul serviciu se suprapune cu ${conflictLabel}! Alege o oră nouă.`;
    }
    enterChangeTimeMode();
    refreshEditSlots();
  }
}

/** Ascunde afișarea orei curente și arată lista de sloturi de ales o oră nouă. */
function enterChangeTimeMode(){
  document.getElementById('editCurrentSlotBox').classList.add('hidden');
  document.getElementById('editSlotsSection').classList.remove('hidden');
  document.getElementById('editSlotsHint').classList.remove('hidden');
  const msgEl = document.getElementById('editSmartMsg');
  if (msgEl){ msgEl.classList.add('hidden'); msgEl.innerHTML = ''; }
}

function renderCurrentSlotBox(){
  const text = document.getElementById('editCurrentSlotText');
  text.textContent = editState.selectedSlot ? `${fmtTime(editState.selectedSlot.start)} – ${fmtTime(editState.selectedSlot.end)}` : '—';
  document.getElementById('editCurrentSlotBox').classList.remove('hidden');
  document.getElementById('editSlotsSection').classList.add('hidden');
  document.getElementById('editSlotsHint').classList.add('hidden');
}

function shiftEditDay(delta){
  const d = new Date(editState.day);
  d.setDate(d.getDate() + delta);
  editState.day = d;
  document.getElementById('editDateLabelText').textContent = fmtDateHeader(d);
  document.getElementById('editDate').value = ymd(d);
  checkEditVacation();
  refreshEditSlots();
}

async function openEditModal(appt){
  if (!navigator.onLine){
    showToast('Necesită conexiune la internet pentru a edita o programare existentă.', 'warning', { autoHide: 3000 });
    return;
  }
  ensureEditModal();
  const dlg = document.getElementById('editModal');
  if (dlg.open) return;

  editState.apptId = appt.id;
  editState.day = new Date(appt.startTime.getFullYear(), appt.startTime.getMonth(), appt.startTime.getDate());
  editState.selectedService = state.services.find(s => s.id === appt.serviceId) || null;
  editState.selectedClient = state.clients.find(c => c.id === appt.clientId) || (appt.clientName ? { id: appt.clientId, name: appt.clientName, phone: '' } : null);
  editState.selectedSlot = { start: appt.startTime, end: appt.endTime };
  editState.status = appt.status;

  document.getElementById('editDateLabelText').textContent = fmtDateHeader(editState.day);
  document.getElementById('editDate').value = ymd(editState.day);
  document.getElementById('editStatusSelect').value = appt.status;
  document.getElementById('editNotes').value = appt.notes || '';
  document.getElementById('editModalError').classList.add('hidden');

  try {
    if (state.services.length === 0) state.services = await getServices();
    if (state.clients.length === 0) state.clients = await getClients();
  } catch (e){ /* continuăm cu ce avem local */ }

  const sel = document.getElementById('editServiceSelect');
  sel.innerHTML = `<option value="">Alege serviciul…</option>` +
    state.services.map(s => `<option value="${s.id}">${escapeHtml(s.name)} (${s.durationMinutes} min, ${s.price} lei)</option>`).join('');
  sel.value = editState.selectedService ? editState.selectedService.id : '';

  resetClientPickerUI('edit');
  if (editState.selectedClient){
    pickerHandlers['edit'](editState.selectedClient);
  }

  checkEditVacation();
  renderCurrentSlotBox();
  dlg.showModal();
}

async function refreshEditSlots(){
  const wrap = document.getElementById('editSlotsWrap');
  const section = document.getElementById('editSlotsSection');
  const hint = document.getElementById('editSlotsHint');
  if (!editState.selectedService){
    section.classList.add('hidden'); hint.classList.remove('hidden');
    hint.textContent = 'Alege un serviciu ca să vezi orele libere.';
    return;
  }
  hint.classList.remove('hidden'); hint.textContent = 'Se calculează orele libere…';
  section.classList.add('hidden');
  try {
    const slots = await getFreeSlots({
      employeeId: state.employee.id, day: editState.day,
      serviceDurationMinutes: editState.selectedService.durationMinutes,
      excludeApptId: editState.apptId,
    });
    editState.slots = slots;
    if (slots.length === 0){ hint.textContent = 'Nu există ore libere în această zi pentru durata aleasă.'; section.classList.add('hidden'); return; }
    hint.classList.add('hidden'); section.classList.remove('hidden');
    const currentStartMs = editState.selectedSlot ? editState.selectedSlot.start.getTime() : null;
    let matchedCurrent = false;
    wrap.innerHTML = slots.map((s, i) => {
      const isCurrent = currentStartMs !== null && isSameDay(s.start, editState.day) && s.start.getTime() === currentStartMs;
      if (isCurrent) matchedCurrent = true;
      return `<button type="button" class="slot-btn ${isCurrent ? 'selected' : ''}" data-i="${i}"><span class="dot"></span>${fmtTime(s.start)}</button>`;
    }).join('');
    if (matchedCurrent) editState.selectedSlot = slots.find(s => s.start.getTime() === currentStartMs);
    else editState.selectedSlot = null;
    wrap.querySelectorAll('.slot-btn').forEach(btnEl => {
      btnEl.addEventListener('click', () => {
        wrap.querySelectorAll('.slot-btn').forEach(c => c.classList.remove('selected'));
        btnEl.classList.add('selected');
        editState.selectedSlot = editState.slots[Number(btnEl.dataset.i)];
      });
    });
  } catch (e){
    hint.textContent = isNetworkError(e) ? 'Fără conexiune — nu se pot calcula orele libere acum.' : 'Eroare: ' + (e.message || e);
  }
}

function showEditModalError(msg){
  const p = document.getElementById('editModalError');
  p.innerHTML = msg; p.classList.remove('hidden');
}

/** Salvare optimistă a editării: cache-ul + UI-ul se actualizează instant
 * (0ms), apoi cererea se trimite în fundal către Supabase. La eroare,
 * revine la starea anterioară și anunță utilizatorul. */
async function saveEditAppointment(){
  if (!editState.selectedClient || !editState.selectedService){
    showEditModalError('Alege o clientă și un serviciu.'); return;
  }
  const status = document.getElementById('editStatusSelect').value;
  const notes = document.getElementById('editNotes').value.trim();
  if (status !== 'cancelled' && !editState.selectedSlot){
    showEditModalError('Alege o oră disponibilă.'); return;
  }
  if (status !== 'cancelled' && findVacationForDay(editState.day)){
    showEditModalError('Ziua aleasă este marcată drept concediu — alege altă zi sau anulează programarea.'); return;
  }
  document.getElementById('editModalError').classList.add('hidden');

  const id = editState.apptId;
  const idx = cache.appointments.findIndex(a => a.id === id);
  const previous = idx >= 0 ? { ...cache.appointments[idx] } : null;
  const updated = {
    ...(previous || {}),
    id,
    serviceId: editState.selectedService.id,
    clientId: editState.selectedClient.id,
    serviceName: editState.selectedService.name,
    serviceColor: editState.selectedService.color,
    clientName: editState.selectedClient.name,
    notes: notes || null,
    status,
  };
  if (editState.selectedSlot){
    updated.startTime = editState.selectedSlot.start;
    updated.endTime = editState.selectedSlot.end;
  }
  if (idx >= 0) cache.appointments[idx] = updated;

  document.getElementById('editModal').close();
  syncMainViewToDay(editState.day);
  // Actualizare LIVE instant (0ms) — fără să aștepte răspunsul serverului.
  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();
  refreshUnconfirmedBadge();

  const toastId = showToast('Se salvează modificările…', 'saving', { persist: true });
  try {
    const payload = {
      service_id: editState.selectedService.id,
      client_id: editState.selectedClient.id,
      notes: notes || null,
      status,
    };
    if (editState.selectedSlot){
      payload.start_time = editState.selectedSlot.start.toISOString();
      payload.end_time = editState.selectedSlot.end.toISOString();
    }
    await updateAppointmentRow(id, payload);
    refreshUnconfirmedBadge();
    updateToast(toastId, 'Programare actualizată.', 'success', 1800);
  } catch (e){
    if (idx >= 0 && previous) cache.appointments[idx] = previous;
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
    refreshUnconfirmedBadge();
    if (e.isStatusCheck){
      updateToast(toastId, `Statusul „${status}” necesită o mică actualizare în Supabase (vezi SQL-ul din Setări) — s-a revenit la starea anterioară.`, 'warning', 4600);
    } else {
      updateToast(toastId, 'Eroare la salvare — s-a revenit la starea anterioară: ' + (e.message || e), 'error', 4200);
    }
  }
}

/* ====================== BOOTSTRAP & AUTH ====================== */
async function bootstrapApp(){
  ensureModal();
  ensureEditModal();
  loadPendingFromStorage();
  state.calendarMonth = new Date(state.selectedDay.getFullYear(), state.selectedDay.getMonth(), 1);
  try { const employees = await getEmployees(); state.employee = employees[0] || null; }
  catch (e){ state.employee = null; }

  if (state.employee){
    try {
      const { map, missingTable } = await getWeekdayHours(state.employee.id);
      state.weekdayHours = map;
      state.weekdayHoursMissingTable = missingTable;
    } catch (e){ /* rămân valorile implicite 08:00-22:00 */ }

    try { await bulkLoadCache(); } catch (e){ state.services = []; }
    mergePendingIntoCache();
  } else {
    try { state.services = await getServices(); } catch (e){ state.services = []; }
  }

  await handleRoute();
  if (navigator.onLine) trySyncOfflineQueue();
}

sb.auth.onAuthStateChange((_event, session) => {
  const wasLoggedIn = !!state.session;
  state.session = session;
  if (session){ if (!wasLoggedIn) bootstrapApp(); }
  else { renderLogin(); }
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if (session) bootstrapApp();
  else renderLogin();
})();
</script>
