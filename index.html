<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Agendă</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agendă" />
<meta name="theme-color" content="#D6336C" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FCF0F5;
    --surface:#FFFFFF;
    --border:#F5D9E6;
    --ink:#3A2430;
    --ink-soft:#966E80;
    --accent:#D6336C;
    --accent-dark:#A8244F;
    --accent-soft:#FBDCE6;
    --accent-2:#C2487B;
    --success:#4C7A5D;
    --success-soft:#E4EEE6;
    --muted:#C9A2B3;
    --warn:#B8860B;
    --info:#2E5F8A;
    --job-block:#A8788C;
    --job-block-soft:#F6E7ED;
    --job-block-dot:#262626;
    --danger:#D93838;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow:0 10px 28px rgba(58,36,48,0.12);
    --font-display:'Fraunces', serif;
    --font-body:'Work Sans', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; overflow-x:hidden !important; overflow-y:scroll; width:100%; max-width:100vw; scrollbar-gutter:stable; margin:0; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  #app{ max-width:480px; margin:0 auto; min-height:100%; position:relative; padding-bottom:100px; overflow-x:hidden !important; width:100%; box-sizing:border-box; }
  @media (min-width:780px){
    #app{ max-width:940px; }
  }

  /* ---------- TOASTS ---------- */
  .toast-container{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:80;
    display:flex; flex-direction:column; gap:8px; align-items:center; max-width:92vw;
  }
  .toast{
    padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:600; color:#fff;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; white-space:nowrap;
    max-width:92vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast-saving{ background:var(--info); }
  .toast-success{ background:var(--success); }
  .toast-error{ background:var(--accent-dark); }
  .toast-warning{ background:var(--warn); }
  .toast-info{ background:var(--ink); }
  .toast-spin{ width:12px; height:12px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; flex:none; }

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; max-width:480px; margin:0 auto;
  }
  .login-card{ width:100%; }
  .login-mark{
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:24px; font-weight:600;
    margin:0 auto 18px auto;
  }
  .login-title{
    font-family:var(--font-display); font-weight:600; font-size:26px;
    text-align:center; margin:0 0 6px 0;
  }
  .login-sub{
    text-align:center; color:var(--ink-soft); font-size:14px; margin:0 0 28px 0;
  }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; padding:12px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface);
    font-size:15px; color:var(--ink); outline:none;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); }
  .btn-primary{
    width:100%; padding:13px 14px; border-radius:var(--radius-sm);
    background:var(--accent); color:#fff; border:none; font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-primary:disabled{ opacity:.6; cursor:default; }
  .btn-outline{
    padding:9px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent-dark); }
  .error-text{ color:var(--accent); font-size:13.5px; margin:0 0 14px 0; }
  .success-text{ color:var(--success); font-size:13.5px; margin:0 0 14px 0; }

  /* ---------- HEADER ---------- */
  header.top{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:8px 14px; font-size:16px; border-bottom:1px solid var(--border);
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; flex-direction:column; }
  .brand-title-row{ display:flex; align-items:center; gap:7px; }
  .brand-title{ font-family:var(--font-display); font-weight:600; font-size:16px; }
  .conn-dot{ width:8px; height:8px; border-radius:50%; background:var(--success); flex:none; }
  .conn-dot.offline{ background:var(--warn); }
  .brand-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .header-actions{ display:flex; gap:6px; }
  .icon-btn{
    position:relative;
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-upcoming{
    display:flex; align-items:center; gap:6px; height:32px; padding:0 12px;
    border-radius:999px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:13px; font-weight:600; white-space:nowrap;
  }
  .btn-upcoming:hover{ border-color:var(--accent); color:var(--accent); }
  .badge-count{
    position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 4px;
    border-radius:999px; background:var(--warn); color:#fff; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1; border:2px solid var(--bg);
  }

  /* ---------- BOARD: mini calendar + agenda ---------- */
  .board{ display:grid; grid-template-columns:1fr; gap:18px; padding:18px; box-sizing:border-box; width:100%; height:auto !important; }
  @media (min-width:780px){
    .board{ grid-template-columns:320px 1fr; align-items:start; }
  }
  #agendaPanel{ width:100%; height:auto !important; overflow-y:visible !important; flex:none !important; }
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px; box-shadow:var(--shadow); box-sizing:border-box; width:100%;
  }
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-month-label{ font-family:var(--font-display); font-weight:600; font-size:17px; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .cal-nav button:hover{ border-color:var(--accent); color:var(--accent); }
  .cal-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
    font-size:11px; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.02em;
  }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; width:100%; }
  .cal-cell{
    position:relative; aspect-ratio:1/1 !important; border:none; background:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:13.5px; color:var(--ink);
    box-sizing:border-box !important; padding:0; margin:0; overflow:hidden; /* nicio schimbare de cutie la selectare/hover */
  }
  .cal-cell.empty{ pointer-events:none; }
  .cal-cell:not(.empty):hover{ background:var(--accent-soft); }
  .cal-cell.today .cal-daynum{ box-shadow:inset 0 0 0 2px var(--accent); border-radius:50%; }
  .cal-cell.selected{ background:var(--accent); border:none; }
  .cal-cell.selected .cal-daynum{ color:#fff; }
  /* Container cu dimensiune FIXĂ pentru cifra zilei, ca „bold”/contur (today/selected)
     să nu schimbe lățimea textului și să provoace un mic „jump” vizual — greutatea
     fontului e uniformă (600) în toate stările. */
  .cal-daynum{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; box-sizing:border-box; margin-top:-5px;
    font-variant-numeric:tabular-nums; line-height:1; font-weight:600;
  }
  .dots-container{
    position:absolute; bottom:2px; left:0; right:0;
    display:flex; flex-wrap:nowrap; gap:3px; align-items:center; justify-content:center;
  }
  .day-dot{ width:5.5px; height:5.5px; border-radius:50%; flex:none; }
  .cal-cell.selected .day-dot{ background:#fff !important; opacity:.9; }
  .cal-today-btn{
    margin-top:14px; width:100%; padding:9px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--bg); font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .cal-today-btn:hover{ border-color:var(--accent); color:var(--accent-dark); }

  .agenda-employee{ font-size:12.5px; color:var(--ink-soft); }
  .agenda-date{ font-family:var(--font-display); font-weight:600; font-size:19px; margin-top:2px; margin-bottom:16px; }

  .day-state{ text-align:center; color:var(--ink-soft); font-size:14px; padding:48px 12px; }
  /* Înălțime minimă stabilă pentru zona de agendă, ca trecerea de pe o zi
     goală pe o zi cu job/programări să nu producă un „jump" vizual la
     schimbarea dimensiunii panoului. */
  #dayContent{ min-height:320px; }

  /* Containment strict — butoanele/textele din cardul de programare nu mai
     pot împinge layout-ul în lateral, indiferent de conținut. */
  #app, .board, .panel, .appt-card, .appt-card *{
    box-sizing:border-box !important; max-width:100% !important;
  }

  .appt-card{
    display:flex; flex-direction:column; background:var(--bg);
    border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:var(--radius-md); padding:14px 14px; margin-bottom:10px; cursor:pointer;
    width:100% !important; min-width:0 !important; overflow:hidden;
    word-break:break-word; overflow-wrap:anywhere;
  }
  .appt-card:hover{ box-shadow:0 4px 14px rgba(43,33,31,.08); }
  /* Zona de sus: ora + numele clientei + serviciul, pe toată lățimea
     cardului — nu mai concurează pe orizontală cu butoanele de acțiune. */
  .appt-card-top{ display:flex; gap:14px; align-items:flex-start; flex:1; width:100%; min-width:0; }
  /* Zona de jos: WhatsApp / Copiază / Anulează, toate pe o singură linie,
     alineate la dreapta. */
  .appt-actions-bar{ display:flex; flex-direction:row; gap:8px; justify-content:flex-end; margin-top:8px; }
  .appt-actions-bar .reminder-actions{ flex-direction:row; margin-left:0; }
  .appt-time{
    flex:none; width:56px; font-family:var(--font-display); font-weight:600;
    font-size:15px; line-height:1.25; color:var(--accent-dark); padding-top:1px;
  }
  .appt-time small{ display:block; font-weight:400; color:var(--ink-soft); font-size:12px; }
  .appt-body{ flex:1; min-width:0; }
  .appt-client{ font-weight:600; font-size:15px; }
  .appt-service{ font-size:13.5px; color:var(--ink-soft); margin-top:2px; display:flex; align-items:center; gap:6px; }
  .appt-service .swatch{ width:9px; height:9px; border-radius:50%; flex:none; }
  .appt-tag{
    display:inline-block; margin-top:6px; margin-right:6px; font-size:11.5px; padding:2px 8px;
    border-radius:20px; background:var(--muted); color:#fff;
  }
  .appt-tag.pending-tag{ background:var(--warn); }
  .appt-amount{
    display:inline-block; margin-top:6px; font-size:12px; font-weight:700;
    color:var(--success);
  }
  .appt-amount.estimated{ color:var(--ink-soft); font-weight:600; }
  .agenda-total{
    font-size:13.5px; font-weight:600; color:var(--success); margin-top:2px;
  }

  /* ---------- Dialog de confirmare custom (înlocuiește window.confirm) ---------- */
  #confirmDialog{
    max-width:360px; padding:20px; background:var(--surface); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); border:1px solid var(--border);
  }
  .confirm-body{ padding:4px 2px 18px; }
  .confirm-title{ font-family:var(--font-display); font-size:17px; font-weight:600; margin-bottom:8px; }
  .confirm-message{ font-size:14px; color:var(--ink-soft); line-height:1.45; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{ flex:1; }
  .btn-danger{
    width:100%; padding:13px 14px; border-radius:var(--radius-sm);
    background:var(--danger); color:#fff; border:none; font-size:15px; font-weight:600;
  }
  .btn-danger:hover{ opacity:.9; }
  /* ---------- Rândul din subsolul #editModal: coș de gunoi (20%) + Salvează (80%) ---------- */
  .edit-footer-row{ display:flex; gap:8px; }
  .edit-footer-row button{ width:auto; }
  .edit-footer-row .btn-icon-only{ flex:0 0 20%; padding:0; display:flex; align-items:center; justify-content:center; }
  .edit-footer-row #saveEditAppt{ flex:1 1 auto; }
  /* ---------- Selector custom de status (pastile, nu <select> nativ) ---------- */
  .status-pills{ display:flex; flex-wrap:wrap; gap:8px; }
  .status-pill{
    flex:1 1 auto; min-width:100px; text-align:center; padding:10px 10px;
    border-radius:999px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer;
  }
  .status-pill:hover{ border-color:var(--accent); }
  .status-pill.active[data-status="confirmed"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .status-pill.active[data-status="unconfirmed"]{ background:var(--warn); border-color:var(--warn); color:#fff; }
  .status-pill.active[data-status="completed"]{ background:var(--success); border-color:var(--success); color:#fff; }
  .status-pill.active[data-status="cancelled"]{ background:var(--muted); border-color:var(--muted); color:#fff; }
  .appt-cancel{
    flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
  }
  .appt-cancel:hover{ border-color:var(--accent); color:var(--accent); }
  .appt-card.cancelled{ opacity:.55; border-left-color:var(--muted) !important; }
  .appt-card.cancelled .appt-client, .appt-card.cancelled .appt-service{ text-decoration:line-through; }

  /* ---------- Reamintire: Copiază mesaj + WhatsApp ---------- */
  .reminder-actions{ display:flex; flex-direction:column; gap:6px; flex:none; margin-left:8px; }
  .reminder-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    text-decoration:none; cursor:pointer;
  }
  .reminder-copy-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .reminder-wa-btn{ border-color:#25D36655; color:#25D366; }
  .reminder-wa-btn:hover{ border-color:#25D366; background:#25D36618; }
  .push-reminder-btn.has-reminder{ background:var(--success); border-color:var(--success); color:#fff; }
  .push-reminder-btn.has-reminder:hover{ opacity:.9; }
  .unconf-card .reminder-actions{ flex-direction:row; margin-top:8px; margin-bottom:12px; margin-left:0; }

  .block-card{
    display:flex; gap:14px; align-items:flex-start; background:var(--job-block-soft);
    border:1px dashed var(--job-block); border-left:4px solid var(--job-block);
    border-radius:var(--radius-md); padding:14px 14px; margin-bottom:10px;
  }
  .block-time{
    flex:none; width:56px; font-family:var(--font-display); font-weight:600;
    font-size:15px; line-height:1.25; color:var(--job-block); padding-top:1px;
  }
  .block-time small{ display:block; font-weight:400; color:var(--ink-soft); font-size:12px; }
  .block-body{ flex:1; min-width:0; }
  .block-label{ font-weight:600; font-size:14px; color:var(--ink); }
  .block-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  /* ---------- Elemente din trecut (programări, ture, sarcini) ---------- */
  .past-item{ opacity:0.5; filter:grayscale(35%); }
  .past-item .appt-client, .past-item .appt-service,
  .past-item .block-label, .past-item .task-title{ text-decoration:line-through; }

  /* ---------- Sarcini custom / alte activități ---------- */
  .task-card{
    display:flex; gap:14px; align-items:flex-start; background:var(--surface);
    border:1px dashed var(--border); border-left:4px solid var(--accent-2);
    border-radius:var(--radius-md); padding:14px 14px; margin-bottom:10px;
  }
  .task-time{
    flex:none; width:56px; font-family:var(--font-display); font-weight:600;
    font-size:15px; line-height:1.25; color:var(--accent-2); padding-top:1px;
  }
  .task-time small{ display:block; font-weight:400; color:var(--ink-soft); font-size:12px; }
  .task-body{ flex:1; min-width:0; }
  .task-title{ font-weight:600; font-size:14px; color:var(--ink); display:flex; align-items:center; gap:7px; }
  .task-color-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .task-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .task-actions{ display:flex; gap:6px; flex:none; }

  /* ---------- Panou „Urmează” (14 zile) ---------- */
  .upcoming-item{
    display:flex; flex-direction:column; gap:2px; padding:10px 12px;
    border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px;
  }
  .upcoming-when{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .upcoming-label{ font-size:14px; color:var(--ink); }

  /* ---------- Finalizare programări trecute (sumă încasată) ---------- */
  .finalize-row{ display:flex; gap:8px; align-items:center; margin-top:8px; }
  .finalize-row input[type="number"]{ flex:1; }

  /* ---------- Selector ture predefinite (celălalt job) ---------- */
  .wk-shift-select{ width:100%; margin-bottom:6px; }
  .shift-pill-group{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .shift-pill{
    padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13px; font-weight:600;
    white-space:nowrap;
  }
  .shift-pill:hover{ border-color:var(--accent); }
  .shift-pill.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .shift-pill:disabled{ opacity:.45; }

  .current-slot-box{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); font-family:var(--font-display); font-weight:600; font-size:15px;
  }

  .history-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .history-row:last-child{ border-bottom:none; }
  .history-date{ font-size:12px; color:var(--ink-soft); flex:none; width:90px; }
  .history-mid{ flex:1; min-width:0; font-size:13.5px; font-weight:600; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .history-price{ font-size:12.5px; color:var(--ink-soft); flex:none; }
  .history-status{ font-size:10.5px; padding:2px 7px; border-radius:20px; background:var(--muted); color:#fff; }

  .unconf-card{
    background:var(--bg); border:1px solid var(--border); border-left:4px solid var(--warn);
    border-radius:var(--radius-md); padding:14px; margin-bottom:10px;
  }
  .unconf-section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:14px 0 8px; }
  .unconf-section-title:first-child{ margin-top:0; }
  .past-unresolved-card{ border-left-color:var(--accent-2); }
  .unconf-top{ margin-bottom:12px; }
  .unconf-client{ font-weight:600; font-size:15px; }
  .unconf-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .unconf-actions{ display:flex; gap:8px; }
  .unconf-actions button{ flex:1; padding:9px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; border:none; color:#fff; }
  .btn-confirm{ background:var(--success); }
  .btn-confirm:hover{ opacity:.9; }
  .btn-decline{ background:var(--accent); }
  .btn-decline:hover{ background:var(--accent-dark); }

  .spinner{
    width:22px; height:22px; border-radius:50%; border:3px solid var(--border);
    border-top-color:var(--accent); animation:spin .7s linear infinite; margin:36px auto;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Bottom Navigation Bar (stil aplicație nativă) ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; height:68px; background:var(--surface);
    border-top:1px solid var(--border); z-index:50; display:flex; align-items:center; justify-content:space-around;
    max-width:480px; margin:0 auto; box-shadow:0 -4px 18px rgba(43,33,31,.06);
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  @media (min-width:820px){ .bottom-nav{ max-width:940px; } }
  .bnav-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:none; border:none; color:var(--ink-soft); font-size:10.5px; font-weight:600;
    flex:1; height:100%; position:relative;
  }
  .bnav-btn:active{ color:var(--accent); }
  .bnav-btn.active{ color:var(--accent); }
  .bnav-badge{
    position:absolute; top:6px; right:calc(50% - 20px); min-width:16px; height:16px; padding:0 4px;
    background:var(--accent); color:#fff; border-radius:999px; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .bnav-add{
    flex:none; width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 20px rgba(155,34,71,0.35);
    margin-top:-30px; border:4px solid var(--surface);
  }
  .bnav-add:active{ background:var(--accent-dark); }

  /* ---------- Setări: secțiune pliabilă „Interval orar” ---------- */
  #hoursDetails{ padding:0; }
  #hoursDetails > summary{ list-style:none; cursor:pointer; }
  #hoursDetails > summary::-webkit-details-marker{ display:none; }
  .hours-summary{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .hours-summary-toggle{
    font-size:12.5px; font-weight:600; color:var(--accent);
    border:1px solid var(--accent); border-radius:999px; padding:6px 12px; flex:none;
  }
  #hoursDetails[open] .hours-summary-toggle::after{ content:' (ascunde)'; }
  .hours-details-body{ margin-top:14px; }

  /* ---------- MODAL (centrat pe ecran) ---------- */
  dialog{
    border:none; padding:0; width:90%; max-width:440px;
    top:50%; left:50%; right:auto; bottom:auto; margin:0;
    transform:translate(-50%, -50%);
    border-radius:var(--radius-lg); box-shadow:var(--shadow); max-height:88vh;
    box-sizing:border-box; touch-action:manipulation;
  }
  dialog::backdrop{ background:rgba(43,33,31,0.45); }
  dialog[open]{
    display:flex; flex-direction:column;
    animation:modalPop .18s ease-out;
  }
  @keyframes modalPop{
    from{ transform:translate(-50%, -50%) scale(.96); opacity:0; }
    to{ transform:translate(-50%, -50%) scale(1); opacity:1; }
  }
  .sheet-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 12px 18px; border-bottom:1px solid var(--border); flex:none;
  }
  .sheet-title{ font-family:var(--font-display); font-weight:600; font-size:19px; }
  .sheet-body{ padding:16px 18px; overflow-y:auto; flex:1; }
  .sheet-footer{ padding:14px 18px 20px 18px; border-top:1px solid var(--border); flex:none; }

  /* Modalul „Programare nouă” păstrează o dimensiune FIXĂ, indiferent dacă
     sloturile orare sunt încărcate, ascunse sau selectate — doar conținutul
     din interior derulează (.sheet-body are overflow-y:auto).
     IMPORTANT: regula de display trebuie scopată la [open], altfel
     suprascrie display:none implicit al <dialog> și rămâne mereu vizibil. */
  #addModal{ height:82vh; max-height:600px; }
  #addModal[open]{ display:flex; flex-direction:column; }

  .field select{
    width:100%; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:15px; color:var(--ink); appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237A6A64' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .modal-date-row{ display:flex; align-items:center; gap:8px; }
  .date-arrow-sm{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .date-arrow-sm:hover{ border-color:var(--accent); color:var(--accent); }
  .date-picker-wrap{ position:relative; flex:1; }
  .date-label{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:11px 12px; font-family:var(--font-display);
    font-size:15px; font-weight:600; color:var(--ink); text-align:center;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .date-input-hidden{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .link-btn{
    background:none; border:none; color:var(--accent-dark); font-size:13.5px; font-weight:600;
    padding:2px 0; margin-top:-4px; margin-bottom:14px;
  }
  .new-client-box{
    background:var(--bg); border:1px dashed var(--border); border-radius:var(--radius-sm);
    padding:12px; margin:-6px 0 14px 0;
  }
  .new-client-box .field{ margin-bottom:8px; }
  .new-client-box .btn-secondary{
    width:100%; padding:9px; border-radius:var(--radius-sm); border:none;
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
  }
  .slots-label{ font-size:13.5px; color:var(--ink-soft); margin:4px 0 10px 0; }
  .slots-wrap{ display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }

  /* ---------- Selector vizual de servicii (modalul „Programare nouă”) ---------- */
  .service-search-input{
    width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:14px; margin-bottom:8px;
  }
  .service-picker{
    display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto;
    padding:2px; margin-bottom:2px;
  }
  .service-card{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:7px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
    background:var(--surface);
  }
  .service-card:hover{ border-color:var(--accent); }
  .service-card.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .service-card-dot{ width:13px; height:13px; border-radius:50%; flex:none; }
  .service-card-info{ flex:1; min-width:0; }
  .service-card-name{ font-weight:600; font-size:13.5px; color:var(--ink); }
  .service-card-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .service-card-check{
    flex:none; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:transparent;
  }
  .service-card.selected .service-card-check{ background:var(--accent); border-color:var(--accent); color:#fff; }

  /* Zonă cu înălțime minimă fixă, ca modalul „Programare nouă” să nu-și
     schimbe dimensiunea când sloturile apar/dispar/se selectează. */
  .slots-area{ min-height:180px; }
  .slot-btn{
    width:100%; display:flex; align-items:center; gap:9px; text-align:left;
    padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:14px; font-weight:600; color:var(--accent-dark);
  }
  .slot-btn .dot{ width:6px; height:6px; border-radius:50%; background:var(--success); flex:none; }
  .slot-btn.selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .slot-btn.selected .dot{ background:#fff; }
  .hint-text{ font-size:13.5px; color:var(--ink-soft); }

  /* ---------- CLIENT PICKER ---------- */
  .client-search-input{
    width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); font-size:14px; margin-bottom:8px;
  }
  .client-list{ max-height:210px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
  .client-row{
    width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px;
    border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); text-align:left; cursor:pointer;
  }
  .client-row:hover{ border-color:var(--accent); }
  .client-row-actions{ display:flex; gap:6px; flex:none; margin-left:auto; }
  .icon-btn-sm{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--bg);
    color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn-sm:hover{ border-color:var(--accent); color:var(--accent); }
  .client-row-delete:hover{ border-color:var(--accent); color:var(--accent); }
  .client-avatar{
    flex:none; width:34px; height:34px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent-dark); font-weight:700; font-size:12.5px; display:flex; align-items:center; justify-content:center;
  }
  .client-row-info{ display:flex; flex-direction:column; min-width:0; }
  .client-row-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .client-row-name em{ font-style:normal; color:var(--warn); font-weight:600; font-size:11px; margin-left:4px; }
  .client-row-phone{ font-size:12px; color:var(--ink-soft); }
  .client-empty{ font-size:13px; color:var(--ink-soft); padding:10px 4px; }
  .client-selected{
    display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:var(--bg); margin-bottom:8px;
  }
  .client-selected .client-row-info{ flex:1; }
  .client-change-btn{ flex:none; padding:6px 10px; font-size:12px; }

  /* ---------- SETTINGS ---------- */
  .settings-section{ margin-bottom:18px; }
  .settings-section h2{ font-family:var(--font-display); font-weight:600; font-size:17px; margin:0 0 4px 0; }
  .settings-section .settings-hint{ font-size:13px; color:var(--ink-soft); margin:0 0 14px 0; }
  .wd-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .wd-row:last-child{ border-bottom:none; }
  .wd-label{ flex:1 1 80px; min-width:64px; max-width:100%; font-weight:600; font-size:13.5px; }
  .wd-date{ display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .wd-times{ display:flex; align-items:center; gap:6px; flex:2 1 190px; justify-content:flex-end; flex-wrap:wrap; max-width:100%; }
  .time-input{
    padding:8px 9px; border:1px solid var(--border); border-radius:8px;
    font-size:13.5px; width:90px; max-width:40vw; min-width:70px; color:var(--ink); background:var(--surface);
  }
  .time-input:disabled{ background:var(--bg); color:var(--muted); }
  .wd-sep{ color:var(--ink-soft); font-size:12px; flex:none; }
  .wd-off{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); flex:none; }
  .wd-off input{ width:15px; height:15px; flex:none; }
  @media (max-width:380px){
    .wd-row{ flex-direction:column; align-items:flex-start; }
    .wd-times{ width:100%; justify-content:flex-start; }
  }
  /* ---------- Compactare specifică „Programul de la celălalt job” (#weekRows) ---------- */
  #weekRows .wd-row{
    display:block; padding:8px 0; flex-wrap:nowrap;
  }
  #weekRows .wd-row-top{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  #weekRows .wd-label{ flex:1 1 auto; min-width:0; max-width:none; }
  #weekRows .wd-off{ flex:none; margin:0; }
  #weekRows .wd-times{
    display:flex; align-items:center; gap:6px; justify-content:flex-start;
    flex-wrap:nowrap; flex:none; width:auto; margin-top:6px;
  }
  #weekRows .time-input{ width:84px; max-width:none; min-width:0; }
  .week-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; flex-wrap:wrap; }
  .week-nav .btn-outline{ flex:1 1 auto; min-width:0; white-space:nowrap; }
  .week-range{ font-family:var(--font-display); font-weight:600; font-size:15px; }
  .setup-note{
    background:var(--bg); border-left:3px solid var(--accent); border-radius:8px;
    padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft);
  }
  .setup-note pre{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:10px; font-size:11px; overflow-x:auto; margin:8px 0; color:var(--ink);
  }
  .back-row{ display:flex; align-items:center; gap:10px; }
  .back-row .icon-btn{ flex:none; }

  .model-card{
    display:flex; gap:12px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-md);
    background:var(--bg); margin-bottom:10px;
  }
  .model-thumb{
    flex:none; width:64px; height:64px; border-radius:var(--radius-sm); object-fit:cover;
    background:var(--accent-soft); border:1px solid var(--border);
  }
  .model-thumb-fallback{
    flex:none; width:64px; height:64px; border-radius:var(--radius-sm); background:var(--accent-soft);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--accent-dark);
  }
  .model-body{ flex:1; min-width:0; }
  .model-title-row{ display:flex; align-items:center; gap:7px; }
  .model-name{ font-weight:600; font-size:14.5px; }
  .model-swatch{ width:11px; height:11px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.08); }
  .model-meta{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .model-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; line-height:1.4; }
  .model-actions{ display:flex; gap:14px; margin-top:8px; }
  .model-actions .link-btn{ font-size:12.5px; padding:0; }
  .model-delete-btn{ color:var(--accent); }
  .model-gallery-preview{ display:flex; flex-wrap:wrap; gap:8px; margin:-6px 0 14px 0; }
  .model-gallery-preview img{
    width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--border); background:var(--accent-soft);
  }
  .service-form-row{ display:flex; gap:10px; }
  .service-form-row .field{ flex:1; }
  /* Rândul de date pentru concedii — coloană verticală, ca să nu iasă
     casetele de dată în afara ecranului pe mobil îngust. */
  .vacation-date-row{ display:flex; flex-direction:column; gap:8px; width:100%; }
  .vacation-date-row .field{ width:100%; }
  #vacStart, #vacEnd{ width:100% !important; max-width:100% !important; box-sizing:border-box !important; }
  .color-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .color-row input[type=color]{
    width:44px; height:38px; border:1px solid var(--border); border-radius:8px; padding:2px; background:var(--surface);
  }
  .preset-swatches{ display:flex; gap:7px; }
  .preset-swatch{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--border); cursor:pointer;
  }
  .preset-swatch.active{ box-shadow:0 0 0 2px var(--ink); }

  .stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat-card{ background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; text-align:center; }
  .stat-value{ font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--accent-dark); }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  /* ---------- VACATION ---------- */
  .vacation-card{
    display:flex; gap:12px; align-items:center; background:var(--job-block-soft);
    border:1px solid var(--border); border-left:4px solid var(--job-block);
    border-radius:var(--radius-md); padding:16px 14px; margin-bottom:14px;
  }
  .vacation-card-icon{ font-size:24px; flex:none; }
  .vacation-card-title{ font-family:var(--font-display); font-weight:700; font-size:14.5px; letter-spacing:.03em; color:var(--ink); }
  .vacation-card-desc{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .vacation-banner{
    background:var(--job-block-soft); border:1px solid var(--job-block); border-radius:var(--radius-sm);
    padding:10px 12px; font-size:13px; color:var(--ink); margin:-2px 0 14px 0; display:flex; gap:8px; align-items:flex-start;
  }
  .cal-cell.vacation:not(.selected){ box-shadow:inset 0 0 0 40px var(--vac-tint, transparent); }

  /* ---------- TAG PILLS & MODEL GALLERY ---------- */
  .tag-pills{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tag-pill{
    padding:6px 12px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); font-size:12px; font-weight:600; color:var(--ink-soft);
  }
  .tag-pill.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tag-pill:hover{ border-color:var(--accent); color:var(--accent-dark); }
  .model-gallery-strip{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .model-gallery-thumb{ width:44px; height:44px; border-radius:8px; object-fit:cover; border:1px solid var(--border); cursor:pointer; }
  .model-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .model-tag-pill{
    font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--accent-soft);
    color:var(--accent-dark); font-weight:600; border:none; cursor:pointer;
  }

  /* ---------- LIGHTBOX ---------- */
  dialog.lightbox-dialog{
    width:100vw; height:100vh; max-width:100vw; max-height:100vh; border-radius:0;
    background:rgba(20,14,13,0.96); position:relative;
  }
  dialog.lightbox-dialog[open]{
    display:flex; align-items:center; justify-content:center;
  }
  dialog.lightbox-dialog::backdrop{ background:rgba(20,14,13,0.96); }
  .lightbox-img{ max-width:92vw; max-height:82vh; object-fit:contain; border-radius:10px; }
  .lightbox-close{ position:absolute; top:16px; right:16px; background:rgba(255,255,255,.15); border:none; color:#fff; }
  .lightbox-close:hover{ background:rgba(255,255,255,.28); color:#fff; }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%;
    border:none; background:rgba(255,255,255,.15); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-nav:hover{ background:rgba(255,255,255,.28); }
  .lightbox-prev{ left:14px; }
  .lightbox-next{ right:14px; }
  .lightbox-counter{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%); color:#fff; font-size:12.5px;
    background:rgba(255,255,255,.15); padding:4px 12px; border-radius:999px;
  }

  /* ---------- CLIENT GALLERY (full-screen catalog) ---------- */
  dialog.client-gallery-dialog{
    width:100vw; height:100vh; max-width:100vw; max-height:100vh; border-radius:0; top:0; left:0; transform:none;
  }
  .client-gallery-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .client-gallery-card{ text-align:center; }
  .client-gallery-cover{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:var(--radius-md); border:1px solid var(--border); cursor:pointer;
    background:var(--accent-soft);
  }
  .client-gallery-name{ font-weight:600; font-size:13px; margin-top:7px; }
  .client-gallery-tags{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:4px; }

  /* ---------- Listă prețuri (printabilă, fără durată) ---------- */
  .price-list-title{ font-family:var(--font-display); font-size:22px; text-align:center; margin:0 0 18px 0; }
  .price-list-rows{ display:flex; flex-direction:column; gap:11px; }
  .price-list-row{ display:flex; align-items:baseline; gap:8px; }
  .price-list-name{ font-weight:600; font-size:14.5px; white-space:nowrap; }
  .price-list-dots{ flex:1; border-bottom:1px dotted var(--border); margin-bottom:4px; }
  .price-list-value{ font-weight:700; font-size:14.5px; color:var(--accent-dark); white-space:nowrap; }
  @media print{
    body *{ visibility:hidden; }
    #priceListContent, #priceListContent *{ visibility:visible; }
    #priceListContent{ position:absolute; top:0; left:0; width:100%; padding:24px; }
  }

  .hidden{ display:none !important; }
</style>

<div id="root"></div>

<script>

/** Normalizează numărul pentru link-ul wa.me: doar cifre, iar dacă începe
 * cu 0 (format local RO) îl înlocuim cu prefixul de țară 40. */
function phoneForWhatsApp(phone){
  if (!phone) return '';
  let digits = phone.replace(/[^\d+]/g, '');
  if (digits.startsWith('+')) digits = digits.slice(1);
  if (digits.startsWith('0')) digits = '40' + digits.slice(1);
  return digits;
}

function hexToRgba(hex, alpha){
  let h = (hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const num = parseInt(h, 16);
  if (isNaN(num)) return `rgba(179,162,155,${alpha})`;
  const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function isNetworkError(e){
  if (!navigator.onLine) return true;
  if (!e) return false;
  const msg = ((e && e.message) || '').toLowerCase();
  return msg.includes('failed to fetch') || msg.includes('networkerror') || msg.includes('load failed') || msg.includes('network request failed');
}

/* ====================== TOASTS ====================== */
function ensureToastContainer(){
  if (document.getElementById('toastContainer')) return;
  const el = document.createElement('div');
  el.id = 'toastContainer';
  el.className = 'toast-container';
  document.body.appendChild(el);
}

function showToast(message, type, opts){
  opts = opts || {};
  ensureToastContainer();
  const container = document.getElementById('toastContainer');
  const id = opts.id || uid('toast');
  let el = document.getElementById(id);
  if (!el){
    el = document.createElement('div');
    el.id = id;
    container.appendChild(el);
  }
  el.className = `toast toast-${type || 'info'}`;
  el.innerHTML = (type === 'saving' ? '<span class="toast-spin"></span>' : '') + `<span>${escapeHtml(message)}</span>`;
  clearTimeout(el._hideTimer);
  if (!opts.persist){
    el._hideTimer = setTimeout(() => { el.remove(); }, opts.autoHide || 2200);
  }
  return id;
}
function updateToast(id, message, type, autoHide){
  showToast(message, type, { id, persist: !autoHide, autoHide });
}
function dismissToast(id){
  const el = document.getElementById(id);
  if (el) el.remove();
}

async function trySyncOfflineQueue(){
  if (!navigator.onLine) return;
  if (state.pendingClients.length === 0 && state.pendingAppointments.length === 0) return;

  const toastId = showToast('Se sincronizează datele salvate offline…', 'saving', { persist: true });
  const clientIdMap = {};
  let syncedClients = 0, syncedAppointments = 0;
  const remainingClients = [];
  const remainingAppointments = [];

  for (const item of state.pendingClients){
    try {
      const real = await addClient(item.payload);
      clientIdMap[item.id] = real.id;
      syncedClients++;
      const idx = state.clients.findIndex(c => c.id === item.id);
      if (idx >= 0) state.clients[idx] = real;
    } catch (e){
      if (isNetworkError(e)) remainingClients.push(item);
      // altfel: cerere invalidă -> renunțăm la ea, nu blocăm restul cozii
    }
  }

  for (const item of state.pendingAppointments){
    try {
      const payload = Object.assign({}, item.payload);
      if (clientIdMap[payload.clientId]) payload.clientId = clientIdMap[payload.clientId];
      if (String(payload.clientId).startsWith('offline-client')){
        remainingAppointments.push(item); // clienta ei încă nu s-a sincronizat
        continue;
      }
      await addAppointment({
        employeeId: payload.employeeId,
        clientId: payload.clientId,
        serviceId: payload.serviceId,
        start: new Date(payload.start),
        end: new Date(payload.end),
        notes: payload.notes,
        status: payload.status || 'unconfirmed',
      });
      syncedAppointments++;
    } catch (e){
      if (isNetworkError(e)) remainingAppointments.push(item);
      // altfel (ex: suprapunere) -> renunțăm la acea programare, e un caz marginal
    }
  }

  state.pendingClients = remainingClients;
  state.pendingAppointments = remainingAppointments;
  savePendingClients();
  savePendingAppointments();
  state.clients = state.clients.filter(c => !c.pendingOffline || remainingClients.some(i => i.id === c.id));

  // Reconciliem cache-ul: re-descărcăm intervalul cunoscut (înlocuiește
  // intrările optimiste sincronizate cu rândurile reale), apoi re-adăugăm
  // programările care încă n-au reușit să se sincronizeze.
  await forceRefreshCache();
  mergePendingIntoCache();

  if (syncedAppointments > 0 || syncedClients > 0){
    updateToast(toastId, `Reconectat! Am sincronizat ${syncedAppointments} programări și ${syncedClients} cliente noi efectuate offline.`, 'success', 3600);
  } else {
    dismissToast(toastId);
  }

  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();
}

/** Salvează intervalul local (pentru UI-ul imediat) ȘI pe employees.notif_lead_minutes
 * în Supabase, fiindcă funcția server-side care trimite push-urile citește de acolo,
 * nu din localStorage-ul acestui dispozitiv. */
async function setNotifLeadMinutes(minutes){
  localStorage.setItem(NOTIF_LEAD_KEY, String(minutes));
  if (!state.employee) return;
  try {

      .update({ notif_lead_minutes: minutes })

  } catch (e){
    showToast('Nu am putut salva intervalul pe server: ' + (e.message || e), 'error', { autoHide: 3000 });
  }
}

/** Convertește cheia publică VAPID (base64url) în Uint8Array, cum cere PushManager. */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

/** Abonează acest dispozitiv la Push API și salvează abonamentul în Supabase,
 * legat de angajata curentă, ca să-l poată folosi funcția server-side de trimitere. */
async function subscribeToPush(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if (!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY === 'PUNE_AICI_CHEIA_PUBLICA_VAPID'){
    showToast('Cheia VAPID nu e configurată încă — notificările vor funcționa doar cât timp fila e deschisă.', 'warning', { autoHide: 4000 });
    return;
  }
  if (!state.employee){ return; }
  try {
    const registration = await navigator.serviceWorker.ready;
    let subscription = await registration.pushManager.getSubscription();
    if (!subscription){
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    const json = subscription.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({
      employee_id: state.employee.id,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth,
      user_agent: navigator.userAgent,
    }, { onConflict: 'endpoint' });
    if (error) throw error;
  } catch (e){
    showToast('Nu am putut activa notificările în fundal: ' + (e.message || e), 'error', { autoHide: 3600 });
  }
}

/** Cere permisiunea browserului de a arăta notificări native și abonează
 * dispozitivul la Web Push, ca notificările să ajungă și cu aplicația închisă. */
async function enableNotifications(){
  if (!('Notification' in window)){
    showToast('Acest browser nu suportă notificări native.', 'error', { autoHide: 3000 });
    return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm === 'granted'){
      showToast('Notificările sunt activate pe acest dispozitiv.', 'success', { autoHide: 2000 });
      await subscribeToPush();
    } else {
      showToast('Notificările au fost refuzate — le poți activa din setările browserului.', 'warning', { autoHide: 3400 });
    }
  } catch (e){
    showToast('Eroare la activarea notificărilor: ' + (e.message || e), 'error', { autoHide: 3000 });
  }
  refreshNotifButtonLabel();

// Ținem minte care programări/sarcini au primit deja notificarea, ca să nu o
// repetăm la fiecare verificare din minutul respectiv.
const notifiedApptIds = new Set();
const notifiedTaskIds = new Set();

/** Rulează o dată pe minut: compară ora curentă cu ora programărilor și
 * sarcinilor de azi și, când timpul rămas ajunge la intervalul ales
 * (notifLeadTime), arată o notificare nativă a browserului. Funcționează
 * doar cât timp fila aplicației e deschisă (nu e o notificare push prin
 * server). */
function checkUpcomingAppointments(){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (!state.employee) return;
  const leadMin = getNotifLeadMinutes();
  const now = new Date();
  cache.appointments
    .filter(a => a.employeeId === state.employee.id && a.status !== 'cancelled' && isSameDay(a.startTime, now))
    .forEach(a => {
      const diffMin = Math.round((a.startTime.getTime() - now.getTime()) / 60000);
      // Toleranță de un minut, ca o mică întârziere a timer-ului să nu
      // sară exact peste momentul de anunțat.
      if (diffMin <= leadMin && diffMin >= leadMin - 1 && !notifiedApptIds.has(a.id)){
        notifiedApptIds.add(a.id);
        try {
          new Notification('Programare în curând!', {
            body: `${a.clientName || 'Clientă'} — ${a.serviceName || 'programare'} la ${fmtTime(a.startTime)}`,
            tag: `appt-${a.id}`,
          });
        } catch (e){ /* unele browsere mobile refuză Notification API în fundal — ignorăm */ }
      }
    });
  // Sarcini / alte activități (custom_tasks) — aceeași logică, comparăm cu
  // ora de ÎNCEPUT a sarcinii dacă începe azi.
  cache.customTasks
    .filter(t => t.employeeId === state.employee.id && isSameDay(t.start, now))
    .forEach(t => {
      const diffMin = Math.round((t.start.getTime() - now.getTime()) / 60000);
      if (diffMin <= leadMin && diffMin >= leadMin - 1 && !notifiedTaskIds.has(t.id)){
        notifiedTaskIds.add(t.id);
        try {
          new Notification('Sarcină în curând!', {
            body: `${t.title || 'Sarcină'} la ${fmtTime(t.start)}`,
            tag: `task-${t.id}`,
          });
        } catch (e){ /* unele browsere mobile refuză Notification API în fundal — ignorăm */ }
      }
    });
}

setInterval(checkUpcomingAppointments, 60000);

/** Citește scheduled_notifications pentru angajata curentă (join cu appointments,
 * clients, services) și randează un rezumat pending/sent/missed în Setări. */
async function loadNotificationStatusPanel(){
  const container = document.getElementById('notifStatusList');
  if (!container) return;
  if (!state.employee){ container.innerHTML = ''; return; }
  container.innerHTML = '<div class="settings-hint">Se încarcă...</div>';
  try {
    const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
    const { data, error } = await sb
      .from('scheduled_notifications')
      .select('id, status, scheduled_send_at, sent_at, appointments(start_time, clients(name), services(name))')
      .eq('employee_id', state.employee.id)
      .gte('scheduled_send_at', since)
      .order('scheduled_send_at', { ascending: true })
      .limit(30);
    if (error) throw error;

    if (!data || data.length === 0){
      container.innerHTML = '<div class="settings-hint">Nu există notificări programate în intervalul recent.</div>';
      return;
    }

    container.innerHTML = data.map((row) => {
      const appt = row.appointments;
      const label = NOTIF_STATUS_LABELS[row.status] || { text: row.status, color: 'var(--muted, #999)' };
      const clientName = appt && appt.clients ? appt.clients.name : 'Clientă';
      const serviceName = appt && appt.services ? appt.services.name : '';
      const apptTime = appt ? fmtTime(new Date(appt.start_time)) : '';
      const apptDate = appt ? fmtDateDDMMYYYY(new Date(appt.start_time)) : '';
      const sendAt = fmtTime(new Date(row.scheduled_send_at));
      return `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--border, #eee); border-radius:8px;">
          <div>
            <div style="font-weight:600;">${escapeHtml(clientName)} — ${escapeHtml(serviceName)}</div>
            <div class="settings-hint" style="margin:2px 0 0;">Programare: ${apptDate} ${apptTime} · Trimitere: ${sendAt}</div>
          </div>
          <span style="background:${label.color}; color:#fff; font-size:12px; padding:3px 9px; border-radius:999px; white-space:nowrap;">${label.text}</span>
        </div>
      `;
    }).join('');
  } catch (e){
    container.innerHTML = `<div class="settings-hint">Nu am putut încărca statusul: ${escapeHtml(e.message || String(e))}</div>`;
  }
}

/** Creează o clientă cu suport offline: dacă rețeaua nu răspunde, o salvează
 * local (coadă `pending_clients`) și o pune la dispoziție instant în UI. */
async function createClientSmart(name, phone){
  if (navigator.onLine){
    try {
      const client = await addClient({ name, phone });
      // Adăugăm clienta nou-creată în lista globală imediat, ca să fie
      // disponibilă instant în orice picker/căutare din aplicație.
      state.clients.push(client);
      state.clients.sort((a, b) => a.name.localeCompare(b.name));
      return { ok: true, offline: false, client };
    } catch (e){
      if (!isNetworkError(e)) throw e;
    }
  }
  const item = queueOfflineClient({ name, phone });
  const localClient = { id: item.id, name, phone, pendingOffline: true };
  state.clients.push(localClient);
  state.clients.sort((a, b) => a.name.localeCompare(b.name));
  return { ok: true, offline: true, client: localClient };
}

/** Adaugă un memento suplimentar (push) pentru o programare anume, pe lângă
 * cel automat calculat din intervalul implicit al angajatei.
 * Folosește upsert cu ignoreDuplicates pe indexul unic (appointment_id,
 * scheduled_send_at) — dacă există deja un memento EXACT la aceeași oră
 * (fie cel automat, fie unul personalizat anterior), nu mai inserează un
 * al doilea rând (asta ar da eroare de "duplicate key") și nici nu-l
 * modifică pe cel existent; doar anunțăm frumos utilizatorul. */
async function createCustomReminder({ appointmentId, employeeId, scheduledSendAt }){
  const { data: existing, error: checkErr } = await sb.from('scheduled_notifications')
    .select('id')
    .eq('appointment_id', appointmentId)
    .eq('scheduled_send_at', scheduledSendAt.toISOString())
    .maybeSingle();
  if (checkErr) throw checkErr;
  if (existing){
    const err = new Error('Există deja un memento programat exact la această oră.');
    err.code = 'ALREADY_SCHEDULED';
    throw err;
  }

  const { error } = await sb.from('scheduled_notifications').upsert({
    appointment_id: appointmentId,
    employee_id: employeeId,
    scheduled_send_at: scheduledSendAt.toISOString(),
    status: 'pending',
    source: 'custom',
  }, { onConflict: 'appointment_id,scheduled_send_at', ignoreDuplicates: true });
  if (error) throw error;
}

    getClients(),
    getServices(),
    getActiveReminderApptIds(state.employee.id),
  ]);
  cache.appointments = appts;
  cache.jobBlocks = blocks;
  cache.customTasks = tasks;
  cache.vacations = vacRes.list;
  cache.reminderApptIds = reminderIds;
  state.vacationsMissingTable = vacRes.missingTable;
  cache.rangeFrom = from;
  cache.rangeTo = to;
  state.clients = clients;
  state.services = services;
}

/** Extinde cache-ul dacă intervalul cerut depășește ce avem deja local. */
async function ensureRangeCached(from, to){
  if (!state.employee) return;
  if (cacheRangeCovers(from, to)) return;
  const newFrom = cache.rangeFrom ? new Date(Math.min(from.getTime(), cache.rangeFrom.getTime())) : from;
  const newTo = cache.rangeTo ? new Date(Math.max(to.getTime(), cache.rangeTo.getTime())) : to;
  const { appts, blocks, tasks } = await loadApptsAndBlocksRange(newFrom, newTo);
  cache.appointments = appts;
  cache.jobBlocks = blocks;
  cache.customTasks = tasks;
  cache.rangeFrom = newFrom;
  cache.rangeTo = newTo;
}

/** Re-descarcă de la zero intervalul deja cunoscut — folosit după reconectare, ca să reconciliem programările sincronizate offline. */
async function forceRefreshCache(){
  if (!state.employee || !cache.rangeFrom || !cache.rangeTo) return;
  try {
    const [{ appts, blocks, tasks }, reminderIds] = await Promise.all([
      loadApptsAndBlocksRange(cache.rangeFrom, cache.rangeTo),
      getActiveReminderApptIds(state.employee.id),
    ]);
    cache.appointments = appts;
    cache.jobBlocks = blocks;
    cache.customTasks = tasks;
    cache.reminderApptIds = reminderIds;
  } catch (e){ /* offline — păstrăm ce avem local */ }
}

/** Adaugă în cache programările salvate offline (din localStorage) care nu s-au sincronizat încă. */
function mergePendingIntoCache(){
  state.pendingAppointments.forEach(item => {
    if (cache.appointments.some(a => a.id === item.id)) return;
    cache.appointments.push(pendingApptToDisplay(item));
  });
}

/** Verifică suprapuneri (blocuri, alte programări, în afara programului zilei) direct din cache — 0ms. */
function findConflictInCache({ employeeId, day, start, end, excludeApptId }){
  const blocks = cache.jobBlocks.filter(b => b.employeeId === employeeId && isSameDay(b.start, day));
  for (const b of blocks){ if (start < b.end && end > b.start) return { start: b.start, end: b.end, type: 'block' }; }
  const appts = cache.appointments.filter(a => a.employeeId === employeeId && a.status !== 'cancelled' && a.id !== excludeApptId && isSameDay(a.startTime, day));
  for (const a of appts){ if (start < a.endTime && end > a.startTime) return { start: a.startTime, end: a.endTime, type: 'appt', clientName: a.clientName }; }
  const { startMin, endMin } = dayHoursFor(day);
  const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate()); dayStart.setMinutes(startMin);
  const dayEnd = new Date(day.getFullYear(), day.getMonth(), day.getDate()); dayEnd.setMinutes(endMin);
  if (start < dayStart || end > dayEnd) return { start: dayStart, end: dayEnd, type: 'hours' };
  return null;
}

/** Calculează sloturile libere dintr-o zi, direct din cache (0ms în cazul
 * normal — ziua e deja în intervalul cache-uit la bootstrap). Orele posibile
 * (Setări → interval pe ziua respectivă) minus blocurile de la celălalt job
 * minus programările deja confirmate. `excludeApptId` scoate din calcul o
 * programare anume — folosit la editare, ca propriul interval să nu se
 * blocheze singur. */
async function getFreeSlots({ employeeId, day, serviceDurationMinutes, slotStepMinutes = 15, excludeApptId = null }){
  const rangeCheckStart = new Date(day.getFullYear(), day.getMonth(), day.getDate());
  const rangeCheckEnd = new Date(rangeCheckStart); rangeCheckEnd.setDate(rangeCheckEnd.getDate() + 1);
  if (!cacheRangeCovers(rangeCheckStart, rangeCheckEnd)){
    try { await ensureRangeCached(rangeCheckStart, rangeCheckEnd); } catch (e){ /* rămânem cu ce avem local */ }
  }

  const { startMin, endMin } = dayHoursFor(day);
  const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate());
  dayStart.setMinutes(startMin);
  const dayEnd = new Date(day.getFullYear(), day.getMonth(), day.getDate());
  dayEnd.setMinutes(endMin);

  const busy = [
    ...cache.jobBlocks.filter(b => b.employeeId === employeeId && isSameDay(b.start, day)).map(b => ({ start: b.start, end: b.end })),
    ...cache.appointments.filter(a => a.employeeId === employeeId && a.status !== 'cancelled' && a.id !== excludeApptId && isSameDay(a.startTime, day)).map(a => ({ start: a.startTime, end: a.endTime })),
  ].sort((a, b) => a.start - b.start);

  const free = [];
  const addSlotsInRange = (rangeStart, rangeEnd) => {
    let slotStart = new Date(rangeStart);
    while (true){
      const slotEnd = new Date(slotStart.getTime() + serviceDurationMinutes * 60000);
      if (slotEnd > rangeEnd) break;
      free.push({ start: new Date(slotStart), end: slotEnd });
      slotStart = new Date(slotStart.getTime() + slotStepMinutes * 60000);
    }
  };

  let cursor = dayStart;
  for (const b of busy){
    if (b.start > cursor) addSlotsInRange(cursor, b.start);
    if (b.end > cursor) cursor = b.end;
  }
  if (dayEnd > cursor) addSlotsInRange(cursor, dayEnd);
  return free;
}

/** Click scurt pe „+” → programare nouă (ca până acum).
 * Apăsare lungă (~500ms, touch sau mouse) → modal „Sarcină nouă”.
 * Un singur handler de click decide comportamentul, ca să nu depindem
 * de ordinea/propagarea altor listenere ale aceluiași buton. */
function wireAddButtonInteractions(btn){
  const LONG_PRESS_MS = 500;
  let pressTimer = null;
  let longPressFired = false;

  const startPress = () => {
    longPressFired = false;
    pressTimer = setTimeout(() => {
      longPressFired = true;
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e){} }
      openNewTaskModal();
    }, LONG_PRESS_MS);
  };
  const cancelPress = () => {
    if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  };

  btn.addEventListener('touchstart', startPress, { passive: true });
  btn.addEventListener('touchend', cancelPress);
  btn.addEventListener('touchcancel', cancelPress);
  btn.addEventListener('touchmove', cancelPress);
  btn.addEventListener('mousedown', startPress);
  btn.addEventListener('mouseup', cancelPress);
  btn.addEventListener('mouseleave', cancelPress);

  btn.addEventListener('click', (e) => {
    if (longPressFired){
      e.preventDefault();
      e.stopImmediatePropagation();
      longPressFired = false;
      return;
    }
    openAddModal();
  });
}

 * copil), așa că verificarea de mai jos vizează exclusiv backdrop-ul. */
function wireDialogBackdropClose(dialog){

  dialog.dataset.backdropWired = '1';
  dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });
}

/** Înlocuiește window.confirm() cu un <dialog> stilizat, integrat în design.
 * Returnează o Promise<boolean> — true dacă utilizatorul a apăsat confirmarea.
 * Ex: if (!(await confirmDialog({ message: 'Ștergi X?' }))) return; */
function confirmDialog({ title = 'Confirmare', message = '', confirmLabel = 'Șterge', cancelLabel = 'Anulează', danger = true } = {}){
  ensureConfirmDialog();
  const dlg = document.getElementById('confirmDialog');
  document.getElementById('confirmDialogTitle').textContent = title;
  document.getElementById('confirmDialogMessage').textContent = message;
  const confirmBtn = document.getElementById('confirmDialogConfirm');
  const cancelBtn = document.getElementById('confirmDialogCancel');
  confirmBtn.textContent = confirmLabel;
  cancelBtn.textContent = cancelLabel;
  confirmBtn.className = danger ? 'btn-danger' : 'btn-primary';

  return new Promise((resolve) => {
    const cleanup = (result) => {
      confirmBtn.removeEventListener('click', onConfirm);
      cancelBtn.removeEventListener('click', onCancel);
      dlg.removeEventListener('cancel', onCancel);
      dlg.close();
      resolve(result);
    };
    const onConfirm = () => cleanup(true);
    const onCancel = () => cleanup(false);
    confirmBtn.addEventListener('click', onConfirm);
    cancelBtn.addEventListener('click', onCancel);
    dlg.addEventListener('cancel', onCancel); // tasta Esc
    dlg.showModal();
  });
}

/** Swipe stânga/dreapta pe grila calendarului → schimbă luna, ca pe mobil.
 * Pragul de 50px evită declanșarea accidentală la un simplu tap sau scroll. */
function wireCalendarSwipe(){
  const grid = document.getElementById('calGrid');
  if (!grid || grid.dataset.swipeWired) return;
  grid.dataset.swipeWired = '1';
  const SWIPE_THRESHOLD = 50;
  let touchStartX = 0;
  let touchStartY = 0;

  grid.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });

  grid.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].clientX;
    const touchEndY = e.changedTouches[0].clientY;
    const deltaX = touchEndX - touchStartX;
    const deltaY = touchEndY - touchStartY;
    // ignorăm swipe-urile predominant verticale (scroll din greșeală)
    if (Math.abs(deltaX) < SWIPE_THRESHOLD || Math.abs(deltaX) < Math.abs(deltaY)) return;
    if (deltaX < -SWIPE_THRESHOLD) changeMonth(1);
    else if (deltaX > SWIPE_THRESHOLD) changeMonth(-1);
  }, { passive: true });
}

/** Schimbă ziua selectată cu `delta` zile (±1), sincronizând și luna
 * calendarului dacă noua zi cade în altă lună. */

  d.setDate(d.getDate() + delta);
  const monthChanged = !state.calendarMonth || d.getFullYear() !== state.calendarMonth.getFullYear() || d.getMonth() !== state.calendarMonth.getMonth();
  if (monthChanged){
    state.calendarMonth = new Date(d.getFullYear(), d.getMonth(), 1);

}

/** Swipe stânga/dreapta pe agenda zilei → zi următoare/anterioară.

  el.addEventListener('touchstart', (e) => {

    touchStartY = e.changedTouches[0].clientY;

}
