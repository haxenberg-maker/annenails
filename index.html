/* ====================== MINI CALENDAR ====================== */
function renderCalendar(){
  const monthLabelEl = document.getElementById('calMonthLabel');
  const grid = document.getElementById('calGrid');
  if (!monthLabelEl || !grid) return; // ecranul calendarului nu e montat acum (ex: suntem în Setări)
  monthLabelEl.textContent = fmtMonthHeader(state.calendarMonth);
  const y = state.calendarMonth.getFullYear();
  const m = state.calendarMonth.getMonth();
  const firstWeekday = (new Date(y, m, 1).getDay() + 6) % 7;
  const totalDays = new Date(y, m + 1, 0).getDate();
  const today = new Date();

  let html = '';
  for (let i = 0; i < firstWeekday; i++) html += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= totalDays; day++){
    const d = new Date(y, m, day);
    const key = ymd(d);
    const vacColor = state.vacationDaysInMonth.get(key);
    const cls = ['cal-cell', isSameDay(d, state.selectedDay) ? 'selected' : '', isSameDay(d, today) ? 'today' : '', vacColor ? 'vacation' : ''].join(' ').trim();
    const colors = state.monthDayColors.get(key) || [];
    const dots = colors.slice(0, 6).map(c => `<span class="day-dot" style="background:${c}"></span>`).join('');
    const tintStyle = vacColor ? ` style="--vac-tint:${hexToRgba(vacColor, 0.22)}"` : '';
    html += `<button type="button" class="${cls}" data-date="${key}"${tintStyle}>
      <span class="cal-daynum">${day}</span>
      ${dots ? `<span class="dots-container">${dots}</span>` : ''}
    </button>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-cell[data-date]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [yy, mm, dd] = btn.dataset.date.split('-').map(Number);
      setDay(new Date(yy, mm - 1, dd));
    });
  });
}

/** Recalculează culorile/bulinele lunii curente direct din cache — 0ms. */
function computeMonthDayColorsFromCache(){
  const map = new Map();
  const vacDays = new Map();
  const push = (key, color) => { const l = map.get(key) || []; l.push(color); map.set(key, l); };
  if (state.employee){
    const y = state.calendarMonth.getFullYear();
    const m = state.calendarMonth.getMonth();
    cache.appointments
      .filter(a => a.employeeId === state.employee.id && a.status !== 'cancelled' && a.startTime.getFullYear() === y && a.startTime.getMonth() === m)
      .forEach(a => push(ymd(a.startTime), a.serviceColor));
    cache.jobBlocks
      .filter(b => b.employeeId === state.employee.id && b.start.getFullYear() === y && b.start.getMonth() === m)
      .forEach(b => push(ymd(b.start), 'var(--job-block-dot)'));
    const monthStart = new Date(y, m, 1);
    const monthEnd = new Date(y, m + 1, 0);
    // Sarcinile custom pot acoperi mai multe zile — punem bulina lor pe fiecare
    // zi din interval care cade în luna afișată.
    cache.customTasks.filter(t => t.employeeId === state.employee.id).forEach(t => {
      const cur = new Date(Math.max(t.start.getTime(), monthStart.getTime()));
      const end = new Date(Math.min(t.end.getTime(), monthEnd.getTime()));
      while (cur <= end){
        push(ymd(cur), t.color || DEFAULT_TASK_COLOR);
        cur.setDate(cur.getDate() + 1);
      }
    });
    cache.vacations.filter(v => v.employeeId === state.employee.id).forEach(v => {
      const cur = new Date(Math.max(v.start.getTime(), monthStart.getTime()));
      const end = new Date(Math.min(v.end.getTime(), monthEnd.getTime()));
      while (cur <= end){
        const key = ymd(cur);
        vacDays.set(key, v.color || '#B3A29B');
        push(key, v.color || '#B3A29B');
        cur.setDate(cur.getDate() + 1);
      }
    });
  }
  state.monthDayColors = map;
  state.vacationDaysInMonth = vacDays;
}

/** Se asigură că luna cerută e cache-uită, apoi randează instant. Face o
 * cerere de rețea DOAR dacă luna e în afara intervalului deja descărcat. */
async function loadMonthDots(){
  if (state.employee){
    const y = state.calendarMonth.getFullYear();
    const m = state.calendarMonth.getMonth();
    const from = new Date(y, m, 1);
    const to = new Date(y, m + 1, 0, 23, 59, 59, 999);
    if (!cacheRangeCovers(from, to)){
      try { await ensureRangeCached(from, to); } catch (e){ /* offline — folosim ce avem local */ }
    }
  }
  computeMonthDayColorsFromCache();
  renderCalendar();
}

/* ====================== RENDER: DAY AGENDA ====================== */
/** Filtrează ziua selectată direct din cache și randează instant, fără spinner
 * și fără nicio cerere de rețea — cu excepția rarului caz în care ziua cade
 * în afara ferestrei de 3 luni deja cache-uite. */
async function loadDay(){
  const content = document.getElementById('dayContent');
  if (!state.employee){
    content.innerHTML = `<div class="day-state">Nu există nicio angajată configurată în Supabase.</div>`;
    return;
  }
  const dayStart = new Date(state.selectedDay.getFullYear(), state.selectedDay.getMonth(), state.selectedDay.getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  if (!cacheRangeCovers(dayStart, dayEnd)){
    content.innerHTML = `<div class="spinner"></div>`;
    try { await ensureRangeCached(dayStart, dayEnd); }
    catch (e){
      if (!isNetworkError(e)) { content.innerHTML = `<div class="day-state">Eroare la încărcare: ${escapeHtml(e.message || String(e))}</div>`; return; }
      showToast('Fără conexiune — se afișează doar datele salvate local.', 'warning', { autoHide: 3200 });
    }
  }
  renderDayFromCache();
}

/** Randare sincronă (0ms) a agendei zilei selectate, din cache. */
function renderDayFromCache(){
  if (!state.employee) return;
  const vac = findVacationForDay(state.selectedDay);
  const selKey = ymd(state.selectedDay);
  const appts = cache.appointments.filter(a => a.employeeId === state.employee.id && isSameDay(a.startTime, state.selectedDay));
  const blocks = cache.jobBlocks.filter(b => b.employeeId === state.employee.id && isSameDay(b.start, state.selectedDay));
  // Sarcinile pot acoperi mai multe zile — le afișăm în fiecare zi din intervalul lor.
  const tasks = cache.customTasks.filter(t => t.employeeId === state.employee.id && ymd(t.start) <= selKey && ymd(t.end) >= selKey);
  state.appointments = appts;
  state.dayJobBlocks = blocks;
  state.dayCustomTasks = tasks;
  renderAppointmentList(vac);
  renderAgendaTotal(appts);
}

/** Suma totală ÎNCASATĂ (nu estimată) în ziua afișată — doar programările
 * finalizate contează, la fel ca la calculul din Statistici. */
function renderAgendaTotal(appts){
  const el = document.getElementById('agendaTotal');
  if (!el) return;
  const completed = appts.filter(a => a.status === 'completed');
  if (completed.length === 0){ el.textContent = ''; return; }
  const total = completed.reduce((sum, a) => sum + (a.paidAmount != null ? a.paidAmount : a.servicePrice), 0);
  const label = isSameDay(state.selectedDay, new Date()) ? 'Total încasat azi' : `Total încasat (${fmtDateShort(state.selectedDay)})`;
  el.textContent = `${label}: ${total.toLocaleString('ro-RO')} lei`;
}

/** Un element (programare/bloc de job/sarcină) e considerat „trecut” dacă
 * momentul lui de sfârșit a trecut deja de ora curentă — primește clasa
 * CSS .past-item, indiferent de ce zi se vizualizează. */
function isPastItem(endTime){
  return endTime.getTime() < Date.now();
}

function buildDayItems(){
  return [
    ...state.appointments.map(a => ({ type: 'appt', start: a.startTime, end: a.endTime, data: a })),
    ...state.dayJobBlocks.map(b => ({ type: 'block', start: b.start, end: b.end, data: b })),
    ...(state.dayCustomTasks || []).map(t => ({ type: 'task', start: t.start, end: t.end, data: t })),
  ].sort((a, b) => a.start - b.start);
}

function renderAppointmentList(vac){
  const content = document.getElementById('dayContent');
  if (!content) return; // ecranul agendei nu e montat acum (ex: suntem în Setări)
  const items = buildDayItems();

  const vacationCardHtml = vac ? `
    <div class="vacation-card">
      <div class="vacation-card-icon">🏖️</div>
      <div>
        <div class="vacation-card-title">CONCEDIU</div>
        <div class="vacation-card-desc">${escapeHtml(vac.description || 'Zi liberă')}</div>
      </div>
    </div>
  ` : '';

  if (items.length === 0){
    content.innerHTML = vacationCardHtml + `<div class="day-state">${vac ? 'Nicio programare — zi de concediu.' : 'Nicio programare în această zi.<br/>Apasă „Programare nouă” ca să adaugi una.'}</div>`;
    return;
  }

  content.innerHTML = vacationCardHtml + items.map((item, idx) => {
    const past = isPastItem(item.end);
    if (item.type === 'block'){
      const b = item.data;
      return `
        <div class="block-card ${past ? 'past-item' : ''}">
          <div class="block-time">${fmtTime(b.start)}<small>${fmtTime(b.end)}</small></div>
          <div class="block-body">
            <div class="block-label">${escapeHtml(b.label)}</div>
            <div class="block-sub">Ocupată — administrează din Setări → Programul de la celălalt job</div>
          </div>
        </div>
      `;
    }
    if (item.type === 'task'){
      const t = item.data;
      const isMultiDay = ymd(t.start) !== ymd(t.end);
      const onStartDay = isSameDay(t.start, state.selectedDay);
      const onEndDay = isSameDay(t.end, state.selectedDay);
      let timeTop, timeBottom;
      if (!isMultiDay){
        timeTop = fmtTime(t.start); timeBottom = fmtTime(t.end);
      } else if (onStartDay){
        timeTop = fmtTime(t.start); timeBottom = 'continuă';
      } else if (onEndDay){
        timeTop = 'până la'; timeBottom = fmtTime(t.end);
      } else {
        timeTop = 'toată'; timeBottom = 'ziua';
      }
      const taskColor = t.color || '#8B5CF6';
      return `
        <div class="task-card ${past ? 'past-item' : ''}" style="border-left-color:${taskColor}">
          <div class="task-time">${timeTop}<small>${timeBottom}</small></div>
          <div class="task-body">
            <div class="task-title"><span class="task-color-dot" style="background:${taskColor}"></span>${escapeHtml(t.title)}</div>
            <div class="task-sub">${isMultiDay ? `Sarcină pe mai multe zile (${fmtDateShort(t.start)} – ${fmtDateShort(t.end)})` : 'Sarcină / altă activitate'}</div>
          </div>
          <div class="task-actions">
            <button class="reminder-btn task-edit-btn" data-task-edit-id="${t.id}" title="Editează sarcina">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="appt-cancel" data-task-id="${t.id}" title="Șterge sarcina">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
      `;
    }
    const a = item.data;
    const cancelled = a.status === 'cancelled';
    const completed = a.status === 'completed';
    const unconfirmed = a.status === 'unconfirmed';
    // Culoarea serviciului se aplică EXCLUSIV pentru programări confirmate/finalizate;
    // cele neconfirmate sunt semnalate cu roșu, indiferent de serviciu, ca să se
    // diferențieze clar la o primă vedere.
    const color = cancelled ? 'var(--muted)' : unconfirmed ? 'var(--danger)' : a.serviceColor;
    const amount = a.paidAmount != null ? a.paidAmount : a.servicePrice;
    const amountHtml = (!cancelled && amount != null)
      ? `<span class="appt-amount ${completed ? 'paid' : 'estimated'}">${amount.toLocaleString('ro-RO')} lei${completed ? '' : ' (estimat)'}</span>`
      : '';
    return `
      <div class="appt-card ${cancelled ? 'cancelled' : ''} ${past ? 'past-item' : ''}" style="border-left-color:${color}" data-appt-idx="${idx}" data-pending="${a.pendingOffline ? '1' : '0'}">
        <div class="appt-card-top">
          <div class="appt-time">${fmtTime(a.startTime)}<small>${fmtTime(a.endTime)}</small></div>
          <div class="appt-body">
            <div class="appt-client">${escapeHtml(a.clientName || 'Client')}</div>
            <div class="appt-service"><span class="swatch" style="background:${color}"></span>${escapeHtml(a.serviceName || '')}</div>
            ${cancelled ? `<span class="appt-tag">Anulată</span>` : ''}
            ${completed ? `<span class="appt-tag" style="background:var(--success)">Finalizată</span>` : ''}
            ${unconfirmed ? `<span class="appt-tag" style="background:var(--danger)">Neconfirmată</span>` : ''}
            ${a.pendingOffline ? `<span class="appt-tag pending-tag">Offline — în așteptare</span>` : ''}
            ${amountHtml}
          </div>
        </div>
        ${(!cancelled && !a.pendingOffline) ? `
        <div class="appt-actions-bar">
          ${reminderActionsHtml(a)}
          <button class="reminder-btn push-reminder-btn ${cache.reminderApptIds.has(a.id) ? 'has-reminder' : ''}" data-push-reminder-id="${a.id}" title="${cache.reminderApptIds.has(a.id) ? 'Are un memento activ — adaugă altul' : 'Adaugă memento personalizat'}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14.5"/></svg>
          </button>
          <button class="appt-cancel" data-id="${a.id}" title="Anulează programarea">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>` : ''}
      </div>
    `;
  }).join('');

  // click pe card -> editare (exceptând blocurile, sarcinile și programările încă nesincronizate)
  content.querySelectorAll('.appt-card').forEach(card => {
    card.addEventListener('click', (ev) => {
      if (ev.target.closest('.appt-cancel')) return;
      if (ev.target.closest('.reminder-actions')) return;
      if (card.dataset.pending === '1') { showToast('Se poate edita după ce se sincronizează.', 'info', { autoHide: 2000 }); return; }
      const idx = Number(card.dataset.apptIdx);
      const target = buildDayItems()[idx];
      if (target && target.type === 'appt') openEditModal(target.data);
    });
  });

  content.querySelectorAll('.appt-cancel[data-id]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      cancelAppointmentOptimistic(btn.dataset.id);
    });
  });

  content.querySelectorAll('.appt-cancel[data-task-id]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      deleteCustomTaskOptimistic(btn.dataset.taskId);
    });
  });

  content.querySelectorAll('.task-edit-btn[data-task-edit-id]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const task = cache.customTasks.find(t => t.id === btn.dataset.taskEditId);
      if (task) openNewTaskModal(task);
    });
  });

  content.querySelectorAll('.push-reminder-btn[data-push-reminder-id]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const appt = state.appointments.find(a => a.id === btn.dataset.pushReminderId);
      if (appt) openPushReminderModal(appt);
    });
  });

  wireReminderCopyButtons(content);

  // Blocurile de la celălalt job se șterg doar din Setări (nu din agendă).
}

/** Șterge o sarcină custom cu actualizare optimistă a UI-ului. */
async function deleteCustomTaskOptimistic(id){
  if (!(await confirmDialog({ title: 'Ștergi sarcina?', message: 'Această acțiune nu poate fi anulată.', confirmLabel: 'Șterge' }))) return;
  const idx = cache.customTasks.findIndex(t => t.id === id);
  const previous = idx >= 0 ? cache.customTasks[idx] : null;
  if (idx >= 0) cache.customTasks.splice(idx, 1);
  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();
  try {
    await deleteCustomTask(id);
  } catch (e){
    if (previous) cache.customTasks.splice(idx, 0, previous);
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
    showToast('Eroare la ștergerea sarcinii: ' + (e.message || e), 'error', { autoHide: 3000 });
  }
}

/** Anulare optimistă: actualizează cache-ul + UI-ul instant (0ms), apoi
 * trimite cererea către Supabase în fundal. La eroare, revine la starea
 * anterioară și anunță utilizatorul. */
async function cancelAppointmentOptimistic(id){
  if (!(await confirmDialog({ title: 'Anulezi programarea?', message: 'Clienta nu va mai apărea în agendă la ora respectivă.', confirmLabel: 'Anulează programarea', cancelLabel: 'Renunță' }))) return false;
  const idx = cache.appointments.findIndex(a => a.id === id);
  const previous = idx >= 0 ? { ...cache.appointments[idx] } : null;
  if (idx >= 0) cache.appointments[idx] = { ...cache.appointments[idx], status: 'cancelled' };
  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();

  const toastId = showToast('Se anulează…', 'saving', { persist: true });
  try {
    await cancelAppointment(id);
    updateToast(toastId, 'Programare anulată.', 'success', 1800);
    refreshUnconfirmedBadge();
  } catch (e){
    if (idx >= 0 && previous) cache.appointments[idx] = previous;
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
    updateToast(toastId, 'Eroare la anulare — s-a revenit la starea anterioară: ' + (e.message || e), 'error', 3600);
  }
  return true;
}

/** Șterge DEFINITIV o programare din baza de date (nu doar o marchează
 * anulată) — cache-ul + UI-ul se actualizează instant, apoi cererea se
 * trimite în fundal către Supabase. La eroare, readuce programarea în cache. */
async function deleteAppointmentOptimistic(id){
  if (!(await confirmDialog({
    title: 'Ștergi definitiv programarea?',
    message: 'Această acțiune nu poate fi anulată — programarea va fi eliminată complet, nu doar marcată ca anulată.',
    confirmLabel: 'Șterge programarea', cancelLabel: 'Renunță',
  }))) return false;
  const idx = cache.appointments.findIndex(a => a.id === id);
  const removed = idx >= 0 ? cache.appointments[idx] : null;
  if (idx >= 0) cache.appointments.splice(idx, 1);
  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();

  const toastId = showToast('Se șterge…', 'saving', { persist: true });
  try {
    await deleteAppointmentRow(id);
    updateToast(toastId, 'Programare ștearsă definitiv.', 'success', 1800);
    refreshUnconfirmedBadge();
  } catch (e){
    if (removed) cache.appointments.push(removed);
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
    updateToast(toastId, 'Eroare la ștergere — programarea a fost readusă: ' + (e.message || e), 'error', 3600);
  }
  return true;
}

/* ====================== CLIENT PICKER (reutilizat în Add & Edit) ====================== */
const pickerHandlers = {};

function clientPickerHtml(prefix){
  return `
    <div class="field">
      <label>Clientă</label>
      <div class="client-selected hidden" id="${prefix}ClientSelected"></div>
      <div id="${prefix}ClientSearchWrap">
        <input type="text" class="client-search-input" id="${prefix}ClientSearch" placeholder="Caută după nume sau telefon…" />
        <div class="client-list" id="${prefix}ClientList"></div>
      </div>

    <button class="link-btn" id="${prefix}ToggleNewClient">+ Clientă nouă</button>

      <div class="field"><label>Telefon</label><input id="${prefix}NewClientPhone" type="tel" /></div>

}

function renderClientList(prefix, query, onSelect, opts){
  opts = opts || {};

  const filtered = !q ? state.clients : state.clients.filter(c => c.name.toLowerCase().includes(q) || (c.phone || '').includes(q));
  if (filtered.length === 0){
    listEl.innerHTML = `<div class="client-empty">Nicio clientă găsită.</div>`;
    return;
  }
  listEl.innerHTML = filtered.slice(0, 30).map(c => `
    <div class="client-row" data-id="${c.id}" tabindex="0" role="button">
      <span class="client-avatar">${escapeHtml(initials(c.name))}</span>
      <span class="client-row-info">
        <span class="client-row-name">${escapeHtml(c.name)}${c.pendingOffline ? '<em>offline</em>' : ''}</span>
        ${c.phone ? `<span class="client-row-phone">${escapeHtml(c.phone)}</span>` : ''}
      </span>
      ${opts.showActions ? `
        <span class="client-row-actions">
          <button type="button" class="icon-btn-sm client-row-edit" data-id="${c.id}" title="Editează clienta">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button type="button" class="icon-btn-sm client-row-delete" data-id="${c.id}" title="Șterge clienta">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>

      ` : ''}

  `).join('');

    row.addEventListener('click', (ev) => {
      if (ev.target.closest('.client-row-actions')) return;
      const client = state.clients.find(c => c.id === row.dataset.id);
      onSelect(client);
    });
  });
  if (opts.showActions){
    listEl.querySelectorAll('.client-row-edit').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const client = state.clients.find(c => c.id === btn.dataset.id);
        if (client) openEditClientModal(client);
      });
    });
    listEl.querySelectorAll('.client-row-delete').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        deleteClientWithConfirm(btn.dataset.id);
      });

function showSelectedClient(prefix, client, onChangeClick){
  const selEl = document.getElementById(`${prefix}ClientSelected`);
  const searchWrap = document.getElementById(`${prefix}ClientSearchWrap`);
  const toggleNewBtn = document.getElementById(`${prefix}ToggleNewClient`);
  if (!selEl || !searchWrap) return;
  if (!client){
    selEl.classList.add('hidden');
    searchWrap.classList.remove('hidden');
    if (toggleNewBtn) toggleNewBtn.classList.remove('hidden');
    return;
  }
  selEl.classList.remove('hidden');
  searchWrap.classList.add('hidden');
  // „+ Clientă nouă” are sens doar cât nu e nicio clientă aleasă.
  if (toggleNewBtn) toggleNewBtn.classList.add('hidden');
  selEl.innerHTML = `
    <span class="client-avatar">${escapeHtml(initials(client.name))}</span>
    <span class="client-row-info">
      <span class="client-row-name">${escapeHtml(client.name)}${client.pendingOffline ? '<em>offline</em>' : ''}</span>
      ${client.phone ? `<span class="client-row-phone">${escapeHtml(client.phone)}</span>` : ''}
    </span>
    <button type="button" class="btn-outline client-change-btn">Schimbă</button>
  `;
  selEl.querySelector('.client-change-btn').addEventListener('click', onChangeClick);
}

/** opts: { get: ()=>client|null, set: (client)=>void, onChange: ()=>void } */
function wireClientPicker(prefix, opts){
  const searchInput = document.getElementById(`${prefix}ClientSearch`);
  function selectHandler(client){
    opts.set(client);
    showSelectedClient(prefix, client, () => {
      opts.set(null);
      showSelectedClient(prefix, null);
      searchInput.value = '';
      renderClientList(prefix, '', selectHandler);
      searchInput.focus();
    });
    opts.onChange();
  }
  pickerHandlers[prefix] = selectHandler;
  searchInput.addEventListener('input', () => renderClientList(prefix, searchInput.value, selectHandler));
  renderClientList(prefix, '', selectHandler);

  const current = opts.get();
  if (current) showSelectedClient(prefix, current, () => {
    opts.set(null); showSelectedClient(prefix, null); searchInput.value = ''; renderClientList(prefix, '', selectHandler);
  });
  else showSelectedClient(prefix, null);
}

function resetClientPickerUI(prefix){

  catch (e){ list.innerHTML = `<p class="error-text">Eroare la încărcarea concediilor: ${escapeHtml(e.message || e)}</p>`; return; }
  state.vacationsMissingTable = res.missingTable;
  note.innerHTML = res.missingTable ? `
    <div class="setup-note">
      Tabelul pentru concedii nu există încă în Supabase. Rulează o singură dată acest SQL în
      <strong>Supabase → SQL Editor</strong>, apoi revino aici.
      <pre>${escapeHtml(VACATIONS_SETUP_SQL)}</pre>
      <button class="btn-outline" id="copyVacSqlBtn" type="button">Copiază SQL</button>
    </div>
  ` : '';
  saveBtn.disabled = res.missingTable;
  if (res.missingTable){
    document.getElementById('copyVacSqlBtn').addEventListener('click', async (e) => {
      try { await navigator.clipboard.writeText(VACATIONS_SETUP_SQL); e.target.textContent = 'Copiat!'; setTimeout(() => { e.target.textContent = 'Copiază SQL'; }, 1800); }
      catch (err){ showToast('Nu am putut copia automat — selectează manual textul de mai sus.', 'error', { autoHide: 3200 }); }
    });
  }
  cache.vacations = res.list;
  renderVacationsList();
}

function renderVacationsList(){
  const list = document.getElementById('vacationsList');
  if (!list) return;
  if (cache.vacations.length === 0){ list.innerHTML = `<p class="settings-hint" style="margin:0;">Niciun concediu adăugat încă.</p>`; return; }
  const sorted = [...cache.vacations].sort((a, b) => b.start - a.start);
  list.innerHTML = sorted.map(v => `
    <div class="history-row">
      <span class="history-date">${fmtDateShort(v.start)} – ${fmtDateShort(v.end)}</span>
      <span class="history-mid"><span style="width:9px;height:9px;border-radius:50%;display:inline-block;background:${v.color};flex:none;"></span>${escapeHtml(v.description || 'Zi liberă')}</span>
      <button type="button" class="appt-cancel" data-id="${v.id}" title="Șterge concediul" style="width:28px;height:28px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  `).join('');
  list.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!(await confirmDialog({ title: 'Ștergi concediul?', message: 'Ziua va redeveni disponibilă pentru programări.', confirmLabel: 'Șterge' }))) return;
      const id = btn.dataset.id;
      const prevList = [...cache.vacations];
      cache.vacations = cache.vacations.filter(v => v.id !== id);
      renderVacationsList();
      computeMonthDayColorsFromCache(); renderCalendar();
      renderDayFromCache();
      try {
        await deleteVacation(id);
        showToast('Concediu șters.', 'success', { autoHide: 1800 });
      } catch (e){
        cache.vacations = prevList;
        renderVacationsList();
        computeMonthDayColorsFromCache(); renderCalendar();
        renderDayFromCache();
        showToast('Eroare la ștergere: ' + (e.message || e), 'error', { autoHide: 3000 });
      }
    });
  });
}

async function saveNewVacation(){
  const btn = document.getElementById('saveVacBtn');
  const errEl = document.getElementById('vacError');
  const okEl = document.getElementById('vacSuccess');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const startVal = document.getElementById('vacStart').value;
  const endVal = document.getElementById('vacEnd').value;
  const desc = document.getElementById('vacDesc').value.trim();
  const color = document.getElementById('vacColor').value || '#B3A29B';
  if (!startVal || !endVal){ errEl.textContent = 'Alege data de început și sfârșit.'; errEl.classList.remove('hidden'); return; }
  if (endVal < startVal){ errEl.textContent = 'Data de sfârșit trebuie să fie după data de început.'; errEl.classList.remove('hidden'); return; }

  btn.disabled = true; btn.textContent = 'Se adaugă…';
  const toastId = showToast('Se salvează concediul…', 'saving', { persist: true });
  try {
    const row = await addVacation({ employeeId: state.employee.id, startDate: startVal, endDate: endVal, description: desc, color });
    cache.vacations.push({
      id: row.id, employeeId: row.employee_id,
      start: new Date(row.start_date + 'T00:00:00'), end: new Date(row.end_date + 'T00:00:00'),
      description: row.description || '', color: row.color || color,
    });
    document.getElementById('vacStart').value = '';
    document.getElementById('vacEnd').value = '';
    document.getElementById('vacDesc').value = '';
    document.querySelectorAll('#vacPresetSwatches .preset-swatch').forEach(s => s.classList.remove('active'));
    renderVacationsList();
    computeMonthDayColorsFromCache(); renderCalendar();
    renderDayFromCache();
    okEl.textContent = 'Concediu adăugat.'; okEl.classList.remove('hidden');
    updateToast(toastId, 'Concediu adăugat.', 'success', 1800);
  } catch (e){
    errEl.textContent = 'Eroare la adăugare: ' + (e.message || e); errEl.classList.remove('hidden');
    updateToast(toastId, 'Eroare la adăugare.', 'error', 2600);
  } finally {
    btn.disabled = false; btn.textContent = 'Adaugă concediul';
  }
}

async function getClientHistory(clientId){
  // Verificăm dacă coloana paid_amount există deja (poate fi adăugată mai
  // târziu via SQL-ul din Setări → Statistici) — evită o eroare 42703 pentru
  // cine nu a rulat încă migrarea.
  const paidOk = await paidAmountColumnExists();
  const cols = paidOk
    ? 'start_time, end_time, status, paid_amount, services(name, price)'
    : 'start_time, end_time, status, services(name, price)';
  const { data, error } = await sb.from('appointments')
    .select(cols)
    .eq('client_id', clientId)
    .order('start_time', { ascending: false });
  if (error) throw error;
  return data.map(r => ({
    startTime: new Date(r.start_time),
    endTime: new Date(r.end_time),
    status: r.status,
    serviceName: r.services ? r.services.name : '—',
    // Suma reală încasată (paid_amount) are prioritate; dacă nu a fost
    // înregistrată (programare neterminată încă, sau salvată înainte de
    // migrare), cade pe prețul de listă al serviciului.
    price: (r.paid_amount != null && r.paid_amount !== '')
      ? Number(r.paid_amount)
      : (r.services ? Number(r.services.price) || 0 : 0),
  }));
}

  const notesEl = document.getElementById('clientDetailNotes');
  if (client.notes){ notesEl.textContent = `Notițe: ${client.notes}`; notesEl.classList.remove('hidden'); }
  else { notesEl.textContent = ''; notesEl.classList.add('hidden'); }
  document.getElementById('clientDetailEditBtn').onclick = () => openEditClientModal(client);
  document.getElementById('clientDetailDeleteBtn').onclick = () => deleteClientWithConfirm(client.id, () => document.getElementById('clientDetailModal').close());
  const histEl = document.getElementById('clientHistoryList');
  histEl.innerHTML = `<div class="spinner"></div>`;
  document.getElementById('clientDetailModal').showModal();

  if (String(client.id).startsWith('offline-client')){
    histEl.innerHTML = `<p class="settings-hint" style="margin:0;">Clienta încă nu s-a sincronizat — istoricul va fi disponibil după conectare.</p>`;
    return;
  }
  try {
    const history = await getClientHistory(client.id);
    if (history.length === 0){
      histEl.innerHTML = `<p class="settings-hint" style="margin:0;">Nicio programare încă.</p>`;
      return;
    }
    histEl.innerHTML = history.map(h => `
      <div class="history-row">
        <span class="history-date">${fmtDateShort(h.startTime)}, ${fmtTime(h.startTime)}</span>
        <span class="history-mid">${escapeHtml(h.serviceName)}<span class="history-status" style="background:${h.status === 'cancelled' ? 'var(--muted)' : h.status === 'completed' ? 'var(--success)' : h.status === 'unconfirmed' ? 'var(--warn)' : 'var(--accent)'}">${STATUS_LABELS_RO[h.status] || h.status}</span></span>
        <span class="history-price">${h.price} lei</span>
      </div>
    `).join('');
  } catch (e){
    histEl.innerHTML = `<p class="error-text">${isNetworkError(e) ? 'Fără conexiune — istoricul nu poate fi încărcat acum.' : 'Eroare: ' + escapeHtml(e.message || e)}</p>`;
  }
}

/** Actualizează instant numele/telefonul clientei peste tot în UI: lista
 * generală, picker-ul din modalele de programare, cardul de clientă
 * selectată și programările deja afișate în agendă. */
function applyClientUpdateEverywhere(updated){
  const idx = state.clients.findIndex(c => c.id === updated.id);
  if (idx >= 0) state.clients[idx] = { ...state.clients[idx], ...updated };
  state.clients.sort((a, b) => a.name.localeCompare(b.name));
  cache.appointments.forEach(a => { if (a.clientId === updated.id) a.clientName = updated.name; });
  if (state.appointments) state.appointments.forEach(a => { if (a.clientId === updated.id) a.clientName = updated.name; });
  renderDayFromCache();
}

async function saveEditClient(){
  const id = editClientState.id;
  if (!id) return;
  const btn = document.getElementById('saveEditClientBtn');
  const errEl = document.getElementById('editClientError');
  errEl.classList.add('hidden');
  const name = document.getElementById('editClientName').value.trim();
  const phone = document.getElementById('editClientPhone').value.trim();
  const notes = document.getElementById('editClientNotes').value.trim();
  if (!name){ errEl.textContent = 'Numele clientei este obligatoriu.'; errEl.classList.remove('hidden'); return; }

  btn.disabled = true; btn.textContent = 'Se salvează…';
  const toastId = showToast('Se salvează clienta…', 'saving', { persist: true });
  try {
    let updated;
    if (String(id).startsWith('offline-client')){
      updated = { id, name, phone, notes, pendingOffline: true };
      const pendingItem = state.pendingClients.find(p => p.id === id);
      if (pendingItem){ pendingItem.payload = { name, phone, notes }; savePendingClients(); }
    } else {
      updated = await updateClientRow(id, { name, phone, notes });
    }
    applyClientUpdateEverywhere(updated);
    document.getElementById('editClientModal').close();
    // Reîmprospătează orice listă de cliente vizibilă (pagina Cliente sau picker-ele din modale).
    if (document.getElementById('browseClientList')) renderClientList('browse', document.getElementById('browseClientSearch')?.value || '', openClientDetail, { showActions: true });
    Object.keys(pickerHandlers).forEach(prefix => {
      const search = document.getElementById(`${prefix}ClientSearch`);
      if (search) renderClientList(prefix, search.value, pickerHandlers[prefix]);
    });
    if (document.getElementById('clientDetailModal') && document.getElementById('clientDetailModal').open){
      document.getElementById('clientDetailName').textContent = updated.name;
      document.getElementById('clientDetailPhone').textContent = updated.phone ? `Telefon: ${updated.phone}` : 'Fără telefon salvat';
    }
    updateToast(toastId, 'Clientă actualizată.', 'success', 1800);
  } catch (e){
    errEl.textContent = 'Eroare la salvare: ' + (e.message || e);
    errEl.classList.remove('hidden');
    updateToast(toastId, 'Eroare la salvare.', 'error', 2600);
  } finally {
    btn.disabled = false; btn.textContent = 'Salvează modificările';
  }
}

/** Șterge clienta din Supabase + din memorie, apoi actualizează instant
 * lista de cliente vizibilă. onDone (opțional) rulează după ștergerea reușită. */
async function deleteClientWithConfirm(id, onDone){
  const client = state.clients.find(c => c.id === id);
  if (!client) return;
  if (!(await confirmDialog({ title: 'Ștergi clienta?', message: `Ștergi definitiv clienta „${client.name}”? Această acțiune nu poate fi anulată.`, confirmLabel: 'Șterge clienta' }))) return;
  const toastId = showToast('Se șterge…', 'saving', { persist: true });
  try {
    if (!String(id).startsWith('offline-client')){
      await deleteClientRow(id);
    } else {
      state.pendingClients = state.pendingClients.filter(p => p.id !== id);
      savePendingClients();
    }
    state.clients = state.clients.filter(c => c.id !== id);
    if (document.getElementById('browseClientList')) renderClientList('browse', document.getElementById('browseClientSearch')?.value || '', openClientDetail, { showActions: true });
    Object.keys(pickerHandlers).forEach(prefix => {
      const search = document.getElementById(`${prefix}ClientSearch`);
      if (search) renderClientList(prefix, search.value, pickerHandlers[prefix]);
    });
    updateToast(toastId, 'Clientă ștearsă.', 'success', 1800);
    if (onDone) onDone();
  } catch (e){
    updateToast(toastId, 'Eroare la ștergere: ' + (e.message || e), 'error', 3000);
  }
}

async function refreshUnconfirmedBadge(){
  if (!state.employee) return;

  // Reîmprospătăm și mementourile active (pentru culoarea butonului cu ceas),
  // fără să blocăm restul — un memento poate trece din pending în sent între timp.
  getActiveReminderApptIds(state.employee.id).then(ids => {
    cache.reminderApptIds = ids;
    renderDayFromCache();
  }).catch(() => {});

  const badge = document.getElementById('unconfirmedBadge');
  const badgeBottom = document.getElementById('unconfirmedBadgeBottom');
  if (!badge && !badgeBottom) return;
  try {
    const [{ count: unconfirmedCount, error: err1 }, { count: pastCount, error: err2 }] = await Promise.all([
      sb.from('appointments')
        .select('id', { count: 'exact', head: true })
        .eq('employee_id', state.employee.id)
        .eq('status', 'unconfirmed'),
      sb.from('appointments')
        .select('id', { count: 'exact', head: true })
        .eq('employee_id', state.employee.id)
        .eq('status', 'confirmed')
        .lt('end_time', new Date().toISOString()),
    ]);
    if (err1) throw err1;
    if (err2) throw err2;
    const total = (unconfirmedCount || 0) + (pastCount || 0);
    const label = total > 0 ? (total > 99 ? '99+' : String(total)) : null;
    [badge, badgeBottom].forEach(el => {
      if (!el) return;
      if (label){ el.textContent = label; el.classList.remove('hidden'); }
      else { el.classList.add('hidden'); }
    });
  } catch (e){ /* offline sau eroare - lăsăm badge-urile cum erau */ }
}

async function loadUnconfirmedList(){

      listEl.innerHTML = `<p class="settings-hint" style="margin:0;">Nimic de confirmat sau de încheiat — totul e la zi.</p>`;
      return;
    }

    const unconfirmedHtml = unconfirmed.length ? `
      <h3 class="unconf-section-title">De confirmat</h3>
      ${unconfirmed.map(a => `
        <div class="unconf-card" data-id="${a.id}">
          <div class="unconf-top">

            <div class="unconf-meta">${escapeHtml(a.serviceName || '')} · ${fmtDateHeader(a.startTime)}, ${fmtTime(a.startTime)} - ${fmtTime(a.endTime)}</div>
          </div>
          ${reminderActionsHtml(a)}
          <div class="unconf-actions">
            <button type="button" class="btn-confirm" data-action="confirm">Confirmă</button>
            <button type="button" class="btn-decline" data-action="decline">Anulează</button>
          </div>
        </div>
      `).join('')}
    ` : '';

    const pastHtml = pastUnresolved.length ? `
      <h3 class="unconf-section-title">De încheiat (programări trecute)</h3>
      ${pastUnresolved.map(a => `
        <div class="unconf-card past-unresolved-card" data-id="${a.id}" data-price="${a.servicePrice || 0}">
          <div class="unconf-top">
            <div class="unconf-client">Ai finalizat programarea cu ${escapeHtml(a.clientName || 'Client')} (${escapeHtml(a.serviceName || '')})?</div>
            <div class="unconf-meta">${fmtDateHeader(a.startTime)}, ${fmtTime(a.startTime)} - ${fmtTime(a.endTime)}</div>
          </div>
          <div class="unconf-actions">
            <button type="button" class="btn-confirm" data-action="completed">Finalizată</button>
            <button type="button" class="btn-decline" data-action="cancelled">Anulată</button>
          </div>
          <div class="finalize-row hidden" data-role="finalize-row">
            <input type="number" min="0" step="0.01" data-role="paid-amount" value="${a.servicePrice || 0}" />
            <button type="button" class="btn-primary" data-role="confirm-amount">Salvează</button>
          </div>
        </div>
      `).join('')}
    ` : '';

    listEl.innerHTML = unconfirmedHtml + pastHtml;

    listEl.querySelectorAll('.unconf-card:not(.past-unresolved-card)').forEach(card => {
      const id = card.dataset.id;
      card.querySelector('[data-action="confirm"]').addEventListener('click', () => handleUnconfirmedAction(id, 'confirmed', card));
      card.querySelector('[data-action="decline"]').addEventListener('click', () => handleUnconfirmedAction(id, 'cancelled', card));
    });

    listEl.querySelectorAll('.past-unresolved-card').forEach(card => {
      const id = card.dataset.id;
      const finalizeRow = card.querySelector('[data-role="finalize-row"]');
      card.querySelector('[data-action="cancelled"]').addEventListener('click', () => handlePastUnresolvedCancel(id, card));
      card.querySelector('[data-action="completed"]').addEventListener('click', () => {
        finalizeRow.classList.remove('hidden');
        card.querySelector('[data-action="completed"]').disabled = true;
        card.querySelector('[data-action="cancelled"]').disabled = true;
        finalizeRow.querySelector('[data-role="paid-amount"]').focus();
      });
      finalizeRow.querySelector('[data-role="confirm-amount"]').addEventListener('click', () => {
        const amount = parseFloat(finalizeRow.querySelector('[data-role="paid-amount"]').value);
        handlePastUnresolvedFinalize(id, isNaN(amount) ? 0 : amount, card);
      });
    });

    wireReminderCopyButtons(listEl);
  } catch (e){
    listEl.innerHTML = `<p class="error-text">${isNetworkError(e) ? 'Fără conexiune — lista nu poate fi încărcată acum.' : 'Eroare: ' + escapeHtml(e.message || e)}</p>`;
  }
}

async function handleUnconfirmedAction(id, newStatus, cardEl){
  const buttons = cardEl.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  const toastId = showToast(newStatus === 'confirmed' ? 'Se confirmă…' : 'Se anulează…', 'saving', { persist: true });
  const idx = cache.appointments.findIndex(a => a.id === id);
  try {
    await setAppointmentStatus(id, newStatus);
    if (idx >= 0) cache.appointments[idx] = { ...cache.appointments[idx], status: newStatus };
    cardEl.remove();
    updateToast(toastId, newStatus === 'confirmed' ? 'Programare confirmată.' : 'Programare anulată.', 'success', 1800);
    if (!document.querySelector('#unconfirmedList .unconf-card')){
      document.getElementById('unconfirmedList').innerHTML = `<p class="settings-hint" style="margin:0;">Nicio programare neconfirmată.</p>`;
    }
    refreshUnconfirmedBadge();
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
  } catch (e){
    buttons.forEach(b => b.disabled = false);
    updateToast(toastId, 'Eroare: ' + (e.message || e), 'error', 3000);
  }
}

async function handlePastUnresolvedCancel(id, cardEl){
  const buttons = cardEl.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  const toastId = showToast('Se anulează…', 'saving', { persist: true });
  const idx = cache.appointments.findIndex(a => a.id === id);
  try {
    await updateAppointmentRow(id, { status: 'cancelled' });
    if (idx >= 0) cache.appointments[idx] = { ...cache.appointments[idx], status: 'cancelled' };
    cardEl.remove();
    updateToast(toastId, 'Programare anulată.', 'success', 1800);
    refreshAfterPastResolution();
  } catch (e){
    buttons.forEach(b => b.disabled = false);
    updateToast(toastId, 'Eroare: ' + (e.message || e), 'error', 3000);
  }
}

async function handlePastUnresolvedFinalize(id, amount, cardEl){
  const buttons = cardEl.querySelectorAll('button, input');
  buttons.forEach(b => b.disabled = true);
  const toastId = showToast('Se salvează…', 'saving', { persist: true });
  const idx = cache.appointments.findIndex(a => a.id === id);
  try {
    await updateAppointmentRow(id, { status: 'completed', paid_amount: amount });
    if (idx >= 0) cache.appointments[idx] = { ...cache.appointments[idx], status: 'completed', paidAmount: amount };
    cardEl.remove();
    updateToast(toastId, 'Programare finalizată — venit înregistrat.', 'success', 2200);
    refreshAfterPastResolution();
  } catch (e){
    buttons.forEach(b => b.disabled = false);
    const missingColumn = e && (e.code === '42703' || (e.message || '').toLowerCase().includes('paid_amount'));
    updateToast(toastId, missingColumn
      ? 'Coloana paid_amount lipsește încă din Supabase — rulează SQL-ul din Setări → Statistici.'
      : 'Eroare: ' + (e.message || e), 'error', 4200);
  }
}

/** Combină cronologic programările cu clientele, turele de la celălalt job
 * și sarcinile custom din următoarele 14 zile, într-o singură listă. */
async function loadUpcomingList(){
  const listEl = document.getElementById('upcomingList');
  listEl.innerHTML = `<div class="spinner"></div>`;
  if (!state.employee){ listEl.innerHTML = `<p class="settings-hint" style="margin:0;">Nicio angajată configurată.</p>`; return; }

  const from = new Date();
  const to = new Date(); to.setDate(to.getDate() + 14);

  try {
    const [appts, blocksRaw, tasksRaw] = await Promise.all([
      getAppointments({ employeeId: state.employee.id, from, to }),
      getMainJobBlocks({ employeeId: state.employee.id, from, to }),
      getCustomTasks({ employeeId: state.employee.id, from, to }),
    ]);

    const items = [
      ...appts.filter(a => a.status !== 'cancelled').map(a => ({
        start: a.startTime, end: a.endTime,
        label: `Programare ${a.clientName || 'Client'} - ${a.serviceName || ''}`,
      })),
      ...blocksRaw.map(b => ({
        start: new Date(b.start_time), end: new Date(b.end_time),
        label: `Muncă de la ora ${fmtTime(new Date(b.start_time))} la ${fmtTime(new Date(b.end_time))}`,
      })),
      ...tasksRaw.map(t => ({
        start: new Date(t.start_time), end: new Date(t.end_time),
        label: t.title,
      })),
    ].sort((a, b) => a.start - b.start);

    if (items.length === 0){
      listEl.innerHTML = `<p class="settings-hint" style="margin:0;">Nimic programat în următoarele 14 zile.</p>`;
      return;
    }

    listEl.innerHTML = items.map(it => `
      <div class="upcoming-item ${isPastItem(it.end) ? 'past-item' : ''}">
        <div class="upcoming-when">${fmtDateDDMMYYYY(it.start)}, ${fmtTime(it.start)}</div>

      </div>
    `).join('');
  } catch (e){
    listEl.innerHTML = `<p class="error-text">${isNetworkError(e) ? 'Fără conexiune — lista nu poate fi încărcată acum.' : 'Eroare: ' + escapeHtml(e.message || e)}</p>`;
  }

  const okEl = document.getElementById('hoursSuccess');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const rows = DAYS_MON_FIRST.map(({ jsDay }) => {
    const s = document.querySelector(`.time-input[data-jsday="${jsDay}"][data-role="start"]`);
    const e = document.querySelector(`.time-input[data-jsday="${jsDay}"][data-role="end"]`);
    return { weekday: jsDay, startMin: hhmmToMinutes(s.value || '08:00'), endMin: hhmmToMinutes(e.value || '22:00') };
  });
  const bad = rows.find(r => r.endMin <= r.startMin);
  if (bad){ errEl.textContent = 'Ora de sfârșit trebuie să fie după ora de început, pentru fiecare zi.'; errEl.classList.remove('hidden'); return; }

  const toastId = showToast('Se salvează…', 'saving', { persist: true });
  btn.disabled = true; btn.textContent = 'Se salvează…';

    await saveWeekdayHours(state.employee.id, rows);
    rows.forEach(r => { state.weekdayHours[r.weekday] = { startMin: r.startMin, endMin: r.endMin }; });
    state.weekdayHoursMissingTable = false;
    renderHoursRows();
    // Reîmprospătăm live ecranul principal (calendar + agenda zilei), chiar
    // dacă suntem încă în Setări — la revenire, totul e deja la zi.
    await loadMonthDots();
    renderDayFromCache();
    okEl.textContent = 'Salvat.'; okEl.classList.remove('hidden');
    updateToast(toastId, 'Interval orar salvat.', 'success', 1800);
  } catch (e){
    errEl.textContent = 'Eroare la salvare: ' + (e.message || e); errEl.classList.remove('hidden');
    updateToast(toastId, 'Eroare la salvare.', 'error', 2600);
  } finally {

  }

async function loadWeekRows(){
  const weekStart = settingsState.weekStart;
  const weekEndLabel = new Date(weekStart); weekEndLabel.setDate(weekEndLabel.getDate() + 6);
  document.getElementById('weekRangeLabel').textContent = `${fmtDateShort(weekStart)} – ${fmtDateShort(weekEndLabel)}`;
  const wrap = document.getElementById('weekRows');
  wrap.innerHTML = `<div class="spinner"></div>`;

  let blocksByDate = {};
  if (state.employee){
    try {
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 7);
      const blocks = await getMainJobBlocks({ employeeId: state.employee.id, from: weekStart, to: weekEnd });
      blocks.forEach(b => {
        const s = new Date(b.start_time);
        const key = ymd(s);
        if (!blocksByDate[key]) blocksByDate[key] = { start: s, end: new Date(b.end_time) };
      });
    } catch (e){ /* continuăm cu zile libere dacă nu găsim nimic */ }
  }

  wrap.innerHTML = DAYS_MON_FIRST.map(({ jsDay, label }, i) => {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    const key = ymd(d);
    const existing = blocksByDate[key];
    const off = !existing;
    const existingStartHHMM = existing ? minutesToHHMM(existing.start.getHours()*60+existing.start.getMinutes()) : '';
    const existingEndHHMM = existing ? minutesToHHMM(existing.end.getHours()*60+existing.end.getMinutes()) : '';
    const matchedPreset = JOB_SHIFT_PRESETS.find(p => p.start === existingStartHHMM && p.end === existingEndHHMM);
    return `
      <div class="wd-row" data-date="${key}" data-shift="${matchedPreset ? matchedPreset.value : ''}">
        <div class="wd-row-top">
          <div class="wd-label">${label}<span class="wd-date">${fmtDateShort(d)}</span></div>
          <label class="wd-off"><input type="checkbox" class="wk-off" ${off ? 'checked' : ''} /> Liber</label>
        </div>
        <div class="shift-pill-group">
          ${JOB_SHIFT_PRESETS.map(p => `
            <button type="button" class="shift-pill ${matchedPreset && matchedPreset.value === p.value ? 'active' : ''}" data-value="${p.value}" ${off ? 'disabled' : ''}>${p.label}</button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.wd-row').forEach(row => {
    const offCb = row.querySelector('.wk-off');
    const pills = row.querySelectorAll('.shift-pill');
    offCb.addEventListener('change', () => {
      pills.forEach(p => { p.disabled = offCb.checked; });
      if (offCb.checked){ row.dataset.shift = ''; pills.forEach(p => p.classList.remove('active')); }
    });
    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        row.dataset.shift = pill.dataset.value;
      });
    });
  });
}

async function saveWeek(){
  if (!state.employee) return;
  const btn = document.getElementById('saveWeekBtn');
  const errEl = document.getElementById('weekError');
  const okEl = document.getElementById('weekSuccess');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const toastId = showToast('Se salvează…', 'saving', { persist: true });
  btn.disabled = true; btn.textContent = 'Se salvează…';
  const problems = [];
  const rows = Array.from(document.querySelectorAll('#weekRows .wd-row'));

  for (const row of rows){
    const dateKey = row.dataset.date;
    const [yy, mm, dd] = dateKey.split('-').map(Number);
    const day = new Date(yy, mm - 1, dd);
    const off = row.querySelector('.wk-off').checked;
    const shiftVal = row.dataset.shift;
    const preset = JOB_SHIFT_PRESETS.find(p => p.value === shiftVal);
    try {
      if (off || !preset){ await clearDayJobBlock(state.employee.id, day); continue; }
      const startVal = preset.start;
      const endVal = preset.end;
      const dayStart = new Date(yy, mm - 1, dd, 0, 0);
      const dayEnd = new Date(yy, mm - 1, dd, 23, 59);
      const appts = await getAppointments({ employeeId: state.employee.id, from: dayStart, to: dayEnd });
      const [sh, sm] = startVal.split(':').map(Number);
      const [eh, em] = endVal.split(':').map(Number);
      const blockStart = new Date(yy, mm - 1, dd, sh, sm);
      const blockEnd = new Date(yy, mm - 1, dd, eh, em);
      const conflict = appts.find(a => a.status !== 'cancelled' && a.startTime < blockEnd && a.endTime > blockStart);
      if (conflict){ problems.push(`${fmtDateShort(day)}: ai deja o programare (${fmtTime(conflict.startTime)}) în acel interval — anuleaz-o sau alege alt interval.`); continue; }
      await setDayJobBlock(state.employee.id, day, startVal, endVal);
    } catch (e){ problems.push(`${fmtDateShort(day)}: ${e.message || e}`); }
  }

  // Ture noi/modificate → cache.jobBlocks e stale. Re-descărcăm intervalul deja
  // cunoscut și reîmprospătăm live calendarul + agenda zilei (cerința 1).
  await forceRefreshCache();
  computeMonthDayColorsFromCache();
  renderCalendar();
  renderDayFromCache();

  btn.disabled = false; btn.textContent = 'Salvează programul săptămânii';
  if (problems.length){
    errEl.innerHTML = problems.map(p => escapeHtml(p)).join('<br/>'); errEl.classList.remove('hidden');
    updateToast(toastId, 'Salvat parțial — vezi detaliile.', 'warning', 3000);
  } else {
    okEl.textContent = 'Salvat.'; okEl.classList.remove('hidden');
    updateToast(toastId, 'Programul săptămânii a fost salvat.', 'success', 1800);
  }
  loadMonthDots();
}

const lightboxState = { images: [], index: 0 };

function ensureLightboxModal(){
  if (document.getElementById('lightboxModal')) return;

      </button>
      <button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
      <img id="lightboxImg" class="lightbox-img" alt="" />
      <button type="button" class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
      <div class="lightbox-counter" id="lightboxCounter"></div>
    </dialog>
  `;
  document.body.appendChild(wrap.firstElementChild);
  const dlg = document.getElementById('lightboxModal');
  document.getElementById('lightboxClose').addEventListener('click', () => dlg.close());
  document.getElementById('lightboxPrev').addEventListener('click', () => shiftLightbox(-1));
  document.getElementById('lightboxNext').addEventListener('click', () => shiftLightbox(1));
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
}

function shiftLightbox(delta){
  const n = lightboxState.images.length;
  lightboxState.index = ((lightboxState.index + delta) % n + n) % n;
  renderLightbox();
}

function renderLightbox(){
  document.getElementById('lightboxImg').src = lightboxState.images[lightboxState.index];
  document.getElementById('lightboxCounter').textContent = `${lightboxState.index + 1} / ${lightboxState.images.length}`;
  const multi = lightboxState.images.length > 1;
  document.getElementById('lightboxPrev').classList.toggle('hidden', !multi);
  document.getElementById('lightboxNext').classList.toggle('hidden', !multi);
}

function openLightbox(images, index){
  ensureLightboxModal();
  lightboxState.images = images;
  lightboxState.index = Math.min(Math.max(index, 0), images.length - 1);
  renderLightbox();
  document.getElementById('lightboxModal').showModal();
}

  const tagsRaw = document.getElementById('svcTags').value.trim();
  const description = document.getElementById('svcDescription').value.trim();

  const tags = parseTagsField(tagsRaw);

  if (!name){ errEl.textContent = 'Numele serviciului este obligatoriu.'; errEl.classList.remove('hidden'); return; }
  if (!durationMinutes || durationMinutes <= 0){ errEl.textContent = 'Durata trebuie să fie un număr de minute mai mare ca 0.'; errEl.classList.remove('hidden'); return; }
  if (isNaN(price) || price < 0){ errEl.textContent = 'Prețul trebuie să fie un număr valid.'; errEl.classList.remove('hidden'); return; }

  const toastId = showToast('Se adaugă serviciul…', 'saving', { persist: true });
  btn.disabled = true; btn.textContent = 'Se adaugă…';
  try {
    await addService({
      name, durationMinutes, price, color,
      imageUrl: images[0] || '', description,
      images, tags,
      includeMedia: !!state.serviceMediaColumnsOk,
      includeGallery: !!state.serviceGalleryColumnsOk,

    updateToast(toastId, 'Serviciu adăugat.', 'success', 1800);
  } catch (e){
    if (e.code === '42703'){ errEl.textContent = 'O coloană nouă nu există încă — rulează SQL-ul de mai sus în Supabase, apoi încearcă din nou.'; }
    else { errEl.textContent = 'Eroare la adăugare: ' + (e.message || e); }

    updateToast(toastId, 'Eroare la adăugare.', 'error', 2600);

async function changeStatsMonth(delta){
  const d = new Date(statsState.month);
  d.setMonth(d.getMonth() + delta);
  statsState.month = d;
  loadStats(); // instant, din cache
  // Dacă luna aleasă e în afara ferestrei deja cache-uite, o extindem în fundal
  // (fără spinner) și recalculăm — dar loadStats însuși rămâne 100% din cache.
  const from = new Date(d.getFullYear(), d.getMonth(), 1);
  const to = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999);
  if (!cacheRangeCovers(from, to)){
    try { await ensureRangeCached(from, to); loadStats(); } catch (e){ /* offline — rămân datele locale */ }
  }
}

/** Calculează statisticile lunii selectate direct din cache.appointments —
 * 0ms, fără nicio cerere de rețea către Supabase. Prețul fiecărui serviciu
 * este preluat din state.services (deja încărcat în memorie). */
function loadStats(){
  const label = document.getElementById('statsMonthLabel');
  const body = document.getElementById('statsBody');
  if (!label || !body) return;
  label.textContent = fmtMonthHeader(statsState.month);
  if (!state.employee){ body.innerHTML = `<p class="settings-hint" style="margin:0;">Nicio angajată configurată.</p>`; return; }

  const y = statsState.month.getFullYear();
  const m = statsState.month.getMonth();
  const priceById = new Map(state.services.map(s => [s.id, Number(s.price) || 0]));

  // Venitul total ia în calcul EXCLUSIV programările Finalizate (status='completed').
  // Cele anulate sau doar confirmate/neconfirmate nu contează ca venit încasat.
  const completed = cache.appointments.filter(a =>
    a.employeeId === state.employee.id &&
    a.startTime.getFullYear() === y && a.startTime.getMonth() === m &&
    a.status === 'completed'
  );
  const total = completed.reduce((sum, a) => {
    const amount = (a.paidAmount != null) ? a.paidAmount : (priceById.get(a.serviceId) || 0);
    return sum + amount;
  }, 0);
  const distinctClients = new Set(completed.map(a => a.clientId)).size;

  const setupNote = state.paidAmountColumnOk ? '' : `
    <div class="setup-note">
      Coloana <code>paid_amount</code> nu există încă pe <code>appointments</code> — până o adaugi,
      venitul se calculează din prețul standard al serviciului. Rulează o dată în
      <strong>Supabase → SQL Editor</strong>:
      <pre>${escapeHtml(PAID_AMOUNT_SETUP_SQL)}</pre>
      <button class="btn-outline" id="copyPaidAmountSqlBtn" type="button">Copiază SQL</button>
    </div>
  `;

  body.innerHTML = `
    ${setupNote}
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">${total.toLocaleString('ro-RO')} lei</div>
        <div class="stat-label">Venit total (programări finalizate)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${distinctClients}</div>
        <div class="stat-label">Cliente servite</div>
      </div>
    </div>
  `;

  if (!state.paidAmountColumnOk){
    const btn = document.getElementById('copyPaidAmountSqlBtn');
    if (btn) btn.addEventListener('click', async (e) => {
      try { await navigator.clipboard.writeText(PAID_AMOUNT_SETUP_SQL); e.target.textContent = 'Copiat!'; setTimeout(() => { e.target.textContent = 'Copiază SQL'; }, 1800); }
      catch (err){ showToast('Nu am putut copia automat — selectează manual textul de mai sus.', 'error', { autoHide: 3200 }); }
    });
  }
}

/** Randează cardurile de servicii într-un container dat, filtrate opțional
 * după un termen de căutare (nume) — folosită atât de #servicePicker
 * (Programare nouă) cât și de #editServicePicker (Editare programare). */
function renderServiceCardsInto(wrapId, selectedId, searchTerm){
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  if (state.services.length === 0){
    wrap.innerHTML = `<p class="settings-hint" style="margin:0;">Niciun serviciu configurat încă — adaugă unul din Modele.</p>`;
    return;
  }
  const term = (searchTerm || '').trim().toLowerCase();
  const filtered = term ? state.services.filter(s => s.name.toLowerCase().includes(term)) : state.services;
  if (filtered.length === 0){
    wrap.innerHTML = `<p class="settings-hint" style="margin:0;">Niciun serviciu găsit pentru „${escapeHtml(searchTerm)}”.</p>`;
    return;
  }
  // Card compact, fără poze — doar bulina de culoare, numele, durata și
  // prețul, ca să ocupe cât mai puțin spațiu vertical pe mobil.
  wrap.innerHTML = filtered.map(s => `
    <button type="button" class="service-card ${s.id === selectedId ? 'selected' : ''}" data-id="${s.id}">
      <span class="service-card-dot" style="background:${s.color}"></span>
      <span class="service-card-info">
        <span class="service-card-name">${escapeHtml(s.name)}</span>
        <span class="service-card-meta">${s.durationMinutes} min · ${s.price} lei</span>
      </span>
      <span class="service-card-check">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
    </button>
  `).join('');
}

function openPushReminderModal(appt){
  ensurePushReminderModal();
  const dlg = document.getElementById('pushReminderModal');
  document.getElementById('pushReminderApptInfo').textContent =
    `${escapeHtml(appt.clientName || 'Client')} — ${fmtDateHeader(appt.startTime)}, ${fmtTime(appt.startTime)}`;
  document.getElementById('pushReminderNote').textContent = '';

  const pillsWrap = document.getElementById('pushReminderPills');
  pillsWrap.querySelectorAll('.shift-pill').forEach(btn => {
    btn.onclick = async () => {
      const minutes = Number(btn.dataset.minutes);
      const sendAt = new Date(appt.startTime.getTime() - minutes * 60000);
      const noteEl = document.getElementById('pushReminderNote');
      btn.disabled = true;
      try {
        await createCustomReminder({ appointmentId: appt.id, employeeId: appt.employeeId, scheduledSendAt: sendAt });
        cache.reminderApptIds.add(appt.id);
        renderDayFromCache();
        const inPast = sendAt.getTime() <= Date.now();
        showToast(
          inPast
            ? 'Memento adăugat — ora aleasă a trecut deja, se va trimite la următoarea verificare.'
            : `Memento adăugat pentru ${fmtDateHeader(sendAt)}, ${fmtTime(sendAt)}.`,
          'success',
          { autoHide: 3000 }
        );
        dlg.close();
      } catch (e){
        if (e.code === 'ALREADY_SCHEDULED'){
          showToast('Există deja un memento programat exact la această oră pentru această programare.', 'info', { autoHide: 3200 });
          cache.reminderApptIds.add(appt.id);
          renderDayFromCache();
          dlg.close();
          return;
        }
        noteEl.textContent = 'Eroare: ' + (e.message || e);
        noteEl.classList.add('error-text');
      } finally {
        btn.disabled = false;
      }

async function saveNewTask(){
  const errEl = document.getElementById('newTaskError');
  errEl.classList.add('hidden');
  if (!state.employee) return;

  const title = document.getElementById('taskTitle').value.trim();
  const startDateVal = document.getElementById('taskStartDate').value;
  const endDateVal = document.getElementById('taskEndDate').value || startDateVal;
  const startVal = document.getElementById('taskStart').value;
  const endVal = document.getElementById('taskEnd').value; // opțional
  const color = document.getElementById('taskColor').value || DEFAULT_TASK_COLOR;

  if (!title){ errEl.textContent = 'Introdu un titlu.'; errEl.classList.remove('hidden'); return; }
  if (!startDateVal || !startVal){ errEl.textContent = 'Completează data și ora de început.'; errEl.classList.remove('hidden'); return; }
  if (endDateVal < startDateVal){ errEl.textContent = 'Data de sfârșit nu poate fi înainte de data de început.'; errEl.classList.remove('hidden'); return; }

  const [sy, sm2, sd] = startDateVal.split('-').map(Number);
  const [ey, em2, ed] = endDateVal.split('-').map(Number);
  const [sh, smin] = startVal.split(':').map(Number);
  const start = new Date(sy, sm2 - 1, sd, sh, smin);

  const isMultiDay = endDateVal !== startDateVal;
  let end;
  if (endVal){
    const [eh, emin] = endVal.split(':').map(Number);
    end = new Date(ey, em2 - 1, ed, eh, emin);
  } else if (isMultiDay){
    // fără oră de sfârșit specificată, pe mai multe zile → sfârșitul ultimei zile
    end = new Date(ey, em2 - 1, ed, 23, 59);
  } else {
    // fără oră de sfârșit, o singură zi → implicit o oră mai târziu
    end = new Date(start.getTime() + 60 * 60 * 1000);
  }

  if (end <= start){ errEl.textContent = 'Ora de sfârșit trebuie să fie după cea de început.'; errEl.classList.remove('hidden'); return; }

  const btn = document.getElementById('saveNewTaskBtn');
  const editingId = taskModalState.editingId;
  btn.disabled = true; btn.textContent = 'Se salvează…';
  const toastId = showToast('Se salvează…', 'saving', { persist: true });
  try {
    if (editingId){
      await updateCustomTask(editingId, { title, start, end, color });
      const idx = cache.customTasks.findIndex(t => t.id === editingId);
      if (idx >= 0) cache.customTasks[idx] = { ...cache.customTasks[idx], title, start, end, color };
      updateToast(toastId, 'Sarcină actualizată.', 'success', 1800);
    } else {
      await createCustomTask({ employeeId: state.employee.id, title, start, end, color });
      cache.customTasks.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), employeeId: state.employee.id, title, start, end, color });
      updateToast(toastId, 'Sarcină salvată.', 'success', 1800);
    }
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
    document.getElementById('newTaskModal').close();
    taskModalState.editingId = null;
    // Reconciliem cu rândul real din Supabase (id-ul corect), fără să blocăm UI-ul.
    forceRefreshCache().then(() => {
      renderDayFromCache();
      computeMonthDayColorsFromCache();
      renderCalendar();
    });
  } catch (e){
    updateToast(toastId, 'Eroare la salvare: ' + (e.message || e), 'error', 3200);
  } finally {
    btn.disabled = false; btn.textContent = editingId ? 'Salvează modificările' : 'Salvează sarcina';
  }
}

async function refreshSlots(){
  const wrap = document.getElementById('slotsWrap');
  const section = document.getElementById('slotsSection');
  const hint = document.getElementById('slotsHint');
  modalState.selectedSlot = null;
  updateSaveEnabled();
  if (findVacationForDay(modalState.day)){
    section.classList.add('hidden'); hint.classList.add('hidden');
    return;
  }
  if (!modalState.selectedService){
    section.classList.add('hidden'); hint.classList.remove('hidden');
    hint.textContent = 'Alege mai întâi un serviciu ca să vezi orele libere.';
    return;
  }
  hint.classList.remove('hidden'); hint.textContent = 'Se calculează orele libere…';
  section.classList.add('hidden');
  try {
    const slots = await getFreeSlots({ employeeId: state.employee.id, day: modalState.day, serviceDurationMinutes: modalState.selectedService.durationMinutes });
    modalState.slots = slots;
    if (slots.length === 0){ hint.textContent = 'Nu există ore libere în această zi pentru durata aleasă.'; section.classList.add('hidden'); return; }
    hint.classList.add('hidden'); section.classList.remove('hidden');
    wrap.innerHTML = slots.map((s, i) => `<button type="button" class="slot-btn" data-i="${i}"><span class="dot"></span>${fmtTime(s.start)}</button>`).join('');
    wrap.querySelectorAll('.slot-btn').forEach(btnEl => {
      btnEl.addEventListener('click', () => {
        wrap.querySelectorAll('.slot-btn').forEach(c => c.classList.remove('selected'));
        btnEl.classList.add('selected');
        modalState.selectedSlot = modalState.slots[Number(btnEl.dataset.i)];
        updateSaveEnabled();
      });
    });
  } catch (e){
    hint.textContent = isNetworkError(e) ? 'Fără conexiune — nu se pot calcula orele libere acum.' : 'Eroare la calculul orelor libere: ' + (e.message || e);
  }
}

function updateSaveEnabled(){
  const blocked = !!findVacationForDay(modalState.day);
  const ok = modalState.selectedClient && modalState.selectedService && modalState.selectedSlot && !blocked;
  document.getElementById('saveAppt').disabled = !ok;
}

/** Salvare optimistă: intră instant în cache + UI (0ms), apoi confirmă
 * în fundal către Supabase. Fără conexiune -> coadă offline. La orice altă
 * eroare -> rollback + notificare. */
async function saveAppointment(){
  if (!modalState.selectedClient || !modalState.selectedService || !modalState.selectedSlot) return;
  if (findVacationForDay(modalState.day)) return;
  document.getElementById('modalError').classList.add('hidden');

  const employeeId = state.employee.id;
  const clientId = modalState.selectedClient.id;
  const serviceId = modalState.selectedService.id;
  const start = modalState.selectedSlot.start;
  const end = modalState.selectedSlot.end;

  const optimisticId = uid('optimistic-appt');
  const optimistic = {
    id: optimisticId, employeeId, clientId, serviceId,
    startTime: start, endTime: end, status: 'unconfirmed', notes: null,
    clientName: modalState.selectedClient.name,
    serviceName: modalState.selectedService.name,
    serviceColor: modalState.selectedService.color,
    optimisticPending: true,
  };

  cache.appointments.push(optimistic);
  document.getElementById('addModal').close();
  syncMainViewToDay(modalState.day);
  renderDayFromCache();
  computeMonthDayColorsFromCache();
  renderCalendar();

  const toastId = showToast('Se salvează programarea…', 'saving', { persist: true });

  const goOffline = () => {
    const item = queueOfflineAppointment({ employeeId, clientId, serviceId, start: start.toISOString(), end: end.toISOString(), notes: null, status: 'unconfirmed' });
    const idx = cache.appointments.findIndex(a => a.id === optimisticId);
    if (idx >= 0) cache.appointments[idx] = { ...optimistic, id: item.id, pendingOffline: true, optimisticPending: false };
    renderDayFromCache();
    updateToast(toastId, 'Fără conexiune — programarea a fost salvată local și se sincronizează automat.', 'warning', 3600);
  };

  if (!navigator.onLine){ goOffline(); return; }

  try {
    const row = await addAppointment({ employeeId, clientId, serviceId, start, end, notes: null, status: 'unconfirmed' });
    const idx = cache.appointments.findIndex(a => a.id === optimisticId);
    if (idx >= 0) cache.appointments[idx] = mapApptRow(row);
    renderDayFromCache();
    computeMonthDayColorsFromCache();
    renderCalendar();
    refreshUnconfirmedBadge();
    updateToast(toastId, 'Programare salvată.', 'success', 1800);
  } catch (e){
    if (isNetworkError(e)){
      goOffline();
    } else {
      cache.appointments = cache.appointments.filter(a => a.id !== optimisticId);
      renderDayFromCache();
      computeMonthDayColorsFromCache();
      renderCalendar();
      updateToast(toastId, 'Eroare la salvare — programarea a fost anulată: ' + (e.message || e), 'error', 4200);
    }
  }
}

 * curent selectată acolo. */
function checkEditVacation(){
  const banner = document.getElementById('editVacationWarning');

  if (vac){
    banner.classList.remove('hidden');

  } else {

/** FEATURE 2: la schimbarea serviciului, păstrează ora de început curentă
 * și recalculează automat ora de sfârșit (start + noua durată). Dacă noul
 * interval nu se suprapune cu nimic, arată un mesaj verde și NU deschide
 * lista de sloturi. Dacă se suprapune, arată un avertisment roșu și
 * deschide automat selectorul de oră nouă. */
function handleServiceChangeSmart(){
  const msgEl = document.getElementById('editSmartMsg');
  if (!editState.selectedService || !editState.selectedSlot || !editState.selectedSlot.start){
    if (msgEl){ msgEl.classList.add('hidden'); msgEl.innerHTML = ''; }
    enterChangeTimeMode();
    refreshEditSlots();
    return;
  }
  const newStart = editState.selectedSlot.start;
  const newEnd = new Date(newStart.getTime() + editState.selectedService.durationMinutes * 60000);
  const conflict = findConflictInCache({
    employeeId: state.employee.id,
    day: editState.day,
    start: newStart,
    end: newEnd,
    excludeApptId: editState.apptId,
  });

  if (!conflict){
    editState.selectedSlot = { start: newStart, end: newEnd };
    renderCurrentSlotBox();
    if (msgEl){
      msgEl.classList.remove('hidden');
      msgEl.style.color = 'var(--success)';
      msgEl.innerHTML = `✓ Păstrează ora ${fmtTime(newStart)}. Noul interval va fi <strong>${fmtTime(newStart)} – ${fmtTime(newEnd)}</strong>.`;
    }
  } else {
    if (msgEl){
      msgEl.classList.remove('hidden');
      msgEl.style.color = 'var(--accent)';
      const conflictLabel = conflict.type === 'appt'
        ? `altă programare${conflict.clientName ? ' (' + escapeHtml(conflict.clientName) + ')' : ''} de la ${fmtTime(conflict.start)}`
        : conflict.type === 'block' ? `celălalt job de la ${fmtTime(conflict.start)}`
        : `programul de lucru din această zi`;
      msgEl.innerHTML = `⚠ Atenție: Noul serviciu se suprapune cu ${conflictLabel}! Alege o oră nouă.`;
    }
    enterChangeTimeMode();
    refreshEditSlots();
  }
}
